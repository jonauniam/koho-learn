ự."],["Bơh Kòn Mơnus neh tus ò di nàng cau duh broă Khai in, mơya nàng duh broă cau in mơ phi bơta kis Khai lơh gơs phan tơwài oă cau.","Vì Con Người đã đến không phải để người ta phục vụ Mình, nhưng để phục vụ người ta và phó sự sống của Mình làm giá chuộc cho nhiều người."]],"rs":[["{Ñchi} mê kòñ Añ lơh mê {in taih}?","Ngươi muốn Ta làm gì cho ngươi?"],["Dễ","đươn"],["Khó","kalke"],["Cau pas sơrm mut tòm lơgar Yàng Tom Trồ la kalke ngan!","Đức Chúa Jêsus ngó xung-quanh, và phán cùng môn-đồ rằng: Những kẻ giàu vào nước Đức Chúa Trời là khó biết bao!"],["Lạcđa mut tòm trồm jrum la đươn rlau mơ...","Con lạc-đà chui qua lỗ kim còn dễ hơn một người giàu vào nước Đức Chúa Trời."],["Bên phải","đah ma"],["Bên trái","đah kiau"],["dan ai bol hi in geh nggui đô nă đah ma, đô nă đah kiau Kơnràñ.","một người bên hữu, một người bên tả Ngài"],["Trái lại / Ngược lại","Gơpơrlơ̆ wơl"],["Mơya tòm bol mê gen ò di behơ̆ ò. Gơpơrlơ̆ wơl, cau lơi tòm bol mê kòñ gơs dờng gen pal lơh gơs cau duh broă.","Nhưng trong các ngươi thì không như vậy; trái lại, hễ ai muốn làm lớn trong các ngươi, thì sẽ làm đầy-tớ;"],["Tuyệt nhiên không thể","ò tơngha kờm"],["cau lơi ò dòp lơgar Yàng Tom Trồ be đô nă kơnòm dềt, gen ò tơngha kờm tơmut lơh.","thì tuyệt nhiên chẳng vào đó được"],["Ơ Yàng Jesu, Kòn bơtau Dabit, dan nđàc sơngit di añ ƀà!","xin thương xót tôi cùng / với!"],["Gấp trăm lần hơn","dô rhiăng dơ̆ rlau mơ"],["gen rơp dòp leng tòm tŭ do mơ tòm rài do, dô rhiăng dơ̆ rlau mơ ală hìu đam, oh mi...","nhận lại gấp một trăm lần hơn"],["kòn mơnus bañ cah is ală cau mơ Yàng Tom Trồ neh bơkoat bal.","những người mà Đức Chúa Trời đã kết hợp"]],"rules":[{"t":"Câu hỏi Đáp ứng Nhu cầu \"Bạn muốn tôi làm gì cho bạn?\"","f":"{Ñchi} + [Chủ ngữ] + kòñ + [Tôi] + lơh + [Chủ ngữ] + {in taih}?","ex":[["{Ñchi} mê kòñ Añ lơh mê {in taih}?","Ngươi muốn Ta làm gì cho ngươi?"]],"c":"Mẫu câu lịch sự và thực tế nhất khi đề nghị giúp đỡ ai đó trong giao tiếp hàng ngày."},{"t":"Cặp Tính từ Đối lập \"Dễ\" (đươn) & \"Khó\" (kalke)","f":"Khó: [Mệnh đề V] + {la kalke ngan} Dễ hơn: [A] {la} đươn {rlau mơ} [{B}]","ex":[["Dễ","đươn"],["Khó","kalke"],["Cau pas sơrm mut tòm lơgar Yàng Tom Trồ la kalke ngan!","Đức Chúa Jêsus ngó xung-quanh, và phán cùng môn-đồ rằng: Những kẻ giàu vào nước Đức Chúa Trời là khó biết bao!"],["Lạcđa mut tòm trồm jrum la đươn rlau mơ...","Con lạc-đà chui qua lỗ kim còn dễ hơn một người giàu vào nước Đức Chúa Trời."]],"c":"Đặt cả một cụm chủ– vị ở đầu câu làm chủ ngữ, theo sau bởi {la kalke ngan} (là rất khó) hoặc {la} đươn (là dễ)."},{"t":"Phương hướng \"Bên phải\" (đah ma) & \"Bên trái\" (đah kiau)","f":"đah ma = phía bên phải / tay mặt đah kiau = phía bên trái / tay chiêu","ex":[["Bên phải","đah ma"],["Bên trái","đah kiau"],["dan ai bol hi in geh nggui đô nă đah ma, đô nă đah kiau Kơnràñ.","một người bên hữu, một người bên tả Ngài"]],"c":"Dùng đah ma và đah kiau khi chỉ đường hoặc vị trí ngồi."},{"t":"Liên từ Chuyển ý Đối lập \"Trái lại / Ngược lại\" (Gơpơrlơ̆ wơl)","f":"{Mơya} ... {ò} di {behơ̆ ò}. {Gơpơrlơ̆ wơl}, [Mệnh đề đối lập]","ex":[["Trái lại / Ngược lại","Gơpơrlơ̆ wơl"],["Mơya tòm bol mê gen ò di behơ̆ ò. Gơpơrlơ̆ wơl, cau lơi tòm bol mê kòñ gơs dờng gen pal lơh gơs cau duh broă.","Nhưng trong các ngươi thì không như vậy; trái lại, hễ ai muốn làm lớn trong các ngươi, thì sẽ làm đầy-tớ;"]],"c":"{Gơpơrlơ̆ wơl} đặt ở đầu câu mang nghĩa \"Trái lại / Ngược lại hoàn toàn\"."},{"t":"Phủ định Tuyệt đối \"Tuyệt nhiên không thể\" (ò tơngha kờm)","f":"Cau lơi {ò} + [V1], {gen ò tơngha kờm} + [V2]","ex":[["Tuyệt nhiên không thể","ò tơngha kờm"],["cau lơi ò dòp lơgar Yàng Tom Trồ be đô nă kơnòm dềt, gen ò tơngha kờm tơmut lơh.","thì tuyệt nhiên chẳng vào đó được"]],"c":"{ò tơngha kờm} là cụm phủ định nhấn mạnh mức độ \"tuyệt đối không thể nào\"."},{"t":"Tiểu từ Cầu khiến Thân thiết ở cuối câu (... ƀà!)","f":"dan + [Động từ] + di {añ ƀà}! = xin hãy ... cho tôi với!","ex":[["Ơ Yàng Jesu, Kòn bơtau Dabit, dan nđàc sơngit di añ ƀà!","xin thương xót tôi cùng / với!"]],"c":"Tiểu từ {ƀà} đặt ở cuối câu cầu xin tương đương chữ \"cùng / với\" đầy tha thiết trong tiếng Việt. →"},{"t":"Cách nói Bội số \"Gấp trăm lần hơn\" (dô rhiăng dơ̆ rlau mơ)","f":"[Số đếm] + {dơ̆ rlau} + (mơ [Danh từ])","ex":[["Gấp trăm lần hơn","dô rhiăng dơ̆ rlau mơ"],["gen rơp dòp leng tòm tŭ do mơ tòm rài do, dô rhiăng dơ̆ rlau mơ ală hìu đam, oh mi...","nhận lại gấp một trăm lần hơn"]],"c":"{dơ̆} = lần bàr {dơ̆ rlau} (gấp 2 lần), jơt {dơ̆ rlau} (gấp 10 lần), dô rhiăng {dơ̆ rlau} (gấp 100 lần)."},{"t":"Mệnh đề Danh từ làm Tân ngữ (ală cau mơ [S + V])","f":"[Động từ] + ală cau {mơ} + [Chủ ngữ + Động từ]","ex":[["kòn mơnus bañ cah is ală cau mơ Yàng Tom Trồ neh bơkoat bal.","những người mà Đức Chúa Trời đã kết hợp"]],"c":"Từ {mơ} đứng sau danh từ đóng vai trò đại từ quan hệ \"mà\"."}],"dl":[{"t":"Lời chúc mừng đám cưới của đôi tân hôn","turns":[["A","Hôm nay trong lễ cưới, mục sư neh nhắc lại lời dạy tòm Mak 10 về đạo vợ chồng hay lắm!","Hôm nay trong lễ cưới, mục sư đã nhắc lại lời dạy trong Mác 10 về đạo vợ chồng hay lắm!"],["B","Đúng behơ̆ ! Bau klau mơ bau ùr pal luôn đềt mềr, yêu thương nhau như đô nơm poac bal.","Đúng như vậy! Chồng và vợ phải luôn gắn bó khắng khít, yêu thương nhau như một thịt cùng nhau."],["A","Chúc hai em luôn gơtòmsòr mơ ò bao giờ cah is điều Yàng Tom Trồ neh bơkoat bal!","Chúc hai em luôn hòa thuận và không bao giờ phân rẽ điều Đức Chúa Trời đã kết hợp!"]],"note":"Hoàn thiện từ vựng hôn nhân trong tiếng K'Ho: bau ùr (vợ – Câu 2, 7, 11), bau klau (chồng – Câu 12), bau mơ (kết hôn với), lòi bau (ly dị / bỏ vợ bỏ chồng – Câu 2, 4, 11, 12), đềt mềr mơ (gắn bó khắng khít với – Câu 7), và bơkoat bal (kết hợp / buộc chặt cùng nhau – Câu 9)."},{"t":"Dạy dỗ con trẻ từ thuở nhỏ","turns":[["A","Ală kơnòm dềt tòm lớp học rất thích chạy đến chào hỏi thầy cô.","Các em nhỏ trong lớp học rất thích chạy đến chào hỏi thầy cô."],["B","Bañ bơkơŭ bol khai! Bol he pal yêu thương, khích lệ mơ dạy ală kơnòm dềt biết sống trung thực, bañ ntung kơñau, bañ lơh cơng blac mơ biết dòn duh mè bèp bơh tŭ gam kơnòm!","Đừng ngăn cấm các em! Chúng ta phải yêu thương, khích lệ và dạy các em nhỏ biết sống trung thực, đừng trộm cắp, đừng nói dối và biết hiếu kính cha mẹ ngay từ thuở còn nhỏ!"]],"note":"Để diễn tả việc một tài sản hay vương quốc \"thuộc về ai\", tiếng K'Ho dùng cấu trúc gơrê mơ [Chủ sở hữu] (Câu 14: lơgar Yàng Tom Trồ gơrê mơ ală cau be bol khai = Nước Đức Chúa Trời thuộc về những người giống như các em nhỏ ấy). Cụm động từ \"chúc phước lành\" trong Câu 16 được diễn đạt là ơn jơhngơl bol khai in (tương đương ai lơngai)."},{"t":"Bán nông sản thu hoạch và giúp đỡ người nghèo","turns":[["A","Mùa thu hoạch năm nay sre brê gia đình mê dê thu được nhiều cà phê lắm, mê neh đem lòt tac rơĭ?","Mùa thu hoạch năm nay ruộng rẫy của gia đình bạn thu được nhiều cà phê lắm, bạn đã đem đi bán chưa?"],["B","Añ neh tac một nửa số cà phê hôm qua. Gia đình añ trích một phần tiền nàng tòmpà mơ dong kòl ală cau rƀah lơ-ời tòm ƀòn.","Tôi đã bán một nửa số cà phê hôm qua. Gia đình tôi trích một phần tiền để chia sẻ và giúp đỡ những người nghèo khổ trong buôn."],["A","Broă mê lơh thật đáng quý! Giúp đỡ cau rƀah lơ-ời chính là tích lũy phan màng bền vững nhất!","Việc bạn làm thật đáng quý! Giúp đỡ người nghèo khổ chính là tích lũy kho báu bền vững nhất!"]],"note":"Khi muốn nói ai \"còn thiếu một điều\", tiếng K'Ho dùng động từ siều: Mê gam siều đô bơta lơm (Bạn còn thiếu một điều mà thôi – Câu 21). Đối lập với động từ rwat (mua – Bài 6) là động từ tac (bán: Lòt tĕ tac jơh ală phan mơna mê dê = Hãy đi bán hết của cải của ngươi – Câu 21)."},{"t":"Chỉ đường rẽ phải – rẽ trái trong buôn","turns":[["A","Cho añ lùp thăm: muốn lòt tus hìu jum ƀòn mình gen lòt gùng đah ma hala đah kiau?","Cho tôi hỏi thăm: muốn đi đến nhà hội của buôn mình thì đi đường bên phải hay bên trái?"],["B","Mê lòt thẳng qua cầu, nhìn đah kiau la trường học, còn rẽ sang đah ma la hìu jum!","Bạn đi thẳng qua cầu, nhìn bên trái là trường học, còn rẽ sang bên phải là nhà hội!"]],"note":"Đoạn văn Câu 32–45 phân biệt hai phong cách lãnh đạo bằng liên từ Gơpơrlơ̆ wơl (Ngược lại / Trái lại): các vua chúa ngoại bang dùng quyền lực cai trị hà khắc (at ƀồ kràñ cê), nhưng trong cộng đồng môn đồ, ai muốn làm lớn thì phải làm người phục vụ (cau duh broă) và đầy tớ (dĭ gơna) cho mọi người."},{"t":"Dừng lại giúp đỡ người gặp khó khăn bên đường","turns":[["A","Sền kìa, có một cụ già gam nggui di gah gùng, hình như cụ bị đau chân ò lòt được.","Nhìn kìa, có một cụ già đang ngồi bên vệ đường, hình như cụ bị đau chân không đi được."],["B","Bol he dơh wơl xe mơ lòt tus hỏi thăm cụ tĕ!","Chúng ta hãy dừng xe lại và đi đến hỏi thăm cụ đi!"],["A (Nói với cụ già)","Ơ ông, kơ̆ tĕ nùs! Ñchi ông kòñ bol hi lơh ông in taih? Lòi bol hi đưa ông rê hìu nhă!","Ơi ông, hãy yên tâm! Ông muốn chúng cháu làm gì giúp ông ạ? Hãy để chúng cháu đưa ông về nhà nhé!"]],"note":"Đoạn cuối Mác 10 (Câu 46–52) ghi lại cuộc đối thoại sống động giữa người mù Ba- ti-mê và Chúa Giê-su, cung cấp các động từ: kanađàn (ăn xin), dơh wơl (dừng bước lại), sang ào bơdih (cởi/vứt áo khoác ngoài ra), và câu hỏi Ñchi mê kòñ Añ lơh mê in taih? (Ngươi muốn Ta làm gì cho ngươi?)."}],"ds":[["Ală kơnòm dềt tòm lớp học rất thích chạy đến chào hỏi thầy cô.","Các em nhỏ trong lớp học rất thích chạy đến chào hỏi thầy cô."],["Bol he dơh wơl xe mơ lòt tus hỏi thăm cụ tĕ!","Chúng ta hãy dừng xe lại và đi đến hỏi thăm cụ đi!"]],"vr":[["Đề","Về sự rẫy vợ","Bơta lòi bau"],["1","Đức Chúa Jêsus đi khỏi đó, vào bờ-cõi xứ Giu-đê và qua bên kia sông Giô-đanh. Đoàn dân lại nhóm-họp quanh Ngài, và Ngài lại dạy-dỗ họ như thường-lệ.","Yàng Jesu ñă bơh hơ̆ lòt tus hơ kơnhwàl Jude mơ tiă đah ne hiòng Jordan. Mpồl làng bol oă pơjum tai gùt dar Kơnràñ. Kơnràñ bơto sồr bol khai kung be òs."],["2","Bấy giờ các người Pha-ri-si đến hỏi đặng thử Ngài rằng: Người nam có phép rẫy vợ mình chăng?","Gơs cau Pharisi tus lùp nàng lòng Kơnràñ lah: “Cau klau gơs gơnoar lòi bau ùr khai dê sơl?”"],["3","Ngài đáp rằng: Môi-se đã truyền cho các ngươi điều chi?","Kơnràñ lùp lah: “Ñchi jơnau Môise sồr bol mê taih?”"],["4","Họ thưa rằng: Môi-se cho phép viết tờ ly-dị và rẫy vợ.","Bol khai ho lah: “Môise neh ai gơnoar cih sră tòmlòi nàng lòi bau ùr.”"],["5","Nhưng Đức Chúa Jêsus phán rằng: Ấy là vì lòng các ngươi cứng-cỏi, nên Môi-se đã truyền điều- luật đó cho các ngươi.","Yàng Jesu đơs lah: “Tài bơh nùs bol mê kră kơldang gen tàng khai neh ai gơnoar do."],["6","Song từ buổi sáng-thế, Đức Chúa Trời đã dựng nên người nam và người nữ.","Mơya bơh sơnròp crơng gơs trồ tiah, ‘Yàng Tom Trồ neh lơh gơs mìng dô nă cau klau mơ đô nă cau ùr lơm.’"],["7","Bởi cớ đó, người nam sẽ lìa cha mẹ mà dính-díu với vợ mình,","‘Tài bơh hơ̆ tàng cau klau rơp lik bơh mè bèp mơ đềt mềr mơ bau ùr khai dê,"],["8","Hai người sẽ cùng nên một thịt. Như thế, vợ chồng không phải là hai nữa, song một thịt mà thôi.","mơ bàr nă rơp gơlik gơs đô nơm poac bal.’ Behơ̆ gen bol khai ò di la bàr tai, mơya la đô nơm poac lơm."],["9","Vậy, loài người không nên phân-rẽ những kẻ mà Đức Chúa Trời đã phối-hiệp!","Behơ̆ kòn mơnus bañ cah is ală cau mơ Yàng Tom Trồ neh bơkoat bal.”"],["10","Khi vào trong nhà rồi, môn-đồ lại hỏi Ngài về việc đó.","Tòm tŭ ơm tòm hìu, ală cau bơtê lùp Kơnràñ tai bơh broă hơ̆ ."],["11","Ngài phán rằng: Hễ ai rẫy vợ mình mà cưới vợ khác, thì phạm tội ngoại-tình đối với vợ trước.","Kơnràñ ho lah: “Cau lơi lòi bau ùr khai dê mơ bau mơ cau ùr ndai, gen cau hơ̆ tìs glài bơrnàn mơ bau ùr khai,"],["12","Và nếu người vợ bỏ chồng mình mà lấy chồng khác, thì cũng phạm tội ngoại-tình.","ai dilah cau ùr hơ̆ lòi bau klau khai dê mơ bau mơ cau klau ndai, gen kung tìs glài bơrnàn behơ̆ sơl.”"],["Đề","Đức Chúa Jêsus ban phước cho con trẻ","Yàng Jesu ai lơngai ală kơnòm dềt in"],["13","Bấy giờ người ta đem những con trẻ đến cùng Đức Chúa Jêsus, đặng Ngài rờ đến chúng nó; song môn-đồ trách những người đem đến.","Cau cèng ală kơnòm dềt tus hơ Yàng Jesu, nàng Kơnràñ in ơn tê hơđang bol khai. Ală cau bơtê lah pơrhơng ală cau cèng hơ̆ ."],["14","Đức Chúa Jêsus thấy vậy, bèn giận mà phán cùng môn-đồ rằng: Hãy để con trẻ đến cùng ta, đừng cấm chúng nó; vì nước Đức Chúa Trời thuộc về những kẻ giống như con trẻ ấy.","Dơ̆ Yàng Jesu gŏ behơ̆ gen gơjrañ mơ đơs mơ ală cau bơtê lah: “Lòi tĕ ală kơnòm dềt tus hơ Añ, bañ bơkơŭ bol khai; bơh lơgar Yàng Tom Trồ gơrê mơ ală cau be bol khai."],["15","Quả-thật, ta nói cùng các ngươi, ai không nhận- lấy nước Đức Chúa Trời như một đứa trẻ, thì chẳng vào đó được.","Di ngan Añ đơs mơ bol mê, cau lơi ò dòp lơgar Yàng Tom Trồ be đô nă kơnòm dềt, gen ò tơngha kờm tơmut lơh.”"],["16","Ngài bèn ôm những đứa trẻ ấy, đặt tay trên mình chúng nó và chúc phước cho.","Kơnràñ kơnđu bol khai, ơn tê hơđang bol khai mơ ơn jơhngơl bol khai in."],["Đề","Người giàu","Cau kwang pas sơrm"],["17","Khi Đức Chúa Jêsus vừa ra đi, có một người chạy đến, quì trước mặt Ngài mà hỏi rằng: Thưa thầy nhân-lành, tôi phải làm chi cho được hưởng sự sống đời đời?","Dơ̆ Yàng Jesu sơntòm lik lòt, gơs đô nă cau ntoat tus, cùn gơltang di đap Kơnràñ mơ đơs lah: “Ơ Cau Bơto lơbơn niam, ñchi bơta añ pal lơh nàng geh pơrdòn bơta kis gam sùm sùm taih?”"],["18","Đức Chúa Jêsus phán rằng: Sao ngươi gọi ta là nhân-lành? Chỉ có một Đấng nhân-lành, là Đức Chúa Trời.","Yàng Jesu ho lah: “Ñchi bơh tài mê sơnđan Añ la lơbơn niam taih? Rlau mơ Yàng Tom Trồ ò gơs cau lơi lơbơn niam."],["19","Ngươi đã biết các điều-răn: Đừng giết người; đừng phạm tội tà-dâm; đừng trộm-cướp; đừng làm chứng dối; đừng lừa-gạt ai; hãy hiếu-kính cha mẹ ngươi.","Mê git ală bơta sồr lam: ‘Bañ tơnchơt cau, bañ tìs glài rềs àr bơrnàn, bañ ntung kơñau, bañ lơh cơng blac, bañ pơrlồm, dòn duh tĕ mè bèp mê.’”"],["20","Người đó thưa rằng: Thưa thầy, tôi đã giữ mọi điều đó từ thuở nhỏ.","Khai ho lah: “Ơ Cau Bơto, añ neh prap gàr ală bơta hơ̆ bơh tŭ gam kơnòm.”"],["21","Đức Chúa Jêsus ngó người mà yêu, và phán rằng: Ngươi còn thiếu một điều: hãy đi bán hết gia-tài mình, đem phát cho kẻ nghèo, thì ngươi sẽ có của-quí ở trên trời; rồi hãy đến mà theo ta.","Yàng Jesu sền di khai mơ kòñ gơboh, gen đơs lah: “Mê gam siều đô bơta lơm. Lòt tĕ tac jơh ală phan mơna mê dê mơ tòmpà cau rƀah lơ-ời in, gen mê rơp geh phan màng hơđang trồ; lồc behơ̆ tus tĕ jat Añ.”"],["22","Nhưng người đó nghe lời ấy, thì nét mặt buồn- rầu, đi ra có vẻ lo-rầu lắm; vì người có nhiều của- cải.","Dơ̆ kơno jơnau hơ̆ , cau do gơlơh kơnjơ̆ muh mat, gen moat jrùng mơ lòt, bơh khai gơs oă ngan phan mơna."],["23","Đức Chúa Jêsus ngó xung-quanh, và phán cùng môn-đồ rằng: Những kẻ giàu vào nước Đức Chúa Trời là khó biết bao!","Tŭ hơ̆ Yàng Jesu sền gùt dar Kơnràñ mơ đơs mơ ală cau bơtê lah: “Cau pas sơrm mut tòm lơgar Yàng Tom Trồ la kalke ngan!”"],["24","Môn-đồ lấy lời đó làm lạ. Nhưng Đức Chúa Jêsus lại cất tiếng phán cùng họ rằng: Hỡi các con, những kẻ cậy sự giàu-có vào nước Đức Chúa Trời là khó biết bao!","Ală cau bơtê ai lơh krơi ngan bơh ală jơnau hơ̆ . Mơya Yàng Jesu đơs tai lah: “Ơ ală kòn, ală cau kơnòm di bơta pas sơrm nàng mut tòm lơgar Yàng Tom Trồ la kalke ngan!"],["25","Con lạc-đà chui qua lỗ kim còn dễ hơn một người giàu vào nước Đức Chúa Trời.","Lạcđa mut tòm trồm jrum la đươn rlau mơ cau pas sơrm mut tòm lơgar Yàng Tom Trồ.”"],["26","Môn-đồ lại càng lấy làm lạ hơn nữa, nói với nhau rằng: Vậy thì ai được rỗi?","Ală cau bơtê ai lơh crih crài oă ngan mơ đơs mơ Kơnràñ lah: “Behơ̆ gen ñcau rgơi geh dong klàs taih?”"],["27","Đức Chúa Jêsus ngó môn-đồ mà phán rằng: Việc đó loài người không làm được, song Đức Chúa Trời không phải vậy; vì Đức Chúa Trời làm được mọi sự.","Yàng Jesu sền di bol khai mơ đơs lah: “Bơta hơ̆ jơi kòn mơnus ò rgơi lơh, mơya Yàng Tom Trồ ò di behơ̆ , bơh Yàng Tom Trồ rgơi lơh jơh ală bơta.”"],["28","Phi-e-rơ bèn thưa rằng: Nầy, chúng tôi đã bỏ mọi sự mà theo thầy.","Chòp Pier đơs mơ Kơnràñ lah: “Do, bol hi neh sang jơh ală bơta mơ jat Kơnràñ.”"],["29","Đức Chúa Jêsus đáp rằng: Quả-thật, ta nói cùng các ngươi, chẳng ai vì ta và vì đạo Tin-lành, mà bỏ nhà-cửa, anh em, chị em, cha mẹ, con-cái, đất- ruộng,","Yàng Jesu ho lah: “Di ngan Añ đơs mơ bol mê, cau lơi bơh Añ mơ bơh Jơnau Niam mơ sang hìu đam, oh mi, ruh lŏ, mè bèp, oh kòn hala sre brê,"],["30","mà chẳng lãnh lấy trong đời nầy trăm phần hơn về những nhà-cửa, anh em, chị em, mẹ con, đất- ruộng, với sự bắt-bớ, và sự sống đời đời trong đời sau.","gen rơp dòp leng tòm tŭ do mơ tòm rài do, dô rhiăng dơ̆ rlau mơ ală hìu đam, oh mi, ruh lŏ, mè bèp, oh kòn, sre brê, bal mơ bơta kup kơryan, mơ bơta kis gam sùm sùm tòm rài gơlik gơs lồi dut."],["31","Nhưng có nhiều kẻ ở đầu sẽ nên rốt, và nhiều kẻ ở rốt sẽ nên đầu vậy.","Mơya gơs oă cau sơnròp rơp gơlik gơs lồi dut, mơ cau lồi dut rơp gơlik gơs sơnròp.”"],["Đề","Đức Chúa Jêsus báo trước lần thứ ba về sự Ngài phải chết và sống lại","Yàng Jesu yal lài dơ̆ pe bơh bơta chơt Kơnràñ dê"],["32","Thầy trò đang đi đường lên thành Giê-ru-sa-lem; Đức Chúa Jêsus đi trước, môn-đồ thất-kinh, và những người đi theo đều sợ-hãi. Ngài lại đem riêng mười hai sứ-đồ cùng mình, rồi khởi-sự nói về những sự sẽ xảy đến cho mình, mà rằng:","Yàng Jesu mơ ală cau bơtê lòt gùng guh hơ Jerusalem, Kơnràñ lòt lài mơ bol khai. Ală cau bơtê ai lơh crih crài mơ ală cau lòt jat rngòt rngơt ngan. Kơnràñ cèng is jơt bàr nă cau bơtê, mơ rơp sơntòm đơs bơh ală broă pal gơlik tus di Kơnràñ lah:"],["33","Nầy, chúng ta lên thành Giê-ru-sa-lem; Con người sẽ bị nộp cho các thầy tế-lễ cả và các thầy thông- giáo. Họ sẽ định tội chết cho Ngài và giao Ngài cho dân ngoại;","“Do, bol he guh hơ Jerusalem. Kòn Mơnus rơp gơkòl bơtào tòm tê ală cau gơnoar lam bồ ơn phan duh khoai mơ ală cau bơto bơta boh lam; bol khai rơp lơh nền glài chơt Khai in, mơ jào Khai tòm tê làng bol bơdih."],["34","dân ấy sẽ nhạo-báng Ngài, nhổ trên Ngài, đánh đòn Ngài, và giết Ngài; rồi sau ba ngày Ngài sẽ sống lại.","Bol khai rơp dơñŏ tơnhial di Khai, choh di Khai, phù lơh Khai mơ tơnchơt tơn. Mơya tơnơ̆ mơ pe ngai Khai rơp kis wơl.”"],["Đề","Lời xin của hai con trai Xê-bê-đê","Jơnau dan Jakơ mơ Jang dê"],["35","Hai con trai của Xê-bê-đê, là Gia-cơ và Giăng, đến gần Đức Chúa Jêsus, mà thưa rằng: Thưa thầy, chúng tôi muốn thầy làm cho điều chúng tôi sẽ xin.","Tŭ hơ̆ Jakơ mơ Jang la bàr nă kòn klau Sebede dê tus rềp hơ Kơnràñ mơ đơs lah: “Ơ Cau Bơto, bol hi kòñ Kơnràñ lơh gơs bơta bol hi rơp dan do.”"],["36","Ngài hỏi: Các ngươi muốn ta làm chi cho?","Yàng Jesu lùp bol khai lah: “Ñchi bol mê kòñ Añ lơh bol mê in taih?”"],["37","Thưa rằng: Khi thầy được vinh-hiển, xin cho chúng tôi ngồi, một người bên hữu thầy, một người bên tả.","Bol khai ho lah: “Tòm tŭ Kơnràñ geh gơklŏ, dan ai bol hi in geh nggui đô nă đah ma, đô nă đah kiau Kơnràñ.”"],["38","Nhưng Đức Chúa Jêsus phán rằng: Các ngươi không biết điều mình xin. Các ngươi uống được chén ta sắp uống, và chịu được phép báp-têm ta sắp chịu chăng?","Mơya Yàng Jesu ho lah: “Bol mê ò git bơta bol mê dan hơ̆ . Bol mê rgơi hùc mơngàn mơ Añ hùc, mơ rgơi gơs ƀaptem mơ bơta ƀaptem Añ gơs sơl?”"],["39","Thưa rằng: Chúng tôi làm được. Đức Chúa Jêsus phán rằng: Chén ta uống, các ngươi sẽ uống; phép báp-têm ta chịu, các ngươi sẽ chịu.","Bol khai ho lah: “Bol hi rgơi.” Yàng Jesu đơs lah: “Bol mê rơp hùc mơngàn Añ hùc mơ rơp gơs ƀaptem mơ bơta ƀaptem Añ gơs,"],["40","Nhưng ngồi bên hữu hay bên tả ta, thì chẳng phải tự ta cho được; ấy là cho những người đã sắm-sẵn cho.","mơya đô nă nggui đah ma mơ đô nă nggui đah kiau Añ, gen ò di la Añ gơs gơnoar ai; tiah hơ̆ Yàng Tom Trồ neh prap lòi ală cau neh geh lơh nền lài in.”"],["41","Mười sứ-đồ khác nghe điều đó, bèn bắt giận Gia- cơ và Giăng.","Dơ̆ jơt nă cau bơtê ne kơno jơnau hơ̆ gen gơjrañ di Jakơ mơ Jang."],["42","Đức Chúa Jêsus gọi môn-đồ đến, mà phán rằng: Các ngươi biết những người được tôn làm đầu cai-trị các dân ngoại thì bắt dân phải phục mình, còn các quan lớn thì lấy quyền-thế mà trị dân.","Gen Yàng Jesu hòi bol khai tus mơ đơs lah: “Bol mê git lah ală cau neh geh pồ bơtào at ƀồ làng bol bơdih gen at ƀồ kràñ cê làng bol bol khai dê, mơ ală cau kwang dờng gen ngui gơnoar pràn nàng at ƀồ hơđang làng bol."],["43","Nhưng trong các ngươi thì không như vậy; trái lại, hễ ai muốn làm lớn trong các ngươi, thì sẽ làm đầy-tớ;","Mơya tòm bol mê gen ò di behơ̆ ò. Gơpơrlơ̆ wơl, cau lơi tòm bol mê kòñ gơs dờng gen pal lơh gơs cau duh broă."],["44","còn ai trong các ngươi muốn làm đầu, thì sẽ làm tôi-mọi cho mọi người.","Ai cau lơi tòm bol mê kòñ gơs cau lam bồ gen pal lơh gơs dĭ gơna kòp nă cau in."],["45","Vì Con người đã đến không phải để người ta hầu- việc mình, song để hầu-việc người ta, và phó sự sống mình làm giá chuộc nhiều người.","Bơh Kòn Mơnus neh tus ò di nàng cau duh broă Khai in, mơya nàng duh broă cau in mơ phi bơta kis Khai lơh gơs phan tơwài oă cau.”"],["Đề","Người mù ở thành Giê-ri-cô","Yàng Jesu sơmbòi cau jơngo tòm Jerikô"],["46","Đoạn, đi đến thành Giê-ri-cô. Khi Đức Chúa Jêsus cùng môn-đồ và một đoàn dân đông ra khỏi thành Giê-ri-cô, thì có người mù tên là Ba-ti-mê, con của Ti-mê, ngồi ăn-xin bên đàng.","Yàng Jesu mơ ală cau bơtê lòt tus hơ Jerikô. Tòm tŭ Kơnràñ bal mơ cau bơtê mơ mpồl làng bol oă lik bơh Jerikô, gen gơs đô nă cau jơngo mat, sơnđan la Batime, kòn klau Time dê, nggui kanađàn di gah gùng."],["47","Người nghe nói ấy là Đức Chúa Jêsus ở Na-xa-rét đến, bèn kêu lên rằng: Hỡi Jêsus, con cháu Đa-vít, xin thương-xót tôi cùng!","Dơ̆ khai neh kơno đơs hơ̆ la Yàng Jesu Cau Nasaret, gen khai hòi driau lah: “Ơ Yàng Jesu, Kòn bơtau Dabit, dan nđàc sơngit di añ ƀà!”"],["48","Có nhiều người quở người mù, biểu nín đi; nhưng người càng kêu lớn tiếng hơn nữa rằng: Hỡi con cháu Đa-vít, xin thương-xót tôi cùng!","Gơs oă cau lah pơrhơng khai, sồr ơm mŏ mŏ, mơya khai sơlo hòi driau dờng rlau tai lah: “Ơ Kòn bơtau Dabit, dan nđàc sơngit di añ ƀà!”"],["49","Đức Chúa Jêsus bèn dừng lại, phán rằng: Hãy kêu người đến. Họ bèn kêu người mù, mà nói với người rằng: Hãy vững lòng, đứng dậy, Ngài gọi ngươi.","Yàng Jesu dơh wơl mơ đơs lah: “Hòi tĕ khai.” Bol hơ̆ hòi cau jơngo mơ đơs lah: “Kơ̆ tĕ nùs, ntào, Kơnràñ hòi mê.”"],["50","Người mù vứt áo ngoài mình, chờ dậy, đến cùng Đức Chúa Jêsus.","Cau jơngo sang ào bơdih, ñă mo mơ tus hơ Yàng Jesu."],["51","Đức Chúa Jêsus cất tiếng phán cùng người rằng: Ngươi muốn ta làm chi cho ngươi? Người mù thưa rằng: Lạy thầy, xin cho tôi được sáng mắt!","Yàng Jesu lùp lah: “Ñchi mê kòñ Añ lơh mê in taih?” Cau jơngo ho lah: “Ơ Cau Bơto, añ kòñ geh àng mat.”"],["52","Đức Chúa Jêsus phán rằng: Đi đi, đức-tin ngươi đã chữa lành ngươi rồi. Tức thì người mù được sáng mắt, bèn bước theo Đức Chúa Jêsus trên đàng.","Yàng Jesu đơs lah: “Lòt tĕ, bơta dòn mê neh sơmbòi mê.” Gen khai gŏ mo, mơ lòt jat Kơnràñ tơn tòm gùng."]],"cult":{"t":"Cặp Từ Ghép Song Đôi (Binomials) Giàu Nhạc Điệu Trong Mác 10","lead":"Tiếng K'Ho rất chuộng các cặp từ ghép song đôi tạo nhịp điệu cân xứng trong lời nói trang trọng (Câu 17–30):","pts":[["Từ ghép song đôi chỉ nhà cửa & đất đai canh tác",["hìu đam → nhà cửa, mái ấm gia trang (ghép từ hìu = ngôi nhà + đam = gian nhà)","sre brê → ruộng nương rừng rẫy, đất đai canh tác (ghép từ sre = ruộng nước + brê = rừng/rẫy trên đồi)"]],["Cặp từ đối lập Giàu sang – Nghèo khó",["cau rƀah lơ-ời → người nghèo khổ, túng thiếu (Câu 21)","cau kwang pas sơrm → người quyền quý, giàu có (Đề câu 17, Câu 22–25)"]]]},"prac":[{"dir":"vk","q":"Loài người đừng phân rẽ những người mà Đức Chúa Trời đã kết hợp cùng nhau.","a":"Kòn mơnus bañ cah is ală cau mơ Yàng Tom Trồ neh bơkoat bal.","exp":"Nguyên văn Mác 10:9: bañ cah is = đừng phân rẽ; ală cau mơ... = những người mà...; bơkoat bal = kết hợp lại với nhau."},{"dir":"vk","q":"Hãy để các em nhỏ đến cùng Ta, đừng ngăn cấm các em; vì Nước Đức Chúa Trời thuộc về những người giống như các em ấy.","a":"Lòi tĕ ală kơnòm dềt tus hơ Añ, bañ bơkơŭ bol khai; bơh lơgar Yàng Tom Trồ gơrê mơ ală cau be bol khai.","exp":"Nguyên văn Mác 10:14: Lòi tĕ... = hãy để cho...; gơrê mơ = thuộc về."},{"dir":"vk","q":"Hãy đi bán hết của cải của bạn và chia sẻ cho người nghèo khổ, thì bạn sẽ có kho báu ở trên trời.","a":"Lòt tĕ tac jơh ală phan mơna mê dê mơ tòmpà cau rƀah lơ-ời in, gen mê rơp geh phan màng hơđang trồ.","exp":"Nguyên văn Mác 10:21: tac = bán; phan mơna = của cải; cau rƀah lơ-ời = người nghèo khổ; phan màng = kho báu."},{"dir":"vk","q":"Bạn muốn Tôi làm điều gì cho bạn? – Thưa Thầy, tôi muốn được sáng mắt!","a":"Ñchi mê kòñ Añ lơh mê in taih? – Ơ Cau Bơto, añ kòñ geh àng mat!","exp":"Nguyên văn Mác 10:51: mẫu câu hỏi đáp ứng mong muốn Ñchi mê kòñ Añ lơh mê in taih?; geh àng mat = được sáng mắt."},{"dir":"kv","q":"Bơta hơ̆ jơi kòn mơnus ò rgơi lơh, mơya Yàng Tom Trồ ò di behơ̆ , bơh Yàng Tom Trồ rgơi lơh jơh ală bơta.","a":"Điều đó đối với loài người thì không thể làm được, nhưng đối với Đức Chúa Trời thì không phải như vậy, vì Đức Chúa Trời có thể làm được mọi sự.","exp":"jơi kòn mơnus ò rgơi lơh = loài người không thể làm được; rgơi lơh jơh ală bơta = làm được mọi sự. STT Bài Tập (Câu Cần Dịch) Đáp Án Chuẩn & Giải Thích Cấu Trúc (KPM2018)"},{"dir":"kv","q":"Bơh Kòn Mơnus neh tus ò di nàng cau duh broă Khai in, mơya nàng duh broă cau in mơ phi bơta kis Khai lơh gơs phan tơwài oă cau.","a":"Vì Con Người đã đến không phải để người ta phục vụ Mình, nhưng để phục vụ người ta và phó sự sống của Mình làm giá chuộc cho nhiều người.","exp":"duh broă cau in = phục vụ người ta; phi bơta kis = phó mạng sống; phan tơwài = giá chuộc."}]},{"n":11,"t":"Mượn Đồ, Cây Trái Mùa Vụ, Giao Thương & Sức Mạnh Của Sự Tha Thứ","words":[["alàng kòn","Lừa con (alàng kòn); cưỡi lên lưng vật nuôi (hào)","Lừa con, cưỡi lên lưng vật nuôi","Danh / Động từ","",""],["kơt","Buộc lại, cột lại (kơt); cởi dây, mở trói (hồ)","Buộc lại, cột lại","Động từ","{Hồ} tĕ gơ, mơ tề cèng hơ do","Hãy cởi dây nó ra và dắt đem lại đây"],["ngui","Dùng, sử dụng (ngui); gửi trả lại ngay (brê wơl mo)","Dùng, sử dụng","Động từ","Yàng kòñ ngui gơ, mơ rơp {brê wơl mo}","Chúa cần dùng nó, và sẽ trả lại ngay"],["gùng me","Đường cái lớn (gùng me); cánh đồng, bãi trống (ƀlàng)","Đường cái lớn, cánh đồng","Danh từ","",""],["dă ào","Trải áo ra (dă ào); rải trên đường (rsìh); chặt/cắt cành (sreh)","Trải áo ra, rải trên đường","Động từ","",""],["ồng p , tòm tŭ Yàng Jesu mơ ală cau bơtê lòt gan, gŏ chi ƀal neh ro tus tòm ryas.","Sáng sớm hôm sau, khi Chúa Giê-su và các môn đồ đi ngang qua, thấy cây vả đã khô héo tận gốc rễ."],["Bơh gơnoar lơi mơ ồng lơh ală bơta do hala ñcau neh ai ồng in gơnoar nàng lơh ală bơta do taih?","Bởi thẩm quyền nào mà ông làm những việc này, hay là ai đã trao cho ông thẩm quyền để làm những việc này?"]],"rs":[["gen tus lòng {jòi sền} gơs plai lơi {sơl}","nên đến thử tìm xem có trái nào chăng"],["Gen ho tĕ lah: ‘Yàng kòñ ngui gơ, mơ rơp brê wơl mo.’","Chúa cần dùng nó, và sẽ gửi trả lại ngay"],["Từ nay về sau","Bơh do jơl hìng nau"],["Bơh do jơl hìng nau ò gơs tŭ lơi cau sa plai mê dê tai ò!","Từ nay về sau mãi mãi chẳng bao giờ có ai ăn trái của mày nữa"],["Nghi ngờ","pin wil wơl"],["Tin chắc","dòn nền cê"],["dilah khai ò pin wil wơl tòm nùs mơya dòn nền cê jơnau he đơs rơp gơlik gơs ngan...","không nghi ngờ trong lòng nhưng tin chắc"],["Tòm tŭ bol mê ntào hòi dan, dilah gơs bơta lơi gơtòmkal mơ cau lơi, gen toh glài tĕ...","nếu có điều gì bất hòa với ai, hãy tha thứ đi"],["Bởi quyền phép nào?","Bơh gơnoar lơi mơ...?"],["Bơh gơnoar lơi mơ ồng lơh ală bơta do hala ñcau neh ai ồng in gơnoar... taih?","Bởi thẩm quyền nào mà ông làm những việc này?"],["Sáng sớm hôm sau","Àng drim ngai tơnơ̆"],["Àng drim ngai tơnơ̆ , tòm tŭ bol khai neh lik bơh Bethani rau...","Sáng sớm ngày hôm sau"],["Dilah bol he đơs: ‘Bơh trồ,’ gen... Ai dilah bol he đơs: ‘Bơh kòn mơnus,’ gen...","Họ bèn bàn-luận cùng nhau như vầy: Nếu chúng ta nói: Bởi trên trời, thì người sẽ nói rằng: Vậy sao các ngươi không tin lời người?"]],"rules":[{"t":"Mẫu câu Mượn đồ & Hứa trả lại ngay (kòñ ngui ... brê wơl mo)","f":"[Chủ ngữ] kòñ {ngui} [Vật], {mơ rơp} brê {wơl} mo","ex":[["Gen ho tĕ lah: ‘Yàng kòñ ngui gơ, mơ rơp brê wơl mo.’","Chúa cần dùng nó, và sẽ gửi trả lại ngay"]],"c":"{ngui} = dùng; brê {wơl} mo = đem trả lại ngay lập tức."},{"t":"Trạng ngữ Vĩnh viễn Tương lai \"Từ nay về sau\" (Bơh do jơl hìng nau)","f":"{Bơh do jơl hìng nau} + {ò} gơs tŭ lơi + [Mệnh đề] + {tai ò}","ex":[["Từ nay về sau","Bơh do jơl hìng nau"],["Bơh do jơl hìng nau ò gơs tŭ lơi cau sa plai mê dê tai ò!","Từ nay về sau mãi mãi chẳng bao giờ có ai ăn trái của mày nữa"]],"c":"{bơh do} (từ nay) + {jơl hìng nau} (cho đến đời đời về sau)."},{"t":"Cặp đối lập \"Nghi ngờ\" (pin wil wơl) vs. \"Tin chắc\" (dòn nền cê)","f":"{dilah ò pin wil wơl tòm} nùs {mơya} dòn {nền cê}...","ex":[["Nghi ngờ","pin wil wơl"],["Tin chắc","dòn nền cê"],["dilah khai ò pin wil wơl tòm nùs mơya dòn nền cê jơnau he đơs rơp gơlik gơs ngan...","không nghi ngờ trong lòng nhưng tin chắc"]],"c":"{pin wil wơl} diễn tả tâm trạng dao động, phân vân nghi ngờ; dòn {nền cê} = tin vững chắc."},{"t":"Tiền tố Tương hỗ gơtòm- chỉ sự Bất hòa (gơtòmkal)","f":"{dilah} gơs bơta lơi {gơtòmkal mơ} cau lơi, {gen} toh glài {tĕ}","ex":[["Tòm tŭ bol mê ntào hòi dan, dilah gơs bơta lơi gơtòmkal mơ cau lơi, gen toh glài tĕ...","nếu có điều gì bất hòa với ai, hãy tha thứ đi"]],"c":"kal (trở ngại/vướng → mắc) {gơtòmkal} = bất hòa, xích mích với nhau."},{"t":"Câu hỏi về Thẩm quyền \"Bởi quyền phép nào?\" (Bơh gơnoar lơi mơ...?)","f":"{Bơh} gơnoar lơi {mơ} + [Chủ ngữ + Động từ] + {taih}?","ex":[["Bởi quyền phép nào?","Bơh gơnoar lơi mơ...?"],["Bơh gơnoar lơi mơ ồng lơh ală bơta do hala ñcau neh ai ồng in gơnoar... taih?","Bởi thẩm quyền nào mà ông làm những việc này?"]],"c":"Đặt cụm giới từ {Bơh} gơnoar lơi lên đầu câu rồi nối với mệnh đề chính bằng {mơ}."},{"t":"Trạng ngữ Thời gian \"Sáng sớm hôm sau\" (Àng drim ngai tơnơ̆ )","f":"Àng drim (ngai) tơnơ̆ , {tòm} tŭ [Mệnh đề]...","ex":[["Sáng sớm hôm sau","Àng drim ngai tơnơ̆"],["Àng drim ngai tơnơ̆ , tòm tŭ bol khai neh lik bơh Bethani rau...","Sáng sớm ngày hôm sau"]],"c":"àng drim = buổi sáng sớm khi trời vừa hửng sáng."},{"t":"Động từ Thử nghiệm \"Đến tìm xem có... không\" (tus lòng jòi sền... sơl)","f":"tus lòng {jòi sền} + [Mệnh đề] + {sơl}","ex":[["gen tus lòng {jòi sền} gơs plai lơi {sơl}","nên đến thử tìm xem có trái nào chăng"]],"c":"Chuỗi động từ liên hoàn tus (đến) + lòng (thử) + {jòi} (tìm) + {sền} (xem)."},{"t":"Mệnh đề Điều kiện Đối xứng trong Lập luận (Dilah... Ai dilah...)","f":"{Dilah bol he} đơs [A], {gen}... Ai {dilah bol he} đơs [{B}], {gen}...","ex":[["Dilah bol he đơs: ‘Bơh trồ,’ gen... Ai dilah bol he đơs: ‘Bơh kòn mơnus,’ gen...","Họ bèn bàn-luận cùng nhau như vầy: Nếu chúng ta nói: Bởi trên trời, thì người sẽ nói rằng: Vậy sao các ngươi không tin lời người?"]],"c":"Cấu trúc cân nhắc hai phương án trả lời trong một tình huống tiến thoái lưỡng nan."}],"dl":[{"t":"Mượn xe hoặc ngựa thồ hàng và hứa trả lại ngay","turns":[["A","Ơ K'Sră, chiếc xe máy để đah bơdih mpồng di gah gùng me có phải của mê ò?","Ơi K'Sră, chiếc xe máy để ngoài cổng bên vệ đường cái có phải của bạn không?"],["B","Đúng la xe añ dê. Ñchi mê kòñ lơh taih?","Đúng là xe của tôi. Bạn cần làm việc gì vậy?"],["A","Añ kòñ mượn ngui gơ nàng chở bao kòi bơh ƀlàng rê hìu, mơ añ rơp brê wơl mo mê in!","Tôi muốn mượn dùng nó để chở bao lúa từ ngoài đồng về nhà, và tôi sẽ đem trả lại ngay cho bạn!"]],"note":"Cặp động từ trái nghĩa về dây buộc: kơt (buộc / cột lại) và hồ (cởi dây buộc / tháo ra – Câu 2, 4, 5). Khi cưỡi trên lưng con vật (như ngựa, lừa, voi), tiếng K'Ho dùng động từ hào (Câu 2, 7)."},{"t":"Thăm vườn cây ăn trái theo mùa","turns":[["A","Sáng sớm nay (àng drim do) añ đi qua vườn mê dê, gŏ ală tòm chi bơ mơ sầu riêng gơs nha xanh tốt lắm!","Sáng sớm nay tôi đi qua vườn của bạn, thấy những cây bơ và sầu riêng có lá xanh tốt lắm!"],["B","Mê tus lòng jòi sền gơs plai rơĭ? Tháng này chưa phải la kơnhai plai sầu riêng chín, đợi hai tháng nữa rơp gơs oă plai ngọt!","Bạn đến thử tìm xem có trái chưa? Tháng này chưa phải là mùa trái sầu riêng chín, đợi hai tháng nữa sẽ có nhiều trái ngọt!"]],"note":"Khi gọi tên một cây cụ thể, tiếng K'Ho dùng cấu trúc tòm chi + [Tên cây]: dô tòm chi ƀal = một cây vả (Câu 13); còn trái của cây đó gọi là plai + [Tên cây]: kơnhai plai ƀal = mùa trái vả (Câu 13)."},{"t":"Giữ trật tự và lòng tôn kính tại nhà thờ / nhà cầu nguyện","turns":[["A","Khi mut tòm hìu duh khoai hala hìu hòi dan, bol he cần giữ thái độ thế nào?","Khi bước vào trong đền thờ hay nhà cầu nguyện, chúng ta cần giữ thái độ thế nào?"],["B","Hìu hòi dan la nơi trang nghiêm nàng duh khoai Yàng, ò phải la nơi nàng kă bro hay làm ồn ào!","Nhà cầu nguyện là nơi trang nghiêm để thờ phượng Chúa, không phải là nơi để buôn bán hay làm ồn ào!"]],"note":"Để diễn tả việc biến đổi một nơi chốn từ mục đích tốt đẹp sang mục đích xấu, tiếng K'Ho dùng cấu trúc lơh [Danh từ 1] in gơs [Danh từ 2]: \"bol mê neh lơh hìu hơ̆ in gơs trồm ală cau ntung kơñau dê\" (các ngươi đã làm cho nhà ấy trở thành hang ổ của bọn trộm cướp – Câu 17)."},{"t":"Khuyên bạn giải hòa và tha thứ khi có xích mích","turns":[["A","Hôm qua mê mơ người bạn hàng xóm có chuyện hiểu lầm mơ gơtòmkal bal ơ?","Hôm qua bạn và người bạn hàng xóm có chuyện hiểu lầm và bất hòa với nhau à?"],["B","Đúng rau, nhưng sáng nay trước khi ntào hòi dan, añ neh chủ động gặp bạn ấy nàng xin lỗi mơ toh glài cho nhau.","Đúng rồi, nhưng sáng nay trước khi đứng cầu nguyện, tôi đã chủ động gặp bạn ấy để xin lỗi và tha thứ cho nhau."],["A","Mê lơh đúng lắm! Khi bol he toh glài người khác in, lòng bol he nhẹ nhàng mơ Yàng kung toh glài bol he in!","Bạn làm đúng lắm! Khi chúng ta tha thứ cho người khác, lòng chúng ta nhẹ nhàng và Chúa cũng tha thứ cho chúng ta!"]],"note":"Đoạn văn Câu 22–26 liên kết chặt chẽ đức tin (bơta dòn) và sự tha thứ (toh glài) trong khi cầu nguyện: một mặt phải tin chắc mà không nghi ngờ (ò pin wil wơl tòm nùs mơya dòn nền cê), mặt khác phải chủ động xóa bỏ mọi hiềm khích bất hòa với anh em (dilah gơs bơta lơi gơtòmkal mơ cau lơi, gen toh glài tĕ)."},{"t":"Đi dạo buổi chiều và trao đổi công việc","turns":[["A","Chiều mát mẻ thế này, bol he lòt yơng quanh bờ hồ Xuân Hương mơ trò chuyện dô êt nhă!","Chiều mát mẻ thế này, chúng ta hãy đi dạo quanh bờ hồ Xuân Hương và trò chuyện một chút nhé!"],["B","Hay lắm! Nhân tiện cho añ lùp: ai neh giao gơnoar cho đội xây dựng sửa lại cây cầu gỗ tòm ƀòn vậy?","Hay lắm! Nhân tiện cho tôi hỏi: ai đã giao thẩm quyền cho đội xây dựng sửa lại cây cầu gỗ trong buôn vậy?"],["A","Đó là quyết định chung của ủy ban xã mơ ală cau kwang kra tòm ƀòn nàng bà con đi lại an toàn mùa mưa!","Đó là quyết định chung của ủy ban xã và các bậc già làng trong buôn để bà con đi lại an toàn vào mùa mưa!"]],"note":"Động từ lòt yơng trong Câu 27 mang nghĩa là đi dạo / đi bách bộ thong thả (khác với lòt gùng = đi đường xa hay ntoat = chạy). Khi muốn đặt điều kiện trong đối thoại (\"Hãy trả lời tôi, thì tôi sẽ nói cho các bạn...\"), dùng cấu trúc Ho tĕ Añ in gen Añ rơp yal bol mê in... (Câu 29)."}],"ds":[["Đúng la xe añ dê. Ñchi mê kòñ lơh taih?","Đúng là xe của tôi. Bạn cần làm việc gì vậy?"]],"vr":[["Đề","Đức Chúa Jêsus vào thành Giê-ru-sa-lem","Yàng Jesu mut tòm ƀòn dờng Jerusalem"],["1","Khi đi gần tới thành Giê-ru-sa-lem, và ở kề làng Bê-pha-ghê cùng làng Bê-tha-ni, ngang núi Ô-li- ve, Đức Chúa Jêsus sai hai môn-đồ đi,","Tòm tŭ mơr tus hơ Jerusalem, rềp di ƀòn Bethphage mơ Bethani, di gah mơnơm Ôlibe, gen Yàng Jesu sồr bàr nă cau bơtê lòt lài,"],["2","mà dặn rằng: Hãy đi vào làng trước mặt các ngươi; vừa khi vào đó, sẽ thấy một con lừa con buộc, chưa có ai cưỡi hết: hãy mở nó ra và dắt về cho ta.","mơ đơs lah: “Lòt tus tĕ hơ ƀòn tòm toh di đap bol mê. Tòm tŭ mut tềng hơ̆ , rơp ƀàn mo dô nơm alàng kòn cau kơt, òhềt gơs cau lơi hào gơ ò. Hồ tĕ gơ, mơ tề cèng hơ do."],["3","Nếu có ai hỏi các ngươi rằng: Sao các ngươi làm điều đó? Hãy trả lời rằng: Chúa cần dùng nó; và tức thì người sẽ cho dẫn đến đây.","Dilah gơs cau lơi lùp bol mê lah: ‘Ñchi bơh tài bol mê lơh bơta hơ̆ taih?’ Gen ho tĕ lah: ‘Yàng kòñ ngui gơ, mơ rơp brê wơl mo.’”"],["4","Hai môn-đồ đi, thấy con lừa con buộc ngoài cửa, nơi đường cái, thì mở nó ra.","Bàr nă bol khai lòt, gŏ alàng kòn cau kơt đah bơdih mpồng di gah gùng me, gen hồ gơ."],["5","Có vài người đứng đó hỏi hai người rằng: Các ngươi mở lừa con đó làm chi?","Gơs bàr pe nă cau tòm mpồl ơm tềng hơ̆ lùp lah: “Ñchi bol mê lơh hồ alàng kòn hơ̆ taih?”"],["6","Hai môn-đồ trả lời như Đức Chúa Jêsus đã dặn, thì họ để cho đi.","Bàr nă bol khai ho jat be jơnau Yàng Jesu neh nting sồr, gen bol hơ̆ lòi bol khai in lòt."],["7","Vậy, hai người dắt lừa con đến cho Đức Chúa Jêsus, lấy áo mình trải trên lưng nó, và Đức Chúa Jêsus cưỡi lên.","Bàr nă bol khai tề alàng kòn hơ̆ Yàng Jesu in, dă ào bol khai hơđang gơ, gen Kơnràñ hào gơ."],["8","Có nhiều người trải áo mình trên đàng, kẻ khác thì chặt nhành cây ngoài đồng mà rải trên đàng.","Gơs oă cau dă ào bol khai tòm gùng, mơ gơs cau ndai rsìh ntê chi sreh bơh tòm ƀlàng."],["9","Những kẻ đi trước và theo sau đều kêu lên rằng: Hô-sa-na! Đáng ngợi-khen Đấng nhân danh Chúa mà đến!","Cau ƀà lòt lài cau ƀà jat tơnơ̆ , mơ driau dờng lah: “Hôsana! Jòng ro Bơtau ai sơnđan Yàng mơ tus."],["10","Phước cho nước đến, là nước của tổ-phụ chúng ta là Đa-vít! Hô-sa-na ở nơi rất cao!","Lơngai lơgar rơp tus, la lơgar Bơtau Dabit, ồng pàng bol he dê! Hôsana jòng ro Yàng Tom Trồ!”"],["11","Đức Chúa Jêsus vào thành Giê-ru-sa-lem, đi đến đền-thờ; Ngài xem-xét mọi vật chung-quanh rồi, thì vì trời đã tối, nên Ngài đi ra và đến làng Bê- tha-ni với mười hai sứ-đồ.","Yàng Jesu tus tòm Jerusalem, mut tòm hìu duh khoai. Tòm tŭ Kơnràñ neh sền làm ală bơta gùt dar, gen Kơnràñ lik wơl nàng lòt hơ Bethani bal mơ jơt bàr nă cau bơtê tài bơh trồ jơngo rau."],["Đề","Cây vả không có trái","Yàng Jesu srat sơntơm chi ƀal"],["12","Bữa sau, khi ra khỏi làng Bê-tha-ni rồi, Ngài thấy đói.","Àng drim ngai tơnơ̆ , tòm tŭ bol khai neh lik bơh Bethani rau, gen Yàng Jesu jơgloh."],["13","Vừa ngó thấy đằng xa một cây vả có lá, Ngài bèn đến xem may ra tìm được trái gì chăng; song đến gần, chỉ thấy có lá mà thôi, vì không phải là mùa vả.","Kơnràñ gŏ bơh ngăi dô tòm chi ƀal gơs nha, gen tus lòng jòi sền gơs plai lơi sơl, mơ dơ̆ neh tus rềp rau gen gŏ gơs mìng nha lơm, bơh tŭ hơ̆ ò di la kơnhai plai ƀal."],["14","Ngài bèn cất tiếng phán cùng cây vả rằng: Chẳng hề có ai ăn trái của mầy nữa! Môn-đồ đều nghe lời ấy.","Gen Yàng Jesu ai jơnau đơs mơ gơ lah: “Bơh do jơl hìng nau ò gơs tŭ lơi cau sa plai mê dê tai ò!” Ală cau bơtê kơno jơnau hơ̆ ."],["Đề","Đức Chúa Jêsus đuổi những kẻ buôn-bán ở đền-thờ","Yàng Jesu lơh goh hìu duh khoai"],["15","Đoạn, đến thành Giê-ru-sa-lem. Đức Chúa Jêsus vào đền-thờ, khởi-sự đuổi những kẻ buôn-bán ở đó, lật bàn của người đổi tiền và ghế của người bán bồ-câu;","Yàng Jesu mơ ală cau bơtê lòt tus hơ Jerusalem. Kơnràñ mut tòm hìu duh khoai, bơtrơh tơlik jơh ală cau kă bro tòm hơ̆ , tơlup cơnòng cau gơl priă mơ tơlo cơnòng nggui cau tac sềm ntòp."],["16","Ngài lại cấm không cho ai đem đồ-đạc gì đi ngang qua đền-thờ.","Kơnràñ bơkơŭ ò ai cau lơi in cèng phan lơi lòt gan hìu duh khoai."],["17","Đoạn, Ngài dạy-dỗ họ rằng: Há chẳng có lời chép rằng: Nhà ta sẽ gọi là nhà cầu-nguyện cho muôn dân sao? Nhưng các ngươi đã làm cho nhà ấy thành ra ổ trộm-cướp.","Lồc behơ̆ Kơnràñ bơto sồr lah: “Neh gơs jơnau cih lah: ‘Hìu Añ pal sơnđan la hìu hòi dan jơh ală làng bol in,’ ơ? Mơya bol mê neh lơh hìu hơ̆ in gơs trồm ală cau ntung kơñau dê.”"],["18","Các thầy tế-lễ cả và các thầy thông-giáo nghe vậy, bèn tìm thế đặng giết Ngài; vì họ sợ Ngài, bởi cả đoàn dân đều lấy sự dạy-dỗ của Ngài làm lạ.","Ală cau gơnoar lam bồ ơn phan duh khoai mơ ală cau bơto bơta boh lam kơno ală jơnau hơ̆ , gen jòi bơta nàng tơnroh Yàng Jesu; bol khai rngòt di Kơnràñ la tài bơh jơh mpồl làng bol ai lơh crih crài bơh bơta bơto sồr Kơnràñ dê."],["19","Khi trời tối, Đức Chúa Jêsus ra khỏi thành.","Tòm tŭ trồ neh mang, Kơnràñ lik bơh ƀòn dờng."],["Đề","Cây vả khô","Bơta bơto bơh chi ƀal"],["20","Sáng mai, đang đi qua đó, môn-đồ thấy cây vả đã khô cho đến rễ.","Àng drim tơnơ̆ , tòm tŭ Yàng Jesu mơ ală cau bơtê lòt gan, gŏ chi ƀal neh ro tus tòm ryas."],["21","Phi-e-rơ nhớ lại chuyện đã qua, bèn thưa cùng Ngài rằng: Thầy ôi, xem kìa, cây vả mà thầy đã rủa, nay khô đi rồi.","Tŭ hơ̆ Pier kah wơl jơnau Yàng Jesu neh đơs mơ chi, gen đơs mơ Kơnràñ lah: “Ơ Rabi, sền ne! Chi ƀal mơ Kơnràñ srat gơ neh ro rau.”"],["22","Đức Chúa Jêsus cất tiếng phán rằng: Hãy có đức- tin đến Đức Chúa Trời.","Chòp Yàng Jesu đơs lah: “Gơs tĕ bơta dòn di Yàng Tom Trồ."],["23","Quả-thật, ta nói cùng các ngươi, ai sẽ biểu hòn núi nầy rằng: Phải cất mình lên, và quăng xuống biển, nếu người chẳng nghi-ngại trong lòng, nhưng tin chắc điều mình nói sẽ ứng-nghiệm, thì điều đó sẽ thành cho.","Di ngan Añ đơs mơ bol mê, cau lơi đơs mơ mơnơm do lah: ‘Yò tĕ să mơ ntruñ tòm đàlềng,’ dilah khai ò pin wil wơl tòm nùs mơya dòn nền cê jơnau he đơs rơp gơlik gơs ngan, gen ngan bơta hơ̆ rơp gơlik gơs."],["24","Bởi vậy ta nói cùng các ngươi: Mọi điều các ngươi xin trong lúc cầu-nguyện, hãy tin đã được rồi, thì điều đó sẽ ban cho các ngươi.","Tài bơh hơ̆ tàng Añ đơs mơ bol mê, jơh ală bơta lơi bol mê dan tòm tŭ hòi dan, dòn tĕ la neh geh gen ngan bol mê rơp geh bơta hơ̆ ."],["25","Khi các ngươi đứng cầu-nguyện, nếu có điều gì bất-bình cùng ai, thì hãy tha-thứ, để Cha các ngươi ở trên trời cũng tha lỗi cho các ngươi.","Tòm tŭ bol mê ntào hòi dan, dilah gơs bơta lơi gơtòmkal mơ cau lơi, gen toh glài tĕ nàng Bèp bol mê ơm hơđang trồ kung rơp toh glài bol mê in sơl.”"],["26","[Song nếu các ngươi không tha-thứ, thì Cha các ngươi ở trên trời cũng sẽ không tha lỗi cho các ngươi.]","[Mơya dilah bol mê ò toh glài gen Bèp bol mê ơm hơđang trồ kung rơp ò toh glài bol mê in sơl.]"],["Đề","Những câu hỏi về quyền-phép của Đức Chúa Jêsus","Jơnau lùp bơh gơnoar Kơnràñ dê"],["27","Đức Chúa Jêsus và môn-đồ lại vào thành Giê-ru- sa-lem. Đang khi Ngài đi dạo trong đền-thờ, thì các thầy tế-lễ cả, các thầy thông-giáo, cùng các trưởng-lão đến gần Ngài,","Yàng Jesu mơ ală cau bơtê rê wơl hơ Jerusalem. Tòm tŭ Kơnràñ lòt yơng tòm hìu duh khoai, gen ală cau gơnoar lam bồ ơn phan duh khoai, ală cau bơto bơta boh lam mơ ală cau kwang kra lòt tus hơ Kơnràñ,"],["28","mà hỏi rằng: Bởi quyền-phép nào mà thầy làm những sự nầy? Và ai đã cho thầy quyền-phép làm những sự ấy?","mơ lùp lah: “Bơh gơnoar lơi mơ ồng lơh ală bơta do hala ñcau neh ai ồng in gơnoar nàng lơh ală bơta do taih?”"],["29","Đức Chúa Jêsus đáp rằng: Ta cũng hỏi các ngươi một câu; hãy trả lời cho ta, rồi ta sẽ nói cho các ngươi biết bởi quyền-phép nào ta làm những sự nầy.","Yàng Jesu ho lah: “Añ kung lùp bol mê dô jơnau. Ho tĕ Añ in gen Añ rơp yal bol mê in bơh gơnoar lơi mơ Añ lơh ală bơta do."],["30","Phép báp-têm của Giăng là bởi trên trời hay là bởi người ta? Hãy trả lời cho ta.","Bơta ƀaptem Jang dê la bơh trồ hala bơh kòn mơnus taih? Ho tĕ Añ in.”"],["31","Họ bèn bàn-luận cùng nhau như vầy: Nếu chúng ta nói: Bởi trên trời, thì người sẽ nói rằng: Vậy sao các ngươi không tin lời người?","Bol khai bơyai bal mơ gơp lah: “Dilah bol he đơs: ‘Bơh trồ,’ gen khai rơp đơs lah: ‘Behơ̆ ñchi bơh tài bol mê ò dòn Jang taih?’"],["32","Còn nếu chúng ta nói: Bởi người ta, — thì họ sợ dân-sự, vì ai nấy đều cầm Giăng thật là một đấng tiên-tri.","Ai dilah bol he đơs: ‘Bơh kòn mơnus’” gen bol khai rngòt di làng bol, bơh jơh tơr nă neh dòp Jang ngan la cau gơnoar hwơr."],["33","Vậy, họ trả lời cùng Đức Chúa Jêsus rằng: Chúng tôi không biết. Đức Chúa Jêsus lại phán cùng họ rằng: Ta cũng không nói cho các ngươi biết bởi quyền-phép nào ta làm những sự nầy.","Gen bol khai ho Yàng Jesu lah: “Bol hi ò git.” Chòp Yàng Jesu đơs mơ bol khai lah: “Añ kung ò yal bol mê in git bơh gơnoar lơi mơ Añ lơh ală bơta do.”"]],"cult":{"t":"Phân Biệt 'Đường Cái Lớn' (gùng me) & Thuật Ngữ Thương Mại Trong Mác 11","lead":"Cách dùng từ gốc 'me' (mẹ/cái) để tạo danh từ chỉ sự vật chính và bộ từ vựng giao thương:","pts":[["Từ me chỉ sự vật chính / trục lớn (Câu 4)",["gùng (đường) + me (cái/mẹ) → gùng me (đường cái, đường trục chính lớn ngoài cửa)"]],["Bộ thuật ngữ thương mại & trao đổi (Câu 15)",["rwat (mua) ↔ tac (bán); cau tac sềm ntòp (người bán chim bồ câu)","cau kă bro → những người buôn bán, giao thương","cau gơl priă → những người đổi tiền (gơl = đổi/trao đổi, priă = tiền bạc)"]]]},"prac":[{"dir":"vk","q":"Nếu có ai hỏi các bạn: 'Tại sao các bạn làm điều đó?', thì hãy đáp rằng: 'Chúa cần dùng nó, và sẽ gửi trả lại ngay.'","a":"Dilah gơs cau lơi lùp bol mê lah: ‘Ñchi bơh tài bol mê lơh bơta hơ̆ taih?’ Gen ho tĕ lah: ‘Yàng kòñ ngui gơ, mơ rơp brê wơl mo.’","exp":"Nguyên văn Mác 11:3: kòñ ngui gơ = cần dùng nó; brê wơl mo = đem trả lại ngay."},{"dir":"vk","q":"Nhà của Ta phải được gọi là nhà cầu nguyện cho muôn dân.","a":"Hìu Añ pal sơnđan la hìu hòi dan jơh ală làng bol in.","exp":"Nguyên văn Mác 11:17: pal sơnđan la = phải gọi là; hìu hòi dan = nhà cầu nguyện; jơh ală làng bol in = cho muôn dân."},{"dir":"vk","q":"Hãy có đức tin nơi Đức Chúa Trời! Mọi điều các bạn xin trong lúc cầu nguyện, hãy tin là đã nhận được, thì chắc chắn các bạn sẽ được điều đó.","a":"Gơs tĕ bơta dòn di Yàng Tom Trồ! Jơh ală bơta lơi bol mê dan tòm tŭ hòi dan, dòn tĕ la neh geh gen ngan bol mê rơp geh bơta hơ̆ .","exp":"Kết hợp Mác 11:22 và 11:24: dòn tĕ la neh geh = hãy tin là đã nhận được. STT Bài Tập (Câu Cần Dịch) Đáp Án Chuẩn & Giải Thích Cấu Trúc (KPM2018)"},{"dir":"vk","q":"Khi các bạn đứng cầu nguyện, nếu có điều gì bất hòa với ai, thì hãy tha thứ đi, để Cha các bạn ở trên trời cũng tha thứ cho các bạn.","a":"Tòm tŭ bol mê ntào hòi dan, dilah gơs bơta lơi gơtòmkal mơ cau lơi, gen toh glài tĕ nàng Bèp bol mê ơm hơđang trồ kung rơp toh glài bol mê in sơl.","exp":"Nguyên văn Mác 11:25: gơtòmkal mơ cau lơi = bất hòa với ai; toh glài tĕ = hãy tha thứ đi."},{"dir":"kv","q":"Àng drim tơnơ̆ , tòm tŭ Yàng Jesu mơ ală cau bơtê lòt gan, gŏ chi ƀal neh ro tus tòm ryas.","a":"Sáng sớm hôm sau, khi Chúa Giê-su và các môn đồ đi ngang qua, thấy cây vả đã khô héo tận gốc rễ.","exp":"Àng drim tơnơ̆ = sáng sớm hôm sau; chi ƀal = cây vả; ro tus tòm ryas = khô héo tận rễ."},{"dir":"kv","q":"Bơh gơnoar lơi mơ ồng lơh ală bơta do hala ñcau neh ai ồng in gơnoar nàng lơh ală bơta do taih?","a":"Bởi thẩm quyền nào mà ông làm những việc này, hay là ai đã trao cho ông thẩm quyền để làm những việc này  đầu và làm nhục nữa"],["mơ lơh {bơthĭ} hòi dan jŏ iơngau","và làm bộ cầu nguyện dài dòng"],["tò dô nơm trồm nàng {pat nho}","đào một cái hầm để ép nho"],["{pìt mơ sa loàn} hìu ală cau ùr bơnrau dê","nuốt nhà của các bà góa"],["nàng ai dô {pơnah} cồng nha sươn nho","để nhận một phần hoa lợi vườn nho"],["ơn bàr pet {priă kòng}, hơ̆ la pơgap dô su","dâng hai đồng tiền nhỏ, ước chừng một xu"],["{Rùp} mơ sơnđan do la ñcau dê taih?","Hình và chữ hiệu này là của ai?"],["tam dô nơm {sươn} nho","trồng một vườn nho"],["lồc behơ̆ bơtrơh rê {tê gòi}","sau đó đuổi về tay không"],["cau Pharisi mơ cau bal mơ {bơnờr} Herôt dê","người Pha-ri-si và đảng Hê-rốt"],["bơto gùng Yàng Tom Trồ dê {dô ƀă song ngan}","dạy đường lối Chúa cách chân chính"],["bơt dô nơm {theng kơp gàr}","xây một cái tháp/chòi canh"],["Tòm ală bơta sồr lam, bơta lơi la dờng màng rlau jơh?","Trong các điều răn, điều nào là lớn lao quan trọng hơn hết thảy?"],["Mê kòñ gơboh tĕ di cau gơp ƀòn he be să tòm he.","Hãy yêu thương người lân cận (người cùng buôn làng) như chính bản thân mình."],["Mê jơh tĕ nùs, jơh hwềng soàn, jơh dơngoh jak, jơh pràn mơ kòñ gơboh di Yàng Tom Trồ mê dê.","Bạn hãy hết lòng, hết linh hồn, hết trí khôn, hết sức lực mà yêu kính Chúa là Đức Chúa Trời của bạn."],["Tơm wơl tĕ bơtau in phan lơi bơtau dê, mơ tơm wơl tĕ Yàng Tom Trồ in phan lơi Yàng Tom Trồ dê.","Hãy trả lại cho vua vật gì của vua, và trả lại cho Đức Chúa Trời vật gì của Đức Chúa Trời."],["Gơs dô nă cau ne tam dô nơm sươn nho, lơh pơnggàr gùt dar, tò dô nơm trồm nàng pat nho, bơt dô nơm theng kơp gàr, mơ ai ală cau lơh sươn in ơpah gơ.","(Mác 12:1) \"Có một người kia trồng một vườn nho, rào hàng rào xung quanh, đào một cái hầm để ép nho, xây một cái tháp canh, và giao cho những người làm vườn thuê."],["Bơh jơh ală cau ne ai jền tơngkah bol khai dê mơ ơn, ai cau ùr bơnrau rƀah do siều siar ngan, mơya neh ơn jơh phan khai gơs, la jơh phan ròng siam să khai.","Vì hết thảy những người kia đều lấy tiền dư của mình mà dâng vào, còn bà góa nghèo này túng thiếu lắm, nhưng đã dâng hết mọi vật mình có, tức là hết cả của nuôi sống bản thân mình."]],"rs":[["Hãy hết lòng, hết sức...","jơh tĕ..."],["Mê jơh tĕ nùs, jơh hwềng soàn, jơh dơngoh jak, jơh pràn mơ kòñ gơboh di Yàng Tom Trồ mê dê.","Ngươi phải hết lòng, hết linh-hồn, hết trí-khôn, hết sức mà kính-mến Chúa là Đức Chúa Trời ngươi."],["Như chính mình","be să tòm he"],["Mê kòñ gơboh tĕ di cau gơp ƀòn he be să tòm he.","Hãy yêu người lân cận như chính mình"],["Dilah dô nă cau gơs bi khai dê chơt... gen oh khai pal... Cau bi tơnhoa bau... Cau bàr... cau pe...","Thưa thầy, Môi-se có truyền cho chúng tôi rằng nếu có người nào anh chết đi, để vợ lại mà không có con, thì em phải lấy vợ góa đó đặng nối dòng cho anh."],["Tơm wơl tĕ bơtau in phan lơi bơtau dê, mơ tơm wơl tĕ Yàng Tom Trồ in phan lơi Yàng Tom Trồ dê.","Đức Chúa Jêsus phán cùng họ rằng: Hãy trả cho Sê-sa vật gì của Sê-sa; và trả cho Đức Chúa Trời vật gì của Đức Chúa Trời. Họ đều lấy lời Ngài làm lạ."],["Tay không","tê gòi"],["Mơya bol khai kup cau dĭ hơ̆ phù lơh, lồc behơ̆ bơtrơh rê tê gòi.","đuổi về tay không"],["Bạn không xa khỏi...","Mê ò ngăi bơh ... ò"],["Yàng Jesu sền khai ho chài rgơi gen đơs lah: ‘Mê ò ngăi bơh lơgar Yàng Tom Trồ dê ò.’","Ngươi chẳng xa khỏi Nước Đức Chúa Trời đâu"],["Cưới vợ lấy chồng","lap klau tòmbau ùr"],["Bơh tòm tŭ cau kis wơl bơh bơta chơt, gen ò lap klau tòmbau ùr...","không cưới vợ cũng không lấy chồng"],["pìt mơ sa loàn hìu ală cau ùr bơnrau dê, mơ lơh bơthĭ hòi dan jŏ iơngau.","và làm bộ đọc lời cầu nguyện dài"]],"rules":[{"t":"Mệnh lệnh Toàn tâm Toàn lực \"Hãy hết lòng, hết sức...\" (jơh tĕ...)","f":"Mê {jơh tĕ} nùs, {jơh} hwềng {soàn}, {jơh} dơngoh jak, {jơh pràn mơ} + [Động từ]","ex":[["Hãy hết lòng, hết sức...","jơh tĕ..."],["Mê jơh tĕ nùs, jơh hwềng soàn, jơh dơngoh jak, jơh pràn mơ kòñ gơboh di Yàng Tom Trồ mê dê.","Ngươi phải hết lòng, hết linh-hồn, hết trí-khôn, hết sức mà kính-mến Chúa là Đức Chúa Trời ngươi."]],"c":"Đặt {jơh tĕ} trước danh từ để diễn đạt ý \"Hãy dốc hết toàn bộ (tấm lòng, trí tuệ, sức lực)...\"."},{"t":"So sánh Ngang bằng Phản thân \"Như chính mình\" (be să tòm he)","f":"[Động từ] + di + [Tân ngữ] + {be} să {tòm he}","ex":[["Như chính mình","be să tòm he"],["Mê kòñ gơboh tĕ di cau gơp ƀòn he be să tòm he.","Hãy yêu người lân cận như chính mình"]],"c":"cau gơp ƀòn {he} = người bạn cùng buôn/người lân cận; {be} să {tòm he} = như chính bản thân mình."},{"t":"Hệ thống Thứ bậc Anh Em: bi (Anh) vs. oh (Em)","f":"bi = anh trai lớn cau bi tơnhoa = anh cả đầu lòng cau bàr, cau pe = anh thứ hai, thứ ba oh = em","ex":[["Dilah dô nă cau gơs bi khai dê chơt... gen oh khai pal... Cau bi tơnhoa bau... Cau bàr... cau pe...","Thưa thầy, Môi-se có truyền cho chúng tôi rằng nếu có người nào anh chết đi, để vợ lại mà không có con, thì em phải lấy vợ góa đó đặng nối dòng cho anh."]],"c":"Trong khi cụm chung oh mi chỉ anh em nói chung, khi phân biệt thứ bậc thì bi là anh và oh là em."},{"t":"Cấu trúc Hoàn trả Đúng Chủ sở hữu (Tơm wơl tĕ [Ai] in phan lơi [Ai] dê)","f":"{Tơm wơl tĕ} + [Chủ A] + {in} + phan lơi + [Chủ A] + {dê}","ex":[["Tơm wơl tĕ bơtau in phan lơi bơtau dê, mơ tơm wơl tĕ Yàng Tom Trồ in phan lơi Yàng Tom Trồ dê.","Đức Chúa Jêsus phán cùng họ rằng: Hãy trả cho Sê-sa vật gì của Sê-sa; và trả cho Đức Chúa Trời vật gì của Đức Chúa Trời. Họ đều lấy lời Ngài làm lạ."]],"c":"{tơm wơl} = hoàn trả lại, nộp trả lại cho đúng chủ sở hữu."},{"t":"Thành ngữ \"Tay không\" (tê gòi) với Tiểu từ gòi","f":"[Động từ] + tê gòi = đi/về tay không","ex":[["Tay không","tê gòi"],["Mơya bol khai kup cau dĭ hơ̆ phù lơh, lồc behơ̆ bơtrơh rê tê gòi.","đuổi về tay không"]],"c":"Ở Bài 7, bơr sơndồi gòi = chỉ bằng môi miệng; ở Bài 12, tê gòi = bàn tay trống không!"},{"t":"Cấu trúc Khích lệ \"Bạn không xa khỏi...\" (Mê ò ngăi bơh ... ò)","f":"[Chủ ngữ] + {ò ngăi bơh} + [Đích đến] + {ò}","ex":[["Bạn không xa khỏi...","Mê ò ngăi bơh ... ò"],["Yàng Jesu sền khai ho chài rgơi gen đơs lah: ‘Mê ò ngăi bơh lơgar Yàng Tom Trồ dê ò.’","Ngươi chẳng xa khỏi Nước Đức Chúa Trời đâu"]],"c":"Dùng để khích lệ khi ai đó đã tiến rất gần đến sự hiểu biết đúng đắn hoặc mục tiêu."},{"t":"Động từ Tương hỗ Kết hôn \"Cưới vợ lấy chồng\" (lap klau tòmbau ùr)","f":"{lap} klau {tòmbau} ùr = dựng vợ gả chồng / cưới gả","ex":[["Cưới vợ lấy chồng","lap klau tòmbau ùr"],["Bơh tòm tŭ cau kis wơl bơh bơta chơt, gen ò lap klau tòmbau ùr...","không cưới vợ cũng không lấy chồng"]],"c":"Thành ngữ bốn chữ kết hợp klau (nam) và ùr (nữ) với tiền tố tương hỗ tòm-."},{"t":"Làm bộ / Giả vờ để che mắt (lơh bơthĭ + [V])","f":"lơh bơthĭ + [Động từ] = làm bộ / giả đò làm gì","ex":[["pìt mơ sa loàn hìu ală cau ùr bơnrau dê, mơ lơh bơthĭ hòi dan jŏ iơngau.","và làm bộ đọc lời cầu nguyện dài"]],"c":"lơh bơthĭ = làm bộ, giả vờ để khoe khoang trước mặt người khác."}],"dl":[{"t":"Trồng vườn cà phê và chuẩn bị mùa thu hoạch","turns":[["A","Khu đất rộng cạnh suối, gia đình mê neh tam cây gì rau?","Khu đất rộng cạnh suối, gia đình bạn đã trồng cây gì rồi?"],["B","Bol hi neh tam dô nơm sươn cà phê mơ sầu riêng, lơh pơnggàr gùt dar mơ bơt dô nơm theng kơp gàr nhỏ.","Chúng tôi đã trồng một vườn cà phê và sầu riêng, làm hàng rào xung quanh và dựng một cái chòi canh nhỏ."],["A","Tháng Mười Một tới la kơnhai pic plai cà phê, chúc sươn mê dê thu được thật nhiều cồng nha nhă!","Tháng Mười Một tới là mùa hái trái cà phê, chúc vườn của bạn thu được thật nhiều hoa lợi nhé!"]],"note":"Đoạn văn dụ ngôn vườn nho (Câu 1–11) cung cấp đầy đủ các động từ canh tác vườn và xây dựng: tam sươn (trồng vườn), lơh pơnggàr (làm hàng rào), tò trồm (đào hố/hầm), pat (ép/vắt nước trái cây), bơt theng kơp gàr (xây chòi/tháp canh), ai... ơpah (cho thuê), và pic plai (hái trái)."},{"t":"Sống ngay thẳng và làm tròn nghĩa vụ công dân","turns":[["A","Tại sao bà con tòm ƀòn đều tin tưởng nhờ ông K'Brêu phân xử các việc chung?","Tại sao bà con trong buôn đều tin tưởng nhờ ông K'Brêu phân xử các việc chung?"],["B","Tài bơh ông ấy la cau đơs jơnau song, công bằng mơ ò sền đah bơdih cau dê dù giàu hay nghèo!","Bởi vì ông ấy là người nói lời chân thật, công bằng và không nhìn bề ngoài người ta dù giàu hay nghèo!"]],"note":"Để khen một người sống ngay thẳng, chân thật và không thiên vị ai theo vẻ bề ngoài, Câu 14 dùng chuỗi cụm từ rất chuẩn mực: cau đơs jơnau song (người nói lời chân thật), ò sền đah bơdih cau dê (không nhìn bề ngoài của người ta), và bơto gùng Yàng Tom Trồ dê dô ƀă song ngan (dạy đường lối của Đức Chúa Trời một cách chân chính)."},{"t":"Giới thiệu các anh chị em trong gia đình theo thứ bậc","turns":[["A","Gia đình mê dê gơs mấy anh em trai (oh mi)? Mê la con thứ mấy?","Gia đình của bạn có mấy anh em trai? Bạn là con thứ mấy?"],["B","Hìu añ gơs pe (3) nă anh em trai. Cau bi tơnhoa neh bau ùr rau, añ la cau bàr, còn oh út gam đi học.","Nhà tôi có 3 anh em trai. Người anh cả đầu lòng đã cưới vợ rồi, tôi là người thứ hai, còn em út đang đi học."]],"note":"Đoạn văn Câu 18–27 giúp người học nắm rõ cách gọi anh em theo thứ tự sinh trong gia đình K'Ho: người anh cả đầu lòng gọi là cau bi tơnhoa, người thứ hai là cau bàr, người thứ ba là cau pe, và người em gọi anh mình là bi (trong khi người anh gọi em là oh)."},{"t":"Sống yêu thương người lân cận trong buôn làng","turns":[["A","Tòm ală lời dạy của Sră Goh, điều lơi la dờng màng rlau jơh mà bol he cần ghi nhớ mỗi ngày?","Trong các lời dạy của Kinh Thánh, điều nào là quan trọng nhất mà chúng ta cần ghi nhớ mỗi ngày?"],["B","Đó là kòñ gơboh di Yàng Tom Trồ jơh nùs, jơh dơngoh jak, jơh pràn, mơ kòñ gơboh di cau gơp ƀòn he be să tòm he!","Đó là yêu kính Đức Chúa Trời hết lòng, hết trí khôn, hết sức lực, và yêu thương người lân cận cùng buôn làng như chính bản thân mình!"]],"note":"Đoạn đối thoại giữa Chúa Giê-su và thầy thông giáo (Câu 28–34) là một mẫu mực về cách trao đổi học thuật tôn trọng lẫn nhau: người hỏi thấy Chúa trả lời khôn ngoan (git Kơnràñ ho wơl chài rgơi), còn Chúa thấy người ấy đáp lại cách hiểu biết (Yàng Jesu sền khai ho chài rgơi) thì khích lệ: \"Mê ò ngăi bơh lơgar Yàng Tom Trồ dê ò!\"."},{"t":"Trân trọng tấm lòng chia sẻ của người nghèo","turns":[["A","Trong đợt quyên góp giúp đỡ trẻ em mồ côi, mò góa nghèo ở cuối ƀòn cũng mang đến đóng góp một ít gạo mơ rau.","Trong đợt quyên góp giúp đỡ trẻ em mồ côi, bà góa nghèo ở cuối buôn cũng mang đến đóng góp một ít gạo và rau."],["B","Dù mò siều siar ngan mơya tấm lòng của mò quý giá oă rlau mơ vàng bạc, tài bơh mò neh chia sẻ bơh chính phan ròng siam să mò dê!","Dù bà túng thiếu lắm nhưng tấm lòng của bà quý giá hơn nhiều so với vàng bạc, bởi vì bà đã chia sẻ từ chính phần nuôi sống bản thân bà!"]],"note":"Đoạn kết Mác 12 (Câu 38–44) đặt đối lập giữa những người giàu dâng phần tiền dư thừa (ai jền tơngkah bol khai dê mơ ơn) và bà góa nghèo túng thiếu (cau ùr bơnrau rƀah do siều siar ngan) nhưng đã dâng trọn vẹn hai đồng tiền nhỏ là toàn bộ của nuôi sống mình (neh ơn jơh phan khai gơs, la jơh phan ròng siam să khai)."}],"ds":[["Khu đất rộng cạnh suối, gia đình mê neh tam cây gì rau?","Khu đất rộng cạnh suối, gia đình bạn đã trồng cây gì rồi?"]],"vr":[["Đề","Thí-dụ về những người trồng nho","Pơnyơu bơh ală cau tòm sươn nho"],["1","Đức Chúa Jêsus khởi-sự dùng thí-dụ mà phán cùng họ rằng: Có một người trồng vườn nho, rào chung-quanh, đào một cái hầm ép rượu, xây một cái tháp; đoạn, giao cho mấy người trồng nho rồi đi qua xứ khác.","Yàng Jesu sơntòm ngui jơnau pơnyơu mơ đơs mơ bol khai lah: “Gơs dô nă cau ne tam dô nơm sươn nho, lơh pơnggàr gùt dar, tò dô nơm trồm nàng pat nho, bơt dô nơm theng kơp gàr, mơ ai ală cau lơh sươn in ơpah gơ, gen khai lòt hơ lơgar ndai."],["2","Đến mùa, chủ sai một đầy-tớ đến cùng những người trồng nho, đặng thâu hoa-lợi trong vườn nho.","Tus di kơnhai pic plai, gen cau tòm sồr dô nă cau dĭ lòt tus hơ ală cau lơh sươn nàng ai dô pơnah cồng nha sươn nho bơh di bol khai."],["3","Song họ bắt đầy-tớ ấy, đánh và đuổi về tay không.","Mơya bol khai kup cau dĭ hơ̆ phù lơh, lồc behơ̆ bơtrơh rê tê gòi."],["4","Chủ lại sai một đầy-tớ khác đến cùng họ; họ đánh trên đầu nó và làm nhục nó.","Cau tòm sồr tai dô nă cau dĭ ndai lòt tus, gen bol hơ̆ pòng sồt bồ khai mơ bơtat bơtròh tai sơl."],["5","Chủ lại sai một người khác nữa, thì họ giết đi; đoạn, lại sai nhiều người khác nữa, thì họ đánh kẻ nầy, giết kẻ kia.","Cau tòm sồr dô nă cau ndai tai lòt tus, gen bol hơ̆ tơnchơt tơn. Lồc behơ̆ cau tòm sồr oă cau dĭ ndai lòt tus, gen cau ƀà kong bol khai phù lơh, cau ƀà tai bol khai tơnchơt."],["6","Chủ còn một người mà thôi, là con trai rất yêu- dấu của mình; rốt lại chủ sai con ấy đến cùng họ, vì nói rằng: Chúng nó sẽ kính-trọng con ta!","Cau tòm sươn gam gơs mìng dô nă, hơ̆ la kòn klau kòñ gơboh. Lồi dut, khai sồr kòn hơ̆ lòt tus hơ bol khai, mơ đơs lah: ‘Ngan bol khai rơp ki ngàm di kòn klau añ!’"],["7","Nhưng những người trồng nho nói với nhau rằng: Người nầy là kẻ kế-tự; đến đây, chúng ta hãy giết nó đi, thì cơ-nghiệp sẽ về phần chúng ta!","Mơya bol lơh sươn đơs bal lah: ‘Do la cau pơrdòn. Heh, tơnchơt tĕ khai gen sre brê khai rơp gơrê mơ bol he.’"],["8","Họ bèn bắt người con trai đó, giết đi, và quăng xác ra ngoài vườn nho.","Gen bol khai kup kòn klau hơ̆ tơnchơt tơn, sơrbì hơ bơdih sươn nho."],["9","Vậy, chủ vườn nho sẽ làm thể nào? Người sẽ đến diệt mấy người trồng nho đó, và giao vườn nho lại cho người khác.","Yàng Jesu lùp lah: Behơ̆ cau tòm sươn nho rơp lơh mbe lơi taih? Khai rơp tus tơnroh ală cau lơh sươn hơ̆ , gen jào sươn nho ală cau ndai in."],["10","Các ngươi chưa từng đọc lời nầy trong Kinh- thánh sao: Hòn đá mà người thợ xây nhà loại ra, Đã trở nên đá góc nhà,","Bol mê òhềt sền jơnau Sră Goh do: ‘Pơnai lŭ gơkòl ală cau bơt hìu sang tơlik, Neh gơlik gơs lŭ mum hìu dờng màng rlau jơh."],["11","Ấy là việc của Chúa làm ra, Là sự lạ-lùng trước mắt chúng ta?","Do la broă neh gơlik gơs bơh Yàng, Mơ la dô bơta crih crài di mat bol he,’ ò ơ?”"],["12","Bấy giờ, họ tìm mưu bắt Đức Chúa Jêsus, vì biết rõ Ngài đã nói thí-dụ đó chỉ về họ; nhưng họ sợ dân- sự, nên để Ngài lại đó mà đi.","Ală cau hơ̆ jòi bơta nàng kup Yàng Jesu bơh git Kơnràñ đơs pơnyơu hơ̆ la sơnio bơh bol khai; mơya bol khai rngòt di mpồl làng bol, gen lòi Kơnràñ mơ lik lòt."],["Đề","Về việc nộp thuế cho Sê-sa","Jơnau lùp bơh bơta boh đia"],["13","Họ bèn sai mấy người Pha-ri-si và mấy người thuộc về đảng Hê-rốt đến cùng Đức Chúa Jêsus, đặng bắt Ngài về lời nói.","Bol khai sồr bàr pe nă cau Pharisi mơ cau bal mơ bơnờr Herôt dê lòt tus lơh gơtup tìs tòm jơnau đơs Yàng Jesu nàng jòi bơta kup Kơnràñ."],["14","Những người ấy đến nói cùng Ngài rằng: Lạy thầy, chúng tôi biết thầy là người chân-thật, chẳng vị-nể ai, vì thầy không xem bề ngoài người ta, song dạy đạo Đức Chúa Trời cách chính-đáng. Vậy có phép nộp thuế cho Sê-sa hay không? Chúng tôi có nên nộp hay là không nên nộp?","Behơ̆ ală cau hơ̆ lòt tus, đơs mơ Kơnràñ lah: “Ơ Cau Bơto, bol hi git ồng la cau đơs jơnau song, ò ơn nùs gơwèt hơ bơta kơlôi cau ndai dê. Bơh ồng ò sền đah bơdih cau dê mơya bơto gùng Yàng Tom Trồ dê dô ƀă song ngan; behơ̆ boh đia bơtau in la tòm toh mơ bơta boh lam sơl? Bol hi pal boh đia hala ò taih?”"],["15","Nhưng Đức Chúa Jêsus biết sự giả-hình của họ, bèn đáp rằng: Sao các ngươi thử ta? Hãy đem một đồng đơ-ni-ê cho ta xem.","Mơya Yàng Jesu git bơta ma blac bol khai dê, gen đơs lah: “Ñchi bơh tài bol mê lòng Añ taih? Cèng tĕ dô dơnie Añ in sền.”"],["16","Họ đem cho Ngài; Ngài bèn hỏi: Hình và hiệu nầy của ai? Họ trả lời rằng: Của Sê-sa.","Bol khai cèng gơ Kơnràñ in, gen Kơnràñ lùp lah: “Rùp mơ sơnđan do la ñcau dê taih?” Bol khai ho lah: “Bơtau dê.”"],["17","Đức Chúa Jêsus phán cùng họ rằng: Hãy trả cho Sê-sa vật gì của Sê-sa; và trả cho Đức Chúa Trời vật gì của Đức Chúa Trời. Họ đều lấy lời Ngài làm lạ.","Yàng Jesu đơs lah: “Tơm wơl tĕ bơtau in phan lơi bơtau dê, mơ tơm wơl tĕ Yàng Tom Trồ in phan lơi Yàng Tom Trồ dê.” Bol khai ai lơh krơi ngan bơh Yàng Jesu."],["Đề","Về sự sống lại","Jơnau lùp bơh bơta kis wơl"],["18","Bấy giờ các người Sa-đu-sê, là phe nói rằng không có sự sống lại, đến gần Đức Chúa Jêsus, mà hỏi Ngài như vầy:","Ală cau Saduse, la cau đơs ò dòn gơs bơta kis wơl, lòt tus lùp Yàng Jesu lah:"],["19","Thưa thầy, Môi-se có truyền cho chúng tôi rằng nếu có người nào anh chết đi, để vợ lại mà không có con, thì em phải lấy vợ góa đó đặng nối dòng cho anh.","“Ơ Cau Bơto, Môise neh cih bol hi in bơta boh lam do lah: ‘Dilah dô nă cau gơs bi khai dê chơt, lòi wơl bau mơ ò gơs kòn, gen oh khai pal bau mơ cau ùr bơnrau hơ̆ nàng tơbŏ jơi bi khai in.’"],["20","Vả, có bảy anh em; người anh cả lấy vợ, chết mà không để con lại.","Mơ tai, gơs poh nă oh mi. Cau bi tơnhoa bau, mơ khai chơt ò gơs kòn."],["21","Người thứ hai lấy người vợ góa đó, rồi chết, cũng không để con lại; người thứ ba cũng vậy.","Cau bàr bau mơ cau ùr hơ̆ , mơ khai kung chơt ò gơs kòn; cau pe kung behơ̆ sơl."],["22","Bảy anh em đều không để con lại. Rốt hết, người đàn-bà cũng chết.","Jơh poh nă cau hơ̆ ò gơs kòn lòi wơl. Lồi tơnơ̆ , cau ùr hơ̆ kung chơt sơl."],["23","Đến lúc sống lại, khi họ sẽ sống lại, thì người đàn- bà đó sẽ là vợ ai trong bảy người? Vì cả bảy đều đã lấy người làm vợ.","Tòm tŭ gơs bơta kis wơl, tŭ cau hơ̆ kis wơl, gen cau ùr hơ̆ rơp gơs bau ùr ñcau dê tòm bol khai taih? Bơh tài poh nă cau hơ̆ neh bau mơ khai.”"],["24","Đức Chúa Jêsus đáp rằng: Ấy là vì các ngươi không hiểu Kinh-thánh và cũng không hiểu 岂 quyền-phép Đức Chúa Trời, nên mới lầm vậy, chẳng phải sao?","Yàng Jesu ho lah: “Mbe lơi bol mê neh tìs! Mơ ñchi bơh tài ò git taih? Hơ̆ la tài bơh bol mê ò git Sră Goh mơ kung ò git gơnap gơnoar Yàng Tom Trồ dê taih?"],["25","Bởi chưng khi người ta từ kẻ chết sống lại, thì không cưới vợ, cũng không lấy chồng, song những người ấy như thiên-sứ trên trời vậy.","Bơh tòm tŭ cau kis wơl bơh bơta chơt, gen ò lap klau tòmbau ùr, mơya rơp be ală cau gơnrơh ơm hơđang trồ."],["26","Còn về việc kẻ chết sống lại, các ngươi chưa đọc trong sách Môi-se, chỗ nói về bụi gai, Đức Chúa Trời có phán cùng người thể nào sao? Ngài phán: Ta là Đức Chúa Trời của Áp-ra-ham, Đức Chúa Trời của Y-sác, Đức Chúa Trời của Gia-cốp.","Ai bơh ală cau chơt geh kis wơl, gen bol mê òhềt sền tòm sră Môise tòm tiah neh cih bơh jơnau Yàng Tom Trồ đơs mơ khai tòm rlau lò lah: ‘Añ la Yàng Tom Trồ Abraham dê, Yàng Tom Trồ Isak dê, Yàng Tom Trồ Jakôp dê,’ ò ơ?"],["27","Ngài không phải là Đức Chúa Trời của kẻ chết, mà là của kẻ sống. Thật các ngươi lầm to.","Kơnràñ ò di la Yàng Tom Trồ cau chơt dê ò, mơya la Yàng cau kis dê! Ngan bol mê tìs lơm.”"],["Đề","Điều-răn trọng hơn hết","Bơta Sồr Lam Dờng Màng Rlau Jơh"],["28","Bấy giờ, có một người trong bọn thầy thông-giáo nghe điều họ biện-luận, thấy Đức Chúa Jêsus đã khéo đáp, thì đến gần Ngài mà hỏi rằng: Trong các điều-răn, điều nào là trọng hơn hết?","Gơs dô nă cau bơto bơta boh lam iat Yàng Jesu mơ cau Saduse tòmpơndang bal, git Kơnràñ ho wơl chài rgơi, gen lùp Kơnràñ lah: “Tòm ală bơta sồr lam, bơta lơi la dờng màng rlau jơh?”"],["29","Đức Chúa Jêsus đáp rằng: Điều-răn thứ nhứt là điều nầy: Hỡi Y-sơ-ra-ên, hãy nghe, Chúa, Đức Chúa Trời chúng ta, là Chúa có một không hai.","Yàng Jesu ho lah: “Do la bơta dờng màng rlau jơh: ‘Ơ Israel, iat tĕ, Yàng la Yàng Tom Trồ bol he dê la Yàng mìng gơs dùl lơm."],["30","Ngươi phải hết lòng, hết linh-hồn, hết trí-khôn, hết sức mà kính-mến Chúa là Đức Chúa Trời ngươi.","Mê jơh tĕ nùs, jơh hwềng soàn, jơh dơngoh jak, jơh pràn mơ kòñ gơboh di Yàng Tom Trồ mê dê.’"],["31","Còn điều-răn thứ hai là điều nầy: Ngươi phải yêu kẻ lân-cận như mình. Chẳng có điều-răn nào lớn hơn hai điều đó.","Bơta sồr lam bàr: ‘Mê kòñ gơboh tĕ di cau gơp ƀòn he be să tòm he.’ Ò gơs bơta sồr lam lơi dờng rlau mơ bàr bơta sồr lam hơ̆ .”"],["32","Thầy thông-giáo thưa rằng: Thưa thầy, phải lắm; thầy nói rằng Đức Chúa Trời chỉ có một, ngoài Ngài không có Đấng nào khác, thì thật phải lắm.","Cau bơto bơta boh lam ho lah: “Ơ Cau Bơto, ngan behơ̆ , ồng đơs di ngan Yàng Tom Trồ mìng gơs dùl lơm. Rlau mơ Kơnràñ ò gơs Yàng lơi ndai tai."],["33","Sự kính-mến Đức Chúa Trời hết lòng, hết trí, hết sức mình, và yêu kẻ lân-cận như mình, ấy là trọng hơn hết các của-lễ toàn-thiêu và các của-lễ khác.","Mơ kòñ gơboh di Yàng jơh nùs, jơh dơngoh jak, jơh pràn, mơ kòñ gơboh di cau gơp ƀòn he be să tòm he, hơ̆ la bơta dờng màng rlau mơ jơh ală phan ơn mơ ală phan ơn duh khoai ndai tai sơl.”"],["34","Đức Chúa Jêsus thấy người đối-đáp thông-hiểu, bèn phán rằng: Ngươi chẳng xa nước Đức Chúa Trời đâu. Từ đó, không ai dám hỏi Ngài nữa.","Yàng Jesu sền khai ho chài rgơi gen đơs lah: “Mê ò ngăi bơh lơgar Yàng Tom Trồ dê ò.” Ơn bơh tŭ hơ̆ ò gơs cau lơi khin lùp Kơnràñ jơnau lơi tai sơl."],["Đề","Đấng Christ, con cháu vua Đa-vít","Jơnau lùp bơh Bơtau Mesia"],["35","Đức Chúa Jêsus đang giảng-dạy trong đền-thờ, bèn cất tiếng hỏi rằng: Sao các thầy thông-giáo nói rằng Đấng Christ là con cháu Đa-vít?","Yàng Jesu ơm bơto sồr tòm hìu duh khoai, Kơnràñ lùp lah: “Mbe ală cau bơto bơta boh lam rgơi đơs lah Bơtau Krist la Kòn Dabit taih?"],["36","Chính vua Đa-vít cảm-động bởi Đức Thánh-Linh có nói rằng: Chúa đã phán cùng Chúa tôi rằng: Hãy ngồi bên hữu ta, Cho đến chừng nào ta để các kẻ thù-nghịch ngươi dưới chân ngươi.","Să tòm Dabit neh geh rngoh rngac bơh Yàng Hwềng Goh mơ đơs lah: ‘Yàng neh đơs mơ Yàng añ lah: Nggui tĕ đah ma Añ Jơl tus di tŭ Añ ơn ală cau sò tơm di mê hơđơm mnàng jơng mê dê.’"],["37","Chính vua Đa-vít gọi Đấng đó là Chúa, thì Đấng đó làm con cháu người sao được? Đoàn dân đông nghe Đức Chúa Jêsus cách vui lòng.","Bơh să tòm Dabit neh krơi Kơnràñ la Yàng, gen mbe lơi Kơnràñ la kòn khai taih?” Làng bol chò nùs kòñ iat Kơnràñ."],["Đề","Đức Chúa Jêsus quở-trách các thầy thông-giáo","Jơnau lah pơrhơng ală cau bơto bơta boh lam"],["38","Khi giảng-dạy, Ngài cũng phán rằng: Hãy giữ mình về mấy thầy thông-giáo, là người ưa mặc áo dài đi dạo, ưa người ta chào mình ngoài chợ,","Tòm tŭ bơto sồr, Kơnràñ đơs lah: “Kơrhia tĕ di ală cau bơto bơta boh lam la cau kòñ soh ào jrùh mơ lòt yơng, kòñ gơs cau lùp còp să tòm gùl drà,"],["39","ưa ngồi ghế trên trong các nhà hội, cùng ngồi chỗ đầu trong các đám tiệc;","kòñ nggui cơnòng hơđap tòm hìu jum cau Juda mơ nggui tiah màng ryŭ tòm bơta ñô sa,"],["40","họ nuốt nhà đàn-bà góa, và làm bộ đọc lời cầu- nguyện dài; những người ấy sẽ bị đoán-phạt nặng hơn.","pìt mơ sa loàn hìu ală cau ùr bơnrau dê, mơ lơh bơthĭ hòi dan jŏ iơngau. Bol khai rơp gơkòl lơh nền glài kơnjơ̆ rlau tai.”"],["Đề","Bà góa dâng tiền","Cau ùr bơnrau ơn jền"],["41","Đức Chúa Jêsus ngồi đối-diện với cái rương đựng tiền dâng, coi dân-chúng bỏ tiền vào thể nào. Có lắm người giàu bỏ vào nhiều.","Yàng Jesu nggui tòm toh mơ tiah prap jền hìu duh khoai nàng sền mpồl làng bol ơn jền. Gơs gal ngan cau pas ơn oă jền."],["42","Cũng có một bà góa nghèo đến bỏ hai đồng tiền nhỏ, ước chừng một xu.","Kung gơs dô nă cau ùr bơnrau rƀah lòt tus ơn bàr pet priă kòng, hơ̆ la pơgap dô su."],["43","Đức Chúa Jêsus bèn kêu môn-đồ mà phán rằng: Quả-thật, ta nói cùng các ngươi, bà góa nghèo nầy đã bỏ vào rương nhiều hơn hết mọi người đã bỏ vào.","Chòp Kơnràñ hòi ală cau bơtê tus mơ đơs lah: “Di ngan Añ đơs mơ bol mê, cau ùr bơnrau rƀah do neh ơn tòm hộp ơn priă oă rlau mơ jơh ală cau ndai."],["44","Vì mọi người khác đều lấy của dư mình mà bỏ vào; song bà nầy thật nghèo-ngặt, đã bỏ hết của mình có, là hết cả của nuôi mình.","Bơh jơh ală cau ne ai jền tơngkah bol khai dê mơ ơn, ai cau ùr bơnrau rƀah do siều siar ngan, mơya neh ơn jơh phan khai gơs, la jơh phan ròng siam să khai.”"]],"cult":{"t":"Thuật Ngữ Canh Tác Vườn & Kiến Trúc Nhà Cửa Trong Mác 12","lead":"Sự phân biệt chính xác giữa canh tác cây hạt ngắn ngày với cây vườn lâu năm và thuật ngữ xây dựng:","pts":[["Phân biệt 'Gieo hạt' (sih), 'Trồng cây' (tam) và 'Hái trái' (pic)",["sih (gieo hạt lúa, hạt cải – Bài 4: sih gar)","tam (trồng cây lâu năm, lập vườn – Câu 1: tam dô nơm sươn nho = trồng một vườn nho)","pic (hái trái trên cây – Câu 2: kơnhai pic plai = mùa thu hoạch trái)"]],["Thuật ngữ kiến trúc xây dựng (Câu 10)",["cau bơt hìu → người thợ xây nhà","pơnai lŭ mum hìu dờng màng rlau jơh → hòn đá góc nhà quan trọng nhất (pơnai lŭ = viên đá, mum hìu = góc nhà)"]]]},"prac":[{"dir":"vk","q":"Trong các điều răn, điều nào là lớn lao quan trọng hơn hết thảy?","a":"Tòm ală bơta sồr lam, bơta lơi la dờng màng rlau jơh?","exp":"Nguyên văn Mác 12:28: bơta sồr lam = điều răn; dờng màng rlau jơh = trọng đại/lớn lao nhất."},{"dir":"vk","q":"Bạn hãy hết lòng, hết linh hồn, hết trí khôn, hết sức lực mà yêu kính Chúa là Đức Chúa Trời của bạn.","a":"Mê jơh tĕ nùs, jơh hwềng soàn, jơh dơngoh jak, jơh pràn mơ kòñ gơboh di Yàng Tom Trồ mê dê.","exp":"Nguyên văn Mác 12:30: điệp từ jơh tĕ... jơh... (hãy hết...); kòñ gơboh di = yêu thương/yêu kính. STT Bài Tập (Câu Cần Dịch) Đáp Án Chuẩn & Giải Thích Cấu Trúc (KPM2018)"},{"dir":"vk","q":"Hãy yêu thương người lân cận (người cùng buôn làng) như chính bản thân mình.","a":"Mê kòñ gơboh tĕ di cau gơp ƀòn he be să tòm he.","exp":"Nguyên văn Mác 12:31: cau gơp ƀòn he = người bạn cùng buôn/người lân cận; be să tòm he = như chính mình."},{"dir":"vk","q":"Hãy trả lại cho vua vật gì của vua, và trả lại cho Đức Chúa Trời vật gì của Đức Chúa Trời.","a":"Tơm wơl tĕ bơtau in phan lơi bơtau dê, mơ tơm wơl tĕ Yàng Tom Trồ in phan lơi Yàng Tom Trồ dê.","exp":"Nguyên văn Mác 12:17: tơm wơl tĕ ... in = hãy hoàn trả lại cho..."},{"dir":"kv","q":"Gơs dô nă cau ne tam dô nơm sươn nho, lơh pơnggàr gùt dar, tò dô nơm trồm nàng pat nho, bơt dô nơm theng kơp gàr, mơ ai ală cau lơh sươn in ơpah gơ.","a":"(Mác 12:1) \"Có một người kia trồng một vườn nho, rào hàng rào xung quanh, đào một cái hầm để ép nho, xây một cái tháp canh, và giao cho những người làm vườn thuê.","exp":"tam sươn = trồng vườn; pơnggàr = hàng rào; theng kơp gàr = chòi/tháp canh; ai... ơpah = cho thuê."},{"dir":"kv","q":"Bơh jơh ală cau ne ai jền tơngkah bol khai dê mơ ơn, ai cau ùr bơnrau rƀah do siều siar ngan, mơya neh ơn jơh phan khai gơs, la jơh phan ròng siam să khai.","a":"Vì hết thảy những người kia đều lấy tiền dư của mình mà dâng vào, còn bà góa nghèo này túng thiếu lắm, nhưng đã dâng hết mọi vật mình có, tức là hết cả của nuôi sống bản thân mình.","exp":"jền tơngkah = tiền dư; siều siar ngan = túng thiếu lắm; phan ròng siam să = của nuôi sống mình."}]},{"n":13,"t":"Vũ Trụ, Bốn Mùa, Thời Gian Ban Đêm & Sự Tỉnh Thức Kiên Trì","words":[["hàng mơnề","Đẹp đẽ, nguy nga, hùng vĩ","Đẹp đẽ, nguy nga","Cụm tính từ","",""],["gơtơrlơm","Bị sụp đổ, đổ nát hoàn toàn","Bị sụp đổ, đổ nát hoàn toàn","Động từ","",""],["tềl sơnio","Dấu hiệu, điềm báo (tềl sơnio); lạc đường, lầm lạc (tìs nrah)","Dấu hiệu, điềm báo","Cụm danh/ động từ","",""],["kơlìn","Chiến tranh, giặc giã (kơlìn); bối rối, hoảng loạn (dơcul)","Chiến tranh, giặc giã","Danh / Động từ","",""],["lơnggơr ù","Động đất (lơnggơr ù, lơnggơr = rung chuyển); nạn đói kém (jơgloh rung)","Động đất, nạn đói kém","Cụm danh từ","Oă tiah rơp gơs lơnggơr ù mơ {jơgloh rung}","Nhiều nơi sẽ có động đất và đói kém"],["cau kwang lơgar","Quan tổng đốc, quan cai trị xứ (cau kwang lơgar); thù ghét (gơjrañ kơ-uềng)","Quan tổng đốc, quan cai trị xứ","Danh / Động từ","",""],["rkàng hìu","Mái nhà, sân thượng (rkàng hìu); dọn lấy đồ đạc (pơrđô phan)","Mái nhà, sân thượng","Danh / Động từ","",""],["cau bun","Phụ nữ mang thai, có bầu (cau bun); người mẹ cho con bú (pô = bú)","Phụ nữ mang thai, có bầu","Cụm danh từ","",""],["kơnhai mrềt","Mùa đông, mùa lạnh (mrềt = lạnh, rét)","Mùa đông, mùa lạnh","Danh / Tính từ","",""],["tơnhuc","Rút ngắn lại, giảm bớt (số ngày)","Rút ngắn lại, giảm bớt","Động từ","",""],["sac rwah","Tuyển chọn, lựa chọn (cau geh sac rwah = người được chọn)","Tuyển chọn, lựa chọn","Cụm động/danh từ","",""],["mattơngai","Mặt trời (mattơngai); tối sầm lại, tối đen (klam jơngo)","Mặt trời, tối sầm lại","Danh / Tính từ","mattơngai rơp gơlik {klam jơngo}","mặt trời sẽ trở nên tối tăm"],["kơnhai","Mặt trăng (cũng có nghĩa là tháng / mùa)","Mặt trăng","Danh từ","",""],["sơmañ","Ngôi sao, vì sao (sơmañ); rụng xuống, rơi xuống (dùh)","Ngôi sao, vì sao","Danh / Động từ","ală {sơmañ} dùh bơh đang trồ","các ngôi sao từ trên bầu trời sa xuống"],["gơnoar tap trồ","Quyền lực các từng trời (gơnoar tap trồ); rúng động (gơlơnggơr)","Quyề
