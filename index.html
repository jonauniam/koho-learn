n phẳng lặng như tờ."]],"rs":[["gơlik dờng {rlau jơh} mơ ală biap","trở nên lớn hơn hết các thứ rau"],["{Ò} di ơn gơ hơđang jơng đèng {ò} cơ?","Há chẳng phải đặt nó ở trên chân đèn sao?"],["ryà dà mut tòm ơhò tian gơs mơr bềng dà.","đến nỗi gần đầy nước"],["bol he mơr chơt roh ơ?","chúng ta sắp chết mất sao?"],["gơnar bà pe jơt (30), gơnar bà prau jơt (60), gơnar bà dô rhiăng (100).","Một phần khác nữa rơi nhằm nơi đất tốt, thì kết quả, lớn lên và nẩy-nở ra; một hột ra ba chục, hột khác sáu chục, hột khác một trăm."],["Bol mê was cau in mơ rnoas lơi, gen cau kung was wơl bol mê in rnoas hơ̆ .","Ngài lại phán rằng: Hãy cẩn-thận về điều mình nghe. Người ta sẽ đong cho các ngươi bằng lường các ngươi đã đong cho, và thêm vào đó nữa."],["sền gen gŏ mơya ò git đal, iat gen kơno mơya ò git wă.","xem thì thấy mà không nhận biết, lắng nghe thì nghe mà không hiểu"],["Chẳng có gì... mà không...","Ò gơs ... mơ ò ..."],["Bơh ò gơs bơta lơi pồl mơ ò gơ pò tơlik, kung ò gơs broă lơi ndơp mơ ò gơlik loh làng.","Vì chẳng có điều chi kín mà không phải lộ ra, chẳng có điều chi giấu mà không phải rõ-ràng."],["Sánh / Ví A với B","pơndròm A mơ B"],["Bol he pơndròm lơgar Yàng Tom Trồ dê mơ bơta lơi...?","Chúng ta sánh Nước Chúa với điều gì?"]],"rules":[{"t":"Cấp So sánh Nhất \"Hơn hết cả / Nhất\" (Adj + rlau jơh)","f":"[Tính từ] + {rlau jơh} + (mơ ală [Danh từ])","ex":[["gơlik dờng {rlau jơh} mơ ală biap","trở nên lớn hơn hết các thứ rau"]],"c":"{rlau} = hơn; {jơh} = → hết thảy {rlau jơh} = hơn hết thảy / nhất (nhỏ nhất, lớn nhất)."},{"t":"Số đếm Bội số Hàng chục (pe jơt = 30) & Hàng trăm (rhiăng)","f":"Hàng chục: [Số 2–9] + {jơt} Hàng trăm: [Số] + rhiăng →","ex":[["gơnar bà pe jơt (30), gơnar bà prau jơt (60), gơnar bà dô rhiăng (100).","Một phần khác nữa rơi nhằm nơi đất tốt, thì kết quả, lớn lên và nẩy-nở ra; một hột ra ba chục, hột khác sáu chục, hột khác một trăm."]],"c":"Đặt số đơn vị trước {jơt} để nhân 10 (pe jơt = 30), đặt sau {jơt} để cộng thêm (jơt bàr = 12)."},{"t":"Trung tố công cụ -rn- / -ơn- tạo Danh từ từ Động từ","f":"was (đong/đo) rnoas (cái lường/thước đo) → gar (hạt) {gơnar} bà (từng phần hạt) → →","ex":[["Bol mê was cau in mơ rnoas lơi, gen cau kung was wơl bol mê in rnoas hơ̆ .","Ngài lại phán rằng: Hãy cẩn-thận về điều mình nghe. Người ta sẽ đong cho các ngươi bằng lường các ngươi đã đong cho, và thêm vào đó nữa."]],"c":"Xen âm -rn- hoặc -ơn- vào sau phụ âm đầu của động từ để tạo danh từ chỉ dụng cụ đo lường."},{"t":"Phân biệt Tri giác Chủ động & Kết quả (sền/gŏ, iat/kơno)","f":"{sền} (nhìn) {gŏ} (thấy) git đal (nhận biết) → iat (lắng nghe) kơno → (nghe) git wă (hiểu)","ex":[["sền gen gŏ mơya ò git đal, iat gen kơno mơya ò git wă.","xem thì thấy mà không nhận biết, lắng nghe thì nghe mà không hiểu"]],"c":"Khi kêu gọi ai chú ý nghe, luôn dùng Iat tĕ! (Hãy lắng nghe! – Câu 3, 9, 23)."},{"t":"Phủ định kép \"Chẳng có gì... mà không...\" (Ò gơs ... mơ ò ...)","f":"{Ò} gơs [Danh từ] lơi + [V1] + {mơ ò} + [V2]","ex":[["Chẳng có gì... mà không...","Ò gơs ... mơ ò ..."],["Bơh ò gơs bơta lơi pồl mơ ò gơ pò tơlik, kung ò gơs broă lơi ndơp mơ ò gơlik loh làng.","Vì chẳng có điều chi kín mà không phải lộ ra, chẳng có điều chi giấu mà không phải rõ-ràng."]],"c":"Hai chữ {ò} trong hai mệnh đề nối bằng {mơ} tạo nghĩa khẳng định tuyệt đối (mọi sự kín giấu đều sẽ lộ ra)."},{"t":"Câu hỏi Tu từ xác nhận \"Há chẳng phải... sao?\" (Ò di ... ò cơ?)","f":"{Ò} di + [Mệnh đề] + {ò} cơ?","ex":[["{Ò} di ơn gơ hơđang jơng đèng {ò} cơ?","Há chẳng phải đặt nó ở trên chân đèn sao?"]],"c":"Cụm {Ò} di ... {ò} cơ? dùng khi người nói muốn người nghe đồng tình với một lẽ hiển nhiên."},{"t":"Phó từ chỉ trạng thái \"Gần / Sắp sửa\" (mơr + V/Adj)","f":"mơr + [Động từ / Tính từ] = gần / sắp / suýt","ex":[["ryà dà mut tòm ơhò tian gơs mơr bềng dà.","đến nỗi gần đầy nước"],["bol he mơr chơt roh ơ?","chúng ta sắp chết mất sao?"]],"c":"Đặt mơr ngay trước động từ/tính từ để báo hiệu một sự việc sắp xảy ra trong gang tấc."},{"t":"Động từ So sánh \"Sánh / Ví A với B\" (pơndròm A mơ B)","f":"pơndròm + [Sự vật A] + {mơ} + [Sự vật {B}] A {la kung be B} (A cũng giống như B)","ex":[["Sánh / Ví A với B","pơndròm A mơ B"],["Bol he pơndròm lơgar Yàng Tom Trồ dê mơ bơta lơi...?","Chúng ta sánh Nước Chúa với điều gì?"]],"c":"pơndròm (từ gốc ndròm = giống nhau – Câu 33) nghĩa là đặt cạnh để so sánh, ví sánh."}],"dl":[{"t":"Chăm sóc nương rẫy và chuẩn bị mùa gặt","turns":[["A","Ơ K'Brêu, gar kòi mơ biap mê neh sih tòm ù niam bơh kơnhai trước nay neh hòn dờng rơĭ?","Ơi K'Brêu, hạt lúa và rau mà bạn đã gieo trên đất tốt từ tháng trước nay đã mọc lớn chưa?"],["B","Nhờ gơs ryas jrô mơ dà đầy đủ, kòi neh cat nha, gơs sơnyùr bềng gar mơ neh dum vàng khắp sre!","Nhờ có rễ sâu và nước đầy đủ, lúa đã trổ lá, có bông đầy hạt và đã chín vàng khắp ruộng!"],["A","Kơnhai toès neh di rau! Drim ngày mai bol he cèng mơ̆ lòt tus sre nàng toès kòi mê in nhă!","Mùa gặt đã đến rồi! Sáng ngày mai chúng ta hãy mang liềm/lưỡi hái đi ra ruộng để gặt lúa giúp bạn nhé!"]],"note":"Khi liệt kê các phần khác nhau của một tập hợp (\"một phần thì..., phần khác thì...\"), tiếng K'Ho dùng cặp từ gơs gar... gar bà... gar bà tai... (có hạt thì..., hạt khác thì..., hạt khác nữa thì... – Câu 4–8). Tiền tố gơ- gắn trước động từ chỉ trạng thái tự nhiên xảy ra đối với cây cối: gơhòn (mọc lên), gơñòp (bị nắng đốt cháy), gơro (khô héo), gơrềt (bị nghẹt ngòi)."},{"t":"Đong lúa và tính toán thu hoạch sau mùa gặt","turns":[["A","Sơnam do sre kòi hìu mê dê gơlik plai niam ngan! Mê neh was được bao nhiêu bao kòi?","Năm nay ruộng lúa của nhà bạn kết hạt tốt quá! Bạn đã đong được bao nhiêu bao lúa?"],["B","Sơnam trước bol hi chỉ thu được pe jơt (30) bao, mơya sơnam do Yàng ai bơtơl tai tian gơs thu được prau jơt (60) tus dô rhiăng (100) bao!","Năm trước chúng tôi chỉ thu được 30 bao, nhưng năm nay Chúa ban thêm cho đến nỗi thu được từ 60 đến 100 bao!"],["A","Bol mê ngui rnoas dờng nàng was kòi chia cho oh mi nghèo, gen Yàng kung rơp ai bơtơl tai bol mê in!","Các bạn dùng cái lường lớn để đong lúa chia sẻ cho anh em nghèo, thì Chúa cũng sẽ ban thêm dư dật cho các bạn!"]],"note":"Kết hợp các số đếm đã học từ Bài 1 đến Bài 4, chúng ta có bảng quy tắc đếm số tiếng K'Ho hoàn chỉnh từ 1 đến 100: từ 1 đến 6 (dùl/dô, bàr, pe, poan, pram, prau), số 10 (jơt), từ 11 đến 19 (jơt + số đơn vị: jơt bàr = 12), các số tròn chục từ 20 đến 90 (số đơn vị + jơt: bàr jơt = 20, pe jơt = 30, prau jơt = 60), và số 100 (dô rhiăng / dùl rhiăng)."},{"t":"Thắp đèn buổi tối & Giải thích ý nghĩa câu chuyện","turns":[["A","Trồ neh jơngo rau, mê ơn tĕ đèng hơđang jơng đèng nàng pơnđang làm hìu bol he dê!","Trời đã tối rồi, bạn hãy đặt cây đèn lên trên chân đèn để chiếu sáng khắp nhà của chúng ta!"],["B","Añ neh ơn đèng hơđang bàn rau. Tŭ do bol he ơm is tòm hìu, mê rgơi yal tơlik loh làng gơtha câu chuyện cổ K'Ho hơ̆ añ in ò?","Tôi đã đặt đèn trên bàn rồi. Bây giờ chúng ta ở riêng trong nhà, bạn có thể giải thích rõ ràng ý nghĩa câu chuyện cổ K'Ho đó cho tôi không?"],["A","Iat tĕ nhă! Añ rơp yal tơlik loh làng jơh ală bơta mê in.","Hãy lắng nghe nhé! Tôi sẽ cắt nghĩa rõ ràng mọi điều cho bạn."]],"note":"Khi nói về việc ở riêng tư hoặc giải thích riêng cho những người thân cận, tiếng K'Ho dùng phó từ is sau động từ ơm: ơm is dô nă (ở riêng một mình – Câu 10), tòm tŭ ơm is mơ ală cau bơtê (khi ở riêng với các môn đồ – Câu 34). Để diễn tả việc \"giải thích / cắt nghĩa rõ ràng\", dùng cụm yal tơlik loh làng (Câu 34)."},{"t":"Đi thuyền qua hồ và gặp cơn mưa gió","turns":[["A","Trồ mho do, bol he mut tòm ơhò mơ tiă lă đah bơtĭ ne dà nàng thăm ƀòn bạn nhă!","Chiều nay, chúng ta hãy lên thuyền và qua bờ bên kia hồ để thăm buôn của bạn nhé!"],["B","Kơrhia tĕ! Sền ne, càl rbut dờng gam nổi lên mơ ryà dà bắt đầu tạt tòm ơhò!","Hãy cẩn thận! Nhìn kìa, cơn gió lớn đang nổi lên và sóng nước bắt đầu tạt vào thuyền!"],["A","Mê bañ rngòt! Ngồi vững di tiah tơrwơl ơhò, chỉ dô êt tai càl rơp thit mơ mặt dà rơp ring drik ngan!","Bạn đừng sợ! Hãy ngồi vững ở đằng lái thuyền, chỉ một lát nữa gió sẽ dứt và mặt nước sẽ êm ả phẳng lặng!"]],"note":"Đoạn văn Chúa Giê-su dẹp yên sóng gió (Câu 35–41) cung cấp mẫu câu rủ nhau vượt sông/hồ rất tự nhiên: Bol he tiă lă đah bơtĭ ne dà! (Chúng ta hãy qua bờ bên kia sông/hồ! – Câu 35), cùng khẩu lệnh dứt khoát khi truyền cho sự hỗn loạn dừng lại: Thit tĕ, ơm tĕ mŏ mŏ! (Hãy dứt đi, hãy im lặng đi! – Câu 39)."},{"t":"Động viên nhau vượt qua gian khó và giữ vững niềm tin","turns":[["A","Tòm tŭ tip bơta rung rài tòm cuộc sống, ñchi bơh tài mê lại rngòt mơ buồn taih?","Khi gặp phải sự cực khổ khó khăn trong cuộc sống, tại sao bạn lại sợ hãi và buồn vậy?"],["B","Tài bơh añ gơs oă bơta kơlôi rcang bơh broă mơ gia đình.","Bởi vì tôi có nhiều nỗi lo toan về công việc và gia đình."],["A","Kơrhia tĕ! Bañ lòi bơta kơlôi rcang rài do dê mơ bơta hàm kòñ pas sơrm làm mất bình an tòm nùs. Prap kơ̆ tĕ bơta dòn, mọi sóng gió rơp thit!","Hãy cẩn thận! Đừng để sự lo lắng đời này và lòng tham muốn giàu sang làm mất bình an trong lòng. Hãy giữ vững niềm tin, mọi sóng gió sẽ dứt!"]],"note":"Phần giải nghĩa dụ ngôn người gieo giống (Câu 15–20) và câu trách yêu của Chúa với các môn đồ trên biển (Câu 40: \"Ñchi bơh tài bol mê rngòt taih? Òhềt gơs bơta dòn ơ?\" = Sao các con sợ? Chưa có đức tin sao?) mang lại bộ từ vựng tâm lý – đạo đức cực kỳ sâu sắc."}],"ds":[["Iat tĕ nhă! Añ rơp yal tơlik loh làng jơh ală bơta mê in.","Hãy lắng nghe nhé! Tôi sẽ cắt nghĩa rõ ràng mọi điều cho bạn."],["Tài bơh añ gơs oă bơta kơlôi rcang bơh broă mơ gia đình.","Bởi vì tôi có nhiều nỗi lo toan về công việc và gia đình."]],"vr":[["Đề","Thí-dụ về người gieo giống","Pơnyơu bơh cau sih gar"],["1","Đức Chúa Jêsus lại khởi sự giảng-dạy nơi bờ biển; có một đoàn dân đông lắm nhóm lại xung-quanh Ngài, Ngài bước lên trong một chiếc thuyền và ngồi đó, còn cả đoàn dân thì ở trên đất nơi mé biển.","Yàng Jesu rơp sơntòm bơto sồr tai di gah đàlềng Galile. Gơs mpồl làng bol oă ngan pơjum gùt dar Kơnràñ, tian gơs Kơnràñ mut nggui tòm dô nơm ơhò tòm đàlềng, ai jơh mpồl làng bol gen ơm di gah đàlềng."],["2","Ngài lấy thí-dụ dạy-dỗ họ nhiều điều, và trong khi dạy, Ngài phán rằng:","Kơnràñ ngui jơnau pơnyơu bơto sồr bol khai oă bơta, mơ đơs lah:"],["3","Hãy nghe. Có người gieo giống đi ra đặng gieo.","“Iat tĕ. Ne, cau sih gar lik lòt nàng sih."],["4","Khi đương gieo, một phần giống rơi dọc đường, chim đến ăn hết.","Tòm tŭ sih, gơs gar rung di gah gùng, gen sềm tus sa jơh."],["5","Một phần khác rơi nhằm nơi đất đá-sỏi, chỉ có ít đất thịt, tức thì mọc lên, vì bị lấp không sâu;","Gar bà rung di tiah lŭ, la tiah ò gơs oă ù, gen gơhòn mo tài bơh gơbờr ò jrô."],["6","nhưng khi mặt trời đã mọc, thì bị đốt, và bởi không có rễ, nên phải héo.","Dơ̆ mattơngai lik gen gơñòp, tài bơh ò gơs ryas gen tàng gơro."],["7","Một phần khác rơi nhằm bụi gai; gai mọc rậm lên làm cho nghẹt-ngòi, và không kết quả.","Gar bà tai rung di tòm lò; lò hòn sơnru lơh gơrềt jơh mơ ò gơlik plai."],["8","Một phần khác nữa rơi nhằm nơi đất tốt, thì kết quả, lớn lên và nẩy-nở ra; một hột ra ba chục, hột khác sáu chục, hột khác một trăm.","Gar bà tai rung di ù niam, gen gơhòn, gơlik dờng mơ gơlik plai; gơnar bà pe jơt, gơnar bà prau jơt, gơnar bà dô rhiăng.”"],["9","Ngài lại phán rằng: Ai có tai mà nghe, hãy nghe!","Yàng Jesu đơs tai lah: “Cau lơi gơs tồr nàng iat, gen iat tĕ!”"],["Đề","Mục-đích của các thí-dụ","Tơnggume bơta pơnyơu"],["10","Khi Đức Chúa Jêsus ở một mình, những kẻ xung- quanh Ngài cùng mười hai sứ-đồ hỏi Ngài về các lời thí-dụ.","Tòm tŭ Yàng Jesu ơm is dô nă, gen ală cau ơm gùt dar Kơnràñ bal mơ jơt bàr nă cau bơtê lùp Kơnràñ bơh jơnau pơnyơu hơ̆ ."],["11","Ngài phán rằng: Sự mầu-nhiệm của nước Đức Chúa Trời đã tỏ ra cho các ngươi; nhưng về phần người ngoài, thì dùng cách thí-dụ để dạy mọi sự,","Yàng Jesu ho lah: “Neh ai bol mê in bơta ndơp ndơr lơgar Yàng Tom Trồ dê, mơya gơwèt mơ cau ndai la ală cau bơdih gen ngui jơnau pơnyơu nàng bơto sồr ală bơta."],["12","hầu cho họ xem thì xem mà không thấy, nghe thì nghe mà không hiểu; e họ hối-cải mà được tha tội chăng.","Tồ bol khai in: sền gen gŏ mơya ò git đal, iat gen kơno mơya ò git wă. Behơ̆ gen bol khai rê wơl mơ geh toh glài mòn.”"],["Đề","Giải nghĩa thí-dụ người gieo giống","Gơtha bơta pơnyơu"],["13","Đoạn, Ngài phán rằng: Các ngươi không hiểu thí- dụ ấy sao? Vậy thì thế nào hiểu mọi thí-dụ được?","Gen Yàng Jesu đơs lah: “Bol mê ò git wă jơnau pơnyơu hơ̆ ơ? Behơ̆ gen mbe rgơi nàng git wă jơh ală jơnau pơnyơu ndai taih?"],["14","Người gieo giống ấy là gieo đạo.","Cau sih gar la sih jơnau Yàng."],["15","Những kẻ ở dọc đường là kẻ đã chịu đạo gieo nơi mình; nhưng vừa mới nghe đạo, tức thì quỉ Sa-tan đến, cướp lấy đạo đã gieo trong lòng họ đi.","Ală gar di gah gùng la cau neh kơno jơnau Yàng, mơya dơ̆ kơno gen cà Satan lòt tus kơñau mo jơnau neh sih tòm nùs bol khai dê."],["16","Cũng vậy, những người chịu giống gieo nơi đất đá-sỏi, là những kẻ nghe đạo, liền vui-mừng chịu lấy;","Kung behơ̆ sơl, ală gar sih di tiah lŭ la ală cau kơno jơnau Yàng gen hòn chò dòp mo,"],["17","song vì trong lòng họ không có rễ, chỉ tạm-thời mà thôi, nên nỗi gặp khi vì cớ đạo mà xảy ra sự cực-khổ, bắt-bớ, thì liền vấp-phạm.","mơya tòm bol khai ò gơs ryas, mìng ơm ing dô êt, tus di tŭ tip bơta rung rài hala kup kơryan tài bơh jơnau hơ̆ , gen gơtup tìs mo."],["18","Còn những kẻ chịu giống gieo nơi bụi gai, là kẻ đã nghe đạo;","Ai ală gar geh sih di tòm lò la cau neh kơno jơnau,"],["19","song sự lo-lắng về đời nầy, sự mê-đắm về giàu- sang, và các sự tham-muốn khác thấu vào lòng họ, làm cho nghẹt-ngòi đạo, và trở nên không trái.","mơya bơta kơlôi rcang rài do dê, bơta pơrlồm bơta pas sơrm dê, mơ ală bơta hàm kòñ ndai gơtơmut tòm nùs bol khai, lơh gơrềt jơnau hơ̆ gen ò gơlik plai."],["20","Nhưng, những người chịu giống gieo vào nơi đất tốt, là kẻ nghe đạo, chịu lấy và kết quả, một hột ra ba chục, hột khác sáu chục, hột khác một trăm.","Ai ală gar geh sih di ù niam la ală cau iat jơnau mơ dòp mơ gơlik plai, gơnar bà pe jơt, gơnar bà prau jơt, gơnar bà dô rhiăng.”"],["Đề","Thí-dụ về cái đèn","Pơnyơu bơh đèng"],["21","Ngài lại phán cùng họ rằng: Có ai đem đèn để dưới cái thùng hoặc dưới cái giường chăng? Há chẳng phải để trên chân đèn sao?","Yàng Jesu đơs tai mơ bol khai lah: “Gơs cau lơi ơn đèng tòm thùng hala ơn hơđơm cơnòng bic sơl? Ò di ơn gơ hơđang jơng đèng ò cơ?"],["22","Vì chẳng có điều chi kín mà không phải lộ ra, chẳng có điều chi giấu mà không phải rõ-ràng.","Bơh ò gơs bơta lơi pồl mơ ò gơ pò tơlik, kung ò gơs broă lơi ndơp mơ ò gơlik loh làng."],["23","Nếu ai có tai mà nghe, hãy nghe!","Dilah cau lơi gơs tồr nàng iat, gen iat tĕ!”"],["24","Ngài lại phán rằng: Hãy cẩn-thận về điều mình nghe. Người ta sẽ đong cho các ngươi bằng lường các ngươi đã đong cho, và thêm vào đó nữa.","Kơnràñ đơs tai lah: “Kơrhia tĕ bơh bơta bol mê kơno. Bol mê was cau in mơ rnoas lơi, gen cau kung was wơl bol mê in rnoas hơ̆ , mơ bơtơl tai sơl."],["25","Vì sẽ ban thêm cho kẻ nào có; nhưng kẻ nào không có, sẽ bị cất lấy điều mình đã có.","Bơh cau lơi gơs gen rơp ai bơtơl tai, mơ cau lơi ò gơs, gen rơp tă tơn bơta khai neh gơs.”"],["Đề","Thí-dụ về hột giống mọc lên","Pơnyơu bơh gar sơntìl"],["26","Ngài lại phán rằng: Nước Đức Chúa Trời cũng như một người vãi giống xuống đất;","Yàng Jesu đơs tai lah: “Lơgar Yàng Tom Trồ la kung be dô nă cau neh sih gar tòm ù."],["27","người ngủ hay dậy, đêm và ngày, giống cứ nẩy chồi mọc lên, mà người không biết thể nào.","Khai bic hala guh, mang mơ ngai, gar cat nha hòn dờng, mơya khai ò git mbe lơi."],["28","Vì đất tự sanh ra hoa-lợi: Ban đầu là cây, kế đến bông, đoạn bông kết thành hột.","Bơh ù tơnggơs plai is gơ dê, sơnròp gơs tòm, gen gơs sơnyùr, gen gơs gar bềng tòm sơnyùr."],["29","Khi hột đã chín, người ta liền tra lưỡi hái vào, vì mùa gặt đã đến.","Tòm tŭ kòi neh dum rau, gen cau ơn mo mơ̆ di gơ bơh kơnhai toès neh di.”"],["Đề","Thí-dụ về hột cải","Pơnyơu bơh gar sơbê"],["30","Ngài lại phán rằng: Chúng ta sánh nước Đức Chúa Trời với chi, hay lấy thí-dụ nào mà tỏ ra?","Yàng Jesu lùp lah: “Bol he pơndròm lơgar Yàng Tom Trồ dê mơ bơta lơi hala ai jơnau pơnyơu lơi nàng yal tơlik taih?"],["31","Nước ấy giống như một hột cải: Khi người ta gieo, nó nhỏ hơn hết các hột giống trên đất;","Lơgar hơ̆ la kung be dô gar sơbê cau sih tòm ù, gơ dềt rlau jơh mơ ală gar ndai hơđang ù do,"],["32","song khi gieo rồi, nó mọc lên, trở nên lớn hơn mọi thứ rau, và nứt ra nhành lớn, đến nỗi chim trời núp dưới bóng nó được.","mơya dơ̆ neh sih rau, gơhòn mơ gơlik dờng rlau jơh mơ ală biap, mơ gơcah gơs ntê dờng tian gơs sềm rgơi lơh rsòn di gơ.”"],["33","Ấy bởi nhiều lời thí-dụ như cách ấy mà Ngài giảng đạo cho họ, tùy theo sức họ nghe được.","Yàng Jesu ngui oă jơnau pơnyơu ndròm behơ̆ mơ bơto jơnau Yàng bol khai in, jat be bơta chài rgơi bol khai wă."],["34","Ngài chẳng hề giảng cho chúng mà không dùng thí-dụ; nhưng, khi ở riêng, Ngài cắt nghĩa hết cho môn-đồ mình.","Kơnràñ ò bơto bol khai dilah ò ngui jơnau pơnyơu, mơya tòm tŭ ơm is mơ ală cau bơtê, gen Kơnràñ yal tơlik loh làng jơh ală bơta bol khai in."],["Đề","Đức Chúa Jêsus dẹp yên bão lớn","Yàng Jesu sồr càl rbut ơm mŏ mŏ"],["35","Đến chiều ngày ấy, Ngài phán cùng môn-đồ rằng: Chúng ta hãy qua bờ bên kia.","Tòm mho ngai hơ̆ Yàng Jesu đơs mơ ală cau bơtê lah: “Bol he tiă lă đah bơtĭ ne dà.”"],["36","Khi cho dân-chúng tan về rồi, Đức Chúa Jêsus cứ ở trong thuyền, và môn-đồ đưa Ngài đi; cũng có các thuyền khác cùng đi nữa.","Tòm tŭ neh lòi mpồl làng bol, Yàng Jesu kừ ơm tòm ơhò mơ ală cau bơtê lam Kơnràñ lòt, kung gơs ơhò ndai lòt bal sơl."],["37","Vả, có cơn bão lớn nổi lên, sóng tạt vào thuyền, đến nỗi gần đầy nước;","Nisơna, gơlik càl rbut dờng gơrondul tơngguh, ryà dà mut tòm ơhò tian gơs mơr bềng dà."],["38","nhưng Ngài đương ở đằng sau lái, dựa gối mà ngủ. Môn-đồ thức Ngài dậy mà thưa rằng: Thầy ôi, thầy không lo chúng ta chết sao?","Mơya Kơnràñ ơm tơnơ̆ di tiah tơrwơl ơhò sơnđìng bồ di kơrnòl mơ bic. Ală cau bơtê pơrlai Kơnràñ mơ đơs lah: “Ơ cau Bơto, ồng ò kơlôi bol he mơr chơt roh ơ?”"],["39","Ngài bèn thức dậy, quở gió và phán cùng biển rằng: Hãy êm đi, lặng đi! Gió liền dứt và đều yên- lặng như tờ.","Phul Yàng Jesu guh mo, lah pơrhơng càl mơ đơs mơ đàlềng lah: “Thit tĕ, ơm tĕ mŏ mŏ!” Càl thit mo mơ ơm mŏ mŏ gen gơs ring drik ngan."],["40","Đoạn, Ngài phán cùng môn-đồ rằng: Sao các ngươi sợ? Chưa có đức-tin sao?","Chòp Yàng Jesu đơs mơ ală cau bơtê lah: “Ñchi bơh tài bol mê rngòt taih? Òhềt gơs bơta dòn ơ?”"],["41","Môn-đồ kinh-hãi lắm, nói với nhau rằng: Vậy thì người nầy là ai, mà gió và biển cũng đều vâng lịnh người?","Ală cau bơtê rngòt rngơt ngan mơ đơs bal lah: “Cau do la ñcau, tian gơs càl mơ đàlềng kung dòn bơh khai dê taih?”"]],"cult":{"t":"Chu Trình Sinh Trưởng Của Hạt Lúa & Cây Trồng Trong Mác 4","lead":"Kho tàng từ vựng nông nghiệp chính xác đến từng giai đoạn phát triển của cây lúa trên nương rẫy người K'Ho (Câu 26–32):","pts":[["Giai đoạn 1 – Gieo hạt và nảy mầm",["sih gar → gieo hạt giống (Câu 3, 26) trên đất tốt (ù niam)","gơs ryas → đâm rễ (Câu 6)","cat nha hòn dờng → nảy chồi nhú lá lớn lên (Câu 27: cat = nảy ra, nha = lá/mầm)"]],["Giai đoạn 2 – Đứng cái, trổ đòng và chắc hạt",["sơnròp gơs tòm → ban đầu mọc thành thân cây / ống lúa (tòm)","gen gơs sơnyùr → kế đến trổ bông / gié lúa (sơnyùr)","gen gơs gar bềng tòm sơnyùr → kết hạt chắc đầy bông (Câu 28)","gơcah gơs ntê dờng → đâm ra những cành/nhành lớn để chim trời làm tổ (lơh rsòn – Câu 32)"]],["Giai đoạn 3 – Lúa chín và mùa gặt",["kòi neh dum rau → lúa đã chín vàng (Câu 29)","ơn mo mơ̆ di gơ → đưa liềm / lưỡi hái vào gặt","kơnhai toès neh di → mùa gặt lúa đã đến (kơnhai = tháng/mùa, toès = gặt lúa)"]]]},"prac":[{"dir":"vk","q":"Ai có tai để lắng nghe, thì hãy lắng nghe!","a":"Cau lơi gơs tồr nàng iat, gen iat tĕ!","exp":"Câu điệp khúc nổi tiếng trong Mác 4:9 và 4:23: cau lơi... gen... (ai... thì...); tồr = tai; iat = lắng nghe; iat tĕ! = hãy lắng nghe!"},{"dir":"vk","q":"Hạt giống rơi vào đất tốt thì mọc lên, trở nên lớn và sinh ra quả: hạt thì ba mươi, hạt thì sáu mươi, hạt thì một trăm.","a":"Gar rung di ù niam, gen gơhòn, gơlik dờng mơ gơlik plai; gơnar bà pe jơt, gơnar bà prau jơt, gơnar bà dô rhiăng.","exp":"Nguyên văn Mác 4:8: ù niam = đất tốt; pe jơt = 30; prau jơt = 60; dô rhiăng = 100. STT Bài Tập (Câu Cần Dịch) Đáp Án Chuẩn & Giải Thích Cấu Trúc (KPM2018)"},{"dir":"vk","q":"Khi lúa đã chín rồi, người ta liền đưa lưỡi hái vào vì mùa gặt đã đến.","a":"Tòm tŭ kòi neh dum rau, gen cau ơn mo mơ̆ di gơ bơh kơnhai toès neh di.","exp":"Nguyên văn Mác 4:29: kòi neh dum rau = lúa đã chín rồi; mơ̆ = lưỡi hái/liềm; kơnhai toès = tháng gặt/mùa gặt."},{"dir":"vk","q":"Tại sao các bạn sợ hãi? Các bạn vẫn chưa có niềm tin sao?","a":"Ñchi bơh tài bol mê rngòt taih? Òhềt gơs bơta dòn ơ?","exp":"Nguyên văn Mác 4:40: câu hỏi lý do Ñchi bơh tài ... taih?; rngòt = sợ hãi; òhềt ... ơ? = chưa... sao?"},{"dir":"kv","q":"Bol mê was cau in mơ rnoas lơi, gen cau kung was wơl bol mê in rnoas hơ̆ , mơ bơtơl tai sơl.","a":"Các bạn đong cho người ta bằng cái lường nào, thì người ta cũng sẽ đong trả lại cho các bạn bằng cái lường ấy, và còn thêm vào đó nữa.","exp":"was = đong; rnoas = cái lường đong; was wơl = đong lại; bơtơl tai sơl = thêm vào nữa."},{"dir":"kv","q":"Phul Yàng Jesu guh mo, lah pơrhơng càl mơ đơs mơ đàlềng lah: 'Thit tĕ, ơm tĕ mŏ mŏ!' Càl thit mo mơ ơm mŏ mŏ gen gơs ring drik ngan.","a":"Tức thì Chúa Giê-su thức dậy, quở trách gió và phán với biển rằng: 'Hãy dứt đi, hãy im lặng đi!' Gió liền dứt và im lặng, trở nên phẳng lặng như tờ.","exp":"lah pơrhơng = quở trách; càl = gió; thit tĕ = hãy dứt đi; ring drik ngan = yên lặng như tờ."}]},{"n":5,"t":"Hỏi Tên, Tuổi Tác, Chăn Nuôi, Y Tế & Gia Đình","words":[["sơnđan","Tên, tên gọi; đặt tên","Tên, tên gọi","Danh / Động từ","",""],["ai","Con, em, chị (ngôi thứ 2 thân mật gọi người nữ)","Con, em","Đại từ (Nữ)","Ơ kòn ùr, bơta dòn {ai} neh sơmbòi ai","Hỡi con gái, đức tin con đã chữa lành con"],["gơp bơtiàn","Bà con thân quyến, họ hàng thân thuộc","Bà con thân quyến","Cụm danh từ","Rê tĕ hơ hìu mê, tòm tiah {gơp bơtiàn} mê","Hãy về nhà ngươi, nơi bà con thân thuộc ngươi"],["ƀòn dờng","Thành phố, thị tr g màng ò git {nđò}","những việc lớn lao không sao kể xiết"],["ai kòp sơlo kơnjơ̆ rlau tai","trái lại bệnh càng nặng thêm"],["kòl cau {tơndò gơsàng} hala cap mơ che sreng","bị người ta cùm chân và trói bằng xích"],["Ñchi sơnđan mê taih? – Sơnđan añ la K'Brêu, kòn ùr añ dê neh tơl jơt bàr nam.","Tên của bạn là gì? – Tên của tôi là K'Brêu, con gái của tôi đã lên mười hai tuổi."],["Ơ kòn ùr, bơta dòn ai neh sơmbòi ai. Rê tĕ lơngap lơngai, mơ geh bòi tĕ kòp ai dê!","Hỡi con gái, đức tin của con đã chữa lành cho con. Hãy về bình an và được lành bệnh của con!"],["Bañ rngòt, mìng dòn lơm! Kòn ùr dềt ồng dê ò chơt ò, mơya khai bic lơhă gơ dê.","Đừng sợ, chỉ tin mà thôi! Con gái nhỏ của ông không chết đâu, nhưng cháu đang ngủ yên."],["Rê tĕ hơ hìu mê, tòm tiah gơp bơtiàn mê, mơ yal wơl bol khai in bơta dờng màng mơ Yàng neh lơh mê in.","Hãy về nhà của bạn, nơi bà con thân thuộc của bạn, và kể lại cho họ những việc lớn lao mà Chúa đã làm cho bạn."],["Khai kong bòl glar ngan tòm tê oă cau gơnoar sơnơm, roh jơh jền priă phan mơna, mơya ò bòi đô êt lơi, ai kòp sơlo kơnjơ̆ rlau tai.","Bà chịu khổ sở nhiều trong tay nhiều thầy thuốc, hao tốn hết tiền bạc của cải, nhưng chẳng lành chút nào, trái lại bệnh càng ngày càng nặng thêm."],["Kơnràñ at di tê khai mơ đơs lah: 'Talitha koumi!' Gơtha la: 'Ơ kòn ùr, Añ sồr ai guh tĕ!' Tŭ hơ̆ mo oh ùr hơ̆ guh mơ cơnđòa lòt.","(Mác 5:41–42) \"Ngài cầm lấy tay em mà phán rằng: 'Ta-li-tha cu-mi!' Nghĩa là: 'Hỡi con gái nhỏ, Ta truyền cho con hãy chỗi dậy!' Tức thì bé gái ấy đứng dậy và bước đi."]],"rs":[["mpồl sur hơ̆ {pơgap} di bàr rbồ nơm","bầy heo đó ước chừng khoảng hai nghìn con"],["kòp pìng nhàm {neh} jơt bàr nam rau","đã 12 năm rồi"],["bơh khai {neh tơl} jơt bàr nam","vì em đã lên 12 tuổi"],["dan Kơnràñ tus ơn tê hơđang khai","xin Ngài đến đặt tay trên cháu"],["dan {bañ} lơh bòl glar di añ","xin đừng làm khổ tôi"],["Bañ rngòt, {mìng} dòn {lơm}.","Đừng sợ, chỉ tin mà thôi"],["Kơnràñ lùp lah: ‘Ñchi sơnđan mê taih?’ Khai ho lah: ‘Sơnđan añ la mpồl ling...’","Ngài hỏi nó rằng: Mầy tên gì? Nó thưa rằng: Tên tôi là Quân-đội, vì chúng tôi đông lắm."],["Ơ kòn ùr, bơta dòn ai neh sơmbòi ai... geh bòi tĕ kòp ai dê.","Ngài bèn phán cùng người rằng: Hỡi con gái ta, đức-tin con đã chữa lành con; hãy đi bình-an, và được lành bịnh con."],["Ơ kòn ùr, Añ sồr ai guh tĕ!","Ngài nắm tay nó mà phán rằng: Ta-li-tha Cu-mi; nghĩa là: Hỡi con gái nhỏ, ta truyền cho mầy, hãy chỗi dậy."],["Mặc dù / Dầu","bulah"],["ò gơs cau lơi rgơi cap khai bulah ai sreng lòs","không ai có thể trói người ấy mặc dù dùng dây xích sắt"],["Càng ngày càng... thêm","sơlo ... rlau tai"],["mơya ò bòi đô êt lơi, ai kòp sơlo kơnjơ̆ rlau tai.","nhưng không bớt chút nào, trái lại bệnh càng nặng thêm"]],"rules":[{"t":"Hỏi & Trả lời Tên gọi (Ñchi sơnđan mê taih?)","f":"Hỏi: {Ñchi sơnđan} mê {taih}? Đáp: {Sơnđan añ la} + [Tên]","ex":[["Kơnràñ lùp lah: ‘Ñchi sơnđan mê taih?’ Khai ho lah: ‘Sơnđan añ la mpồl ling...’","Ngài hỏi nó rằng: Mầy tên gì? Nó thưa rằng: Tên tôi là Quân-đội, vì chúng tôi đông lắm."]],"c":"Mẫu câu chuẩn mực nhất để hỏi tên người đối diện (Tên bạn là gì? – Tên tôi là...)."},{"t":"Đại từ ngôi thứ 2 dành cho Nữ giới / Con gái (ai)","f":"ai = con / em / chị (thay cho mê khi nói nhẹ nhàng với phái nữ)","ex":[["Ơ kòn ùr, bơta dòn ai neh sơmbòi ai... geh bòi tĕ kòp ai dê.","Ngài bèn phán cùng người rằng: Hỡi con gái ta, đức-tin con đã chữa lành con; hãy đi bình-an, và được lành bịnh con."],["Ơ kòn ùr, Añ sồr ai guh tĕ!","Ngài nắm tay nó mà phán rằng: Ta-li-tha Cu-mi; nghĩa là: Hỡi con gái nhỏ, ta truyền cho mầy, hãy chỗi dậy."]],"c":"Trong tiếng K'Ho, dùng ai khi nói với phụ nữ hoặc bé gái thể hiện sự trân trọng, dịu dàng."},{"t":"Số đếm Hàng nghìn (rbồ) & Ước lượng (pơgap di)","f":"{pơgap} di + [Số] + rbồ + [Loại từ]","ex":[["mpồl sur hơ̆ {pơgap} di bàr rbồ nơm","bầy heo đó ước chừng khoảng hai nghìn con"]],"c":"rbồ = nghìn (dùl rbồ = 1.000, bàr rbồ = 2.000); {pơgap} di = khoảng độ / ước chừng."},{"t":"Cách nói Số năm & Tuổi tác (neh tơl ... nam)","f":"Khoảng thời gian: {neh} + [Số] + nam rau Tuổi: {neh tơl} + [Số] + nam","ex":[["kòp pìng nhàm {neh} jơt bàr nam rau","đã 12 năm rồi"],["bơh khai {neh tơl} jơt bàr nam","vì em đã lên 12 tuổi"]],"c":"nam (dạng rút gọn của sơnam) đi ngay sau số đếm để chỉ năm hoặc tuổi."},{"t":"Lời cầu xin lịch sự \"Xin hãy / Xin đừng\" (dan ... / dan bañ ...)","f":"Khẳng định: dan + [Chủ ngữ] + [V] Phủ định: dan {bañ} + [V]","ex":[["dan Kơnràñ tus ơn tê hơđang khai","xin Ngài đến đặt tay trên cháu"],["dan {bañ} lơh bòl glar di añ","xin đừng làm khổ tôi"]],"c":"Đặt dan ở đầu mệnh đề lời nói tương đương từ \"xin / cầu xin\" trong tiếng Việt."},{"t":"Mệnh đề Nhượng bộ \"Mặc dù / Dầu\" (bulah)","f":"[Mệnh đề chính] + {bulah} + [Mệnh đề nhượng bộ]","ex":[["Mặc dù / Dầu","bulah"],["ò gơs cau lơi rgơi cap khai bulah ai sreng lòs","không ai có thể trói người ấy mặc dù dùng dây xích sắt"]],"c":"{bulah} = mặc dù / dầu cho (cũng gặp trong I Tim 1:13)."},{"t":"Cấp độ tăng tiến \"Càng ngày càng... thêm\" (sơlo ... rlau tai)","f":"ai + [Chủ ngữ] + {sơlo} + [Tính từ] + {rlau tai}","ex":[["Càng ngày càng... thêm","sơlo ... rlau tai"],["mơya ò bòi đô êt lơi, ai kòp sơlo kơnjơ̆ rlau tai.","nhưng không bớt chút nào, trái lại bệnh càng nặng thêm"]],"c":"{sơlo} + Adj + {rlau tai} = càng lúc càng ... hơn nữa (kơnjơ̆ = nặng)."},{"t":"Cấu trúc \"Chỉ... mà thôi\" (mìng ... lơm)","f":"{mìng} + [Động từ / Danh từ] + {lơm}","ex":[["Bañ rngòt, {mìng} dòn {lơm}.","Đừng sợ, chỉ tin mà thôi"]],"c":"Cặp khung {mìng} ... {lơm} bao quanh từ cần giới hạn: chỉ... mà thôi."}],"dl":[{"t":"Làm quen, hỏi tên tuổi & thăm hỏi bà con","turns":[["A","Chào em gái, ñchi sơnđan ai taih? Mơ ƀòn ai dê ơm tòm kơnhwàl lơi?","Chào em gái, tên của em là gì vậy? Và buôn của em ở tại huyện/vùng nào?"],["B","Sơnđan añ la Ka Hương. Añ neh tơl bàr jơt (20) nam rau. Hìu mơ gơp bơtiàn añ dê ơm tòm ƀòn dềt rềp ƀòn dờng Đà Lạt.","Tên của em là Ka Hương. Em đã tròn 20 tuổi rồi. Nhà và bà con họ hàng của em ở tại một buôn nhỏ gần thành phố Đà Lạt."],["A","Rất vui được gặp ai! Chúc ai mơ gơp bơtiàn ai dê luôn mạnh khỏe mơ rê hìu lơngap lơngai!","Rất vui được gặp em! Chúc em và bà con họ hàng của em luôn mạnh khỏe và về nhà bình an!"]],"note":"Khi làm quen, người K'Ho hỏi tên bằng câu Ñchi sơnđan mê taih? (Tên bạn là gì? – Câu 9). Để ca ngợi những công việc lớn lao kỳ diệu không sao kể xiết, dùng cụm bơta dờng màng ò git nđò (những việc lớn lao không biết sao kể hết – Câu 19, 20)."},{"t":"Chăn nuôi gia súc trên nương đồi Tây Nguyên","turns":[["A","Mpồl sur mơ bò trang trại mê dê gam ơm sa hơđang dờr mơnơm đằng kia ơ?","Đàn heo và bò của trang trại bạn đang ăn trên sườn đồi đằng kia phải không?"],["B","Đúng rau! Trang trại bol hi dê gơs pơgap di dùl rhiăng (100) nơm bò mơ dùl rbồ (1.000) nơm sur.","Đúng rồi! Trang trại của chúng tôi có khoảng độ 100 con bò và 1.000 con heo."],["A","Ală cau ê sur pal kơrhia, bañ lòi ală sur ntoat rềp kơh hiòng kẻo ngã xuống dà!","Những người chăn heo phải cẩn thận, đừng để đàn heo chạy gần bờ dốc sông kẻo ngã xuống nước!"]],"note":"Khi đếm các loài động vật (như heo, trâu, bò, chim), tiếng K'Ho luôn đặt loại từ nơm (con) sau số đếm: bàr rbồ nơm (hai nghìn con – Câu 13). Động từ ê đứng trước tên vật nuôi mang nghĩa là chăn / chăn dắt (cau ê sur = người chăn heo – Câu 14)."},{"t":"Thăm hỏi người bệnh lâu năm đã được chữa lành","turns":[["A","Añ kơno yal lài òr mò bị kòp kơnjơ̆ nhiều nam, neh tốn oă jền priă nàng mua sơnơm ơ?","Tôi nghe nói trước đây bà bị bệnh nặng nhiều năm, đã tốn nhiều tiền bạc để mua thuốc phải không?"],["B","Đúng behơ̆ ! Lài òr mò kong bòl glar ngan, mơya nay nhờ cau gơnoar sơnơm tận tình mơ ơn Yàng, mò neh geh bòi hoàn toàn rau!","Đúng như vậy! Trước đây bà chịu đau đớn khổ sở lắm, nhưng nay nhờ bác sĩ tận tình và ơn Chúa, bà đã được khỏi bệnh hoàn toàn rồi!"]],"note":"Đoạn văn về người phụ nữ bị bệnh băng huyết 12 năm (Câu 25–34) cung cấp cách diễn đạt tình trạng bệnh kéo dài (kòp ... neh jơt bàr nam rau), sự tốn kém tài chính (roh jơh jền priă phan mơna), và lời thú nhận chân thật (yal song jơh ală bơta = trình bày thật hết mọi điều – Câu 33)."},{"t":"Giữ yên lặng cho em nhỏ ngủ trong phòng","turns":[["A","Ñchi bơh tài ală kòn dềt lại lơh nggồr nggàc tơngah măng hìu behơ̆ taih?","Tại sao các cháu nhỏ lại làm ồn ào trước cửa nhà như vậy?"],["B","Bol mê bañ lơh nggồr nggàc! Oh ùr dềt gam bic lơhă tòm ơdŭ.","Các cháu đừng làm ồn! Em gái nhỏ đang ngủ yên ở trong phòng."],["A","Đợi dô êt tai tòm tŭ oh ùr guh mơ cơnđòa lòt ra ngoài, mẹ rơp ai oh ùr mơ bol mê in sào piang!","Đợi một lát nữa khi em gái thức dậy và bước đi ra ngoài, mẹ sẽ cho em và các cháu cùng ăn cơm!"]],"note":"Khi phân biệt hai nhóm người đang làm hai hành động khác nhau trong cùng một khung cảnh (\"kẻ thì..., người thì...\"), tiếng K'Ho dùng cấu trúc cau ƀà [Động từ 1], cau ƀà [Động từ 2]: \"cau ƀà ñìm, cau ƀà hòi driau pơt wơl\" (kẻ thì khóc, người thì kêu la thảm thiết – Câu 38)."},{"t":"Sự biến đổi cuộc đời của một người được cứu giúp","turns":[["A","Sền ne, cau klau gam nggui mơ soh ồil ào sạch đẹp đằng kia có phải là người trước đây bị bệnh nặng ò?","Nhìn kìa, người đàn ông đang ngồi và mặc quần áo sạch đẹp đằng kia có phải là người trước đây bị bệnh nặng không?"],["B","Đúng la khai! Nay khai neh gơs dơngoh jak niam be òs mơ rê hìu sống vui vẻ bal mơ gơp bơtiàn khai dê.","Đúng là anh ấy! Nay anh ấy đã có trí khôn tỉnh táo khỏe mạnh như xưa và trở về nhà sống vui vẻ cùng bà con họ hàng của mình."]],"note":"Để diễn tả thói quen thường xuyên trong quá khứ (\"vẫn thường ở / vốn ở...\"), tiếng K'Ho đặt từ òs trước động từ: Khai òs ơm di tiah bơtô ƀồc (Người ấy vốn thường ở tại nơi mồ mả – Câu 3, 5); và khi đặt be òs ở cuối câu, nó mang nghĩa là \"như cũ / như bình thường trước đây\" (dơngoh jak niam be òs – Câu 15)."}],"ds":[["Bol mê bañ lơh nggồr nggàc! Oh ùr dềt gam bic lơhă tòm ơdŭ.","Các cháu đừng làm ồn! Em gái nhỏ đang ngủ yên ở trong phòng."]],"vr":[["Đề","Người bị quỉ ám ở miền Gê-ra-sa","Yàng Jesu bơtrơh cà bơh di dô nă cau Jerase"],["1","Chúng qua đến bờ bên kia biển, vào miền Gê-ra- sa.","Yàng Jesu bal mơ ală cau bơtê tus đah bơtĭ ne đàlềng Galile, tòm kơnhwàl làng bol Jerase."],["2","Đức Chúa Jêsus vừa ra khỏi thuyền, tức thì có một người ở nơi mồ-mả ra, bị tà-ma ám, đón Ngài.","Yàng Jesu lik bơh ơhò, gen tŭ hơ̆ mo gơs dô nă cau kòl cà lơh lik bơh tiah bơtô ƀồc nàng tip Kơnràñ."],["3","Người đó vốn ở trong mồ-mả, không ai trói người được, dầu dùng dây xích cũng vậy.","Khai òs ơm di tiah bơtô ƀồc, ò gơs cau lơi rgơi cap khai bulah ai sreng lòs;"],["4","Vì nhiều lần người ta cùm và trói người bằng dây xích, nhưng người bẻ dây xích và đập gãy cùm, chẳng ai có sức cầm-giữ người được.","bơh neh oă dơ̆ khai kòl cau tơndò gơsàng hala cap mơ che sreng sơl, gen khai gơltac sreng mơ dơkă gơsàng hơ̆ , ò gơs cau lơi gơs tơl pràn nàng geh at ƀồ khai."],["5","Người cứ ở trong mồ-mả và trên núi luôn, đêm ngày kêu-la, và lấy đá ghè vào mình.","Khai òs ơm sùm di tiah bơtô ƀồc mơ hơđang mơnơm, ngai mơ mang hòi driau mơ ai lŭ còr să tòm."],["6","Người thấy Đức Chúa Jêsus ở xa, thì chạy đến quì- lạy Ngài,","Khai gŏ Yàng Jesu bơh ngăi, gen ntoat tus cùn khoai Kơnràñ,"],["7","và kêu lớn tiếng rằng: Hỡi Jêsus, Con Đức Chúa Trời Rất Cao, giữa tôi với Ngài có việc chi chăng? Tôi nhân danh Đức Chúa Trời van-xin Ngài chớ làm khổ tôi!","mơ hòi driau dờng lah: “Ơ Yàng Jesu, Kòn Yàng Tom Trồ Hơđang Rlau Jơh, gơs ñchi jơnau digùl añ mơ Kơnràñ taih? Añ ai sơnđan Yàng Tom Trồ nàng rac dan mơ Kơnràñ dan bañ lơh bòl glar di añ.”"],["8","Vì Đức Chúa Jêsus có phán cùng nó rằng: Hỡi tà- ma, hãy ra khỏi người nầy!","Bơh Yàng Jesu pa đơs mơ khai lah: “Ơ cà, lik tĕ bơh di cau do.”"],["9","Ngài hỏi nó rằng: Mầy tên gì? Nó thưa rằng: Tên tôi là Quân-đội, vì chúng tôi đông lắm.","Kơnràñ lùp lah: “Ñchi sơnđan mê taih?” Khai ho lah: “Sơnđan añ la mpồl ling, bơh bol hi gal ngan.”"],["10","Nó lại van-xin Ngài đừng đuổi chúng nó ra khỏi miền đó.","Gơ rac dan tai mơ Kơnràñ bañ bơtrơh bol gơ lik bơh kơnhwàl hơ̆ ."],["11","Vả, chỗ đó, tại trên núi, có một bầy heo đông đương ăn.","Tŭ hơ̆ gơs dô mpồl sur oă ngan ơm sa rềp hơđang dờr."],["12","Các quỉ cầu-xin Ngài rằng: Xin khiến chúng tôi đến với bầy heo ấy, để chúng tôi nhập vào chúng nó.","Ală cà rac dan mơ Kơnràñ lah: “Dan ai bol hi in mut tòm ală sur hơ̆ .”"],["13","Đức Chúa Jêsus cho phép. Các tà-ma bèn ra khỏi người, nhập vào bầy heo; cả bầy từ trên dốc nhảy xuống biển; có độ hai ngàn con heo chết chìm cả dưới biển.","Yàng Jesu ai gơnoar bol gơ in. Ală cà lik bơh di cau hơ̆ , gen mut tòm mpồl sur; mpồl sur hơ̆ pơgap di bàr rbồ nơm, bơh kơh ntruñ tòm đàlềng, dà bŭ chơt jơh."],["14","Những kẻ chăn heo trốn đi, thuật việc ấy trong thành và ngoài thôn-ấp. Người ta bèn đi xem việc mới xảy đến.","Ală cau ê sur ntoat dồ, yal wơl jơnau do tòm ƀòn dờng mơ tòm ƀòn dềt. Ɓòn lơgar lik lòt nàng sền bơta neh gơlik gơs hơ̆ ."],["15","Vậy, chúng đến cùng Đức Chúa Jêsus, thấy người đã bị nhiều quỉ ám đang ngồi, mặc quần-áo, trí- khôn bình-tĩnh, thì sợ-hãi lắm.","Tòm tŭ bol khai tus hơ Yàng Jesu, gŏ cau neh gơkòl mpồl cà lơh hơ̆ ơm nggui, soh ồil ào, dơngoh jak niam be òs, gen bol khai rngòt rngơt ngan."],["16","Những người đã thấy việc đó, thuật cho họ nghe chuyện đã xảy đến cho kẻ bị quỉ ám và bầy heo.","Ală cau neh gŏ broă hơ̆ yal wơl bol khai in git jơnau neh gơlik gơs di cau neh gơkòl ală cà lơh mơ di mpồl sur hơ̆ ."],["17","Chúng bèn xin Ngài ra khỏi địa-phận mình.","Chòp bol khai rac dan mơ Kơnràñ lik bơh nhàr kơnhwàl lơgar bol khai dê."],["18","Khi Ngài bước lên thuyền, thì người đã khỏi quỉ ám xin theo Ngài.","Tòm tŭ Kơnràñ rơp mut tòm ơhò, gen cau neh gơkòl ală cà lơh hơ̆ dan lòt jat Kơnràñ."],["19","Song Đức Chúa Jêsus không cho, phán cùng người rằng: Hãy về nhà ngươi, nơi bà-con ngươi, và thuật lại cho họ thể nào Chúa đã làm những việc lớn cho ngươi, và đã thương-xót ngươi.","Mơya Yàng Jesu ò ai, mơ đơs lah: “Rê tĕ hơ hìu mê, tòm tiah gơp bơtiàn mê, mơ yal wơl bol khai in bơta dờng màng ò git nđò mơ Yàng neh lơh mê in, mơ mbe lơi Kơnràñ neh kòñ nđàc di mê.”"],["20","Vậy, người đi, khởi sự đồn ra trong xứ Đê-ca-bô-lơ những việc lớn Đức Chúa Jêsus đã làm cho mình; ai nấy đều lấy làm lạ.","Behơ̆ khai lòt yal tơlik tòm kơnhwàl Dekapôl ală bơta dờng màng ò git nđò mơ Yàng Jesu neh lơh khai in. Jơh ală cau ai lơh krơi ngan."],["Đề","Con gái Giai-ru và người đàn-bà đau huyết-lậu","Kòn ùr Jeru dê mơ cau ùr kòp pìng nhàm"],["21","Khi Đức Chúa Jêsus lại xuống thuyền qua bờ bên kia, có đoàn dân đông nhóm-họp chung-quanh Ngài. Ngài đứng trên bờ biển.","Tòm tŭ Yàng Jesu mut tòm ơhò mơ neh tiă wơl tus đah bơtĭ ne dà, gơs mpồl làng bol oă pơjum gùt dar Kơnràñ; Kơnràñ ntào di gah đàlềng."],["22","Bấy giờ, có một người trong những người cai nhà hội tên là Giai-ru, đến, thấy Đức Chúa Jêsus, bèn gieo mình nơi chân Ngài,","Jeru la dô nă cau at ƀồ hìu jum Juda lòt tus, gŏ Yàng Jesu, gen tơmbic să di jơng Kơnràñ,"],["23","nài-xin mà rằng: Con gái nhỏ tôi gần chết; xin Chúa đến, đặt tay trên nó, đặng nó lành-mạnh và sống.","rac dan lah: “Kòn ùr dềt añ neh mơr chơt rau; dan Kơnràñ tus ơn tê hơđang khai nàng khai in gơs bòi mơ kis.”"],["24","Đức Chúa Jêsus đi với người; có một đoàn dân đông theo và lấn Ngài.","Yàng Jesu lòt bal mơ khai. Mpồl làng bol oă lòt jat bal mơ ntềt Kơnràñ."],["25","Vả, tại đó có một người đàn-bà bị bịnh mất huyết đã mười hai năm,","Mơ tai, gơs dô nă cau ùr kòp pìng nhàm neh jơt bàr nam rau,"],["26","bấy lâu chịu khổ-sở trong tay nhiều thầy thuốc, hao-tốn hết tiền-của, mà không thấy đỡ gì; bịnh lại càng nặng thêm.","kong bòl glar ngan tòm tê oă cau gơnoar sơnơm, roh jơh jền priă phan mơna, mơya ò bòi đô êt lơi, ai kòp sơlo kơnjơ̆ rlau tai."],["27","Người đã nghe tin về Đức Chúa Jêsus, bèn lẩn vào đằng sau giữa đám đông, mà rờ áo Ngài.","Khai neh kơno yal bơh Yàng Jesu, gen khai ntềt mut bơh tơnơ̆ tòm gùl mpồl làng bol mơ ƀur di ào Kơnràñ."],["28","Vì người nói rằng: Nếu ta chỉ rờ đến áo Ngài mà thôi, thì ta sẽ được lành.","Bơh khai đơs is lah: “Dilah añ mìng ƀur di ào Kơnràñ gen añ rơp geh bòi.”"],["29","Tức thì suối huyết cầm lại, và người cảm biết trong mình rằng bịnh được lành rồi.","Tŭ hơ̆ mo nhàm ò pìng tai. Khai git tòm să khai neh geh bòi rau."],["30","Tức thì Đức Chúa Jêsus tự biết có quyền-phép từ nơi mình ra, bèn xây mặt lại giữa đám đông mà hỏi rằng: Ai đã rờ áo ta?","Tŭ hơ̆ mo Yàng Jesu git gơs gơnap gơnoar neh lik bơh Kơnràñ, gen wơlke hơ mpồl làng bol mơ lùp lah: “Ñcau neh ƀur di ào Añ taih?”"],["31","Môn-đồ thưa rằng: Thầy thấy đoàn dân lấn-ép thầy, mà thầy lại hỏi rằng: Ai rờ đến ta sao?","Ală cau bơtê ho lah: “Kơnràñ gŏ mpồl làng bol ntềt Kơnràñ mơ Kơnràñ gam lùp wơl lah: ‘Ñcau neh ƀur di Añ taih?’”"],["32","Nhưng Ngài ngó quanh để xem ai đã làm điều đó.","Mơya Yàng Jesu sền gùt dar nàng jòi ñcau neh lơh bơta hơ̆ ."],["33","Người đàn-bà biết việc đã xảy đến trong mình, thì sợ-hãi run-rẩy, đến sấp mình xuống trước mặt Ngài, và tỏ thật hết mọi điều.","Cau ùr git bơta neh gơlik gơs di khai gen rngòt rơm să, lòt tus tơmbic să di jơng Kơnràñ mơ yal song jơh ală bơta."],["34","Ngài bèn phán cùng người rằng: Hỡi con gái ta, đức-tin con đã chữa lành con; hãy đi bình-an, và được lành bịnh con.","Yàng Jesu đơs mơ khai lah: “Ơ kòn ùr, bơta dòn ai neh sơmbòi ai. Rê tĕ lơngap lơngai, mơ geh bòi tĕ kòp ai dê.”"],["35","Đương khi Ngài còn phán, có kẻ đến từ nhà người cai nhà hội mà nói với người rằng: Con gái ông đã chết rồi; còn phiền Thầy làm chi?","Tòm tŭ Yàng Jesu gam đơs jơnau do, gơs cau bơh hìu jum Jeru tus đơs mơ khai lah: “Kòn ùr ồng neh chơt rau, ñchi kòñ lơh tơmƀòl tai Cau Bơto taih?”"],["36","Nhưng Đức Chúa Jêsus chẳng màng đến lời ấy, phán cùng cai nhà hội rằng: Đừng sợ, chỉ tin mà thôi.","Mơya Yàng Jesu ò gơjal bơh jơnau hơ̆ gen đơs mơ khai lah: “Bañ rngòt, mìng dòn lơm.”"],["37","Ngài chẳng cho ai theo mình, trừ ra Phi-e-rơ, Gia- cơ, và Giăng là em Gia-cơ.","Gen Kơnràñ ò ai cau lơi in jat Kơnràñ, mìng Pier, Jakơ mơ Jang la oh Jakơ dê lơm."],["38","Khi đã đến nhà người cai nhà hội, Ngài thấy chúng làm om-sòm, kẻ khóc người kêu lớn tiếng.","Dơ̆ neh tus hơ hìu cau at ƀồ hìu jum Jeru, Kơnràñ gŏ dô mpồl cau lơh nggồr nggàc, cau ƀà ñìm, cau ƀà hòi driau pơt wơl."],["39","Vào nhà rồi, Ngài phán cùng chúng rằng: Sao các ngươi làm ồn-ào và khóc-lóc vậy? Đứa trẻ chẳng phải chết, song nó ngủ.","Neh mut tòm hìu rau, Kơnràñ đơs mơ bol khai lah: “Ñchi bơh tài bol mê lơh nggồr nggàc mơ ñìm rac behơ̆ taih? Oh dềt do ò chơt ò, mơya khai bic lơhă gơ dê.”"],["40","Chúng nhạo-báng Ngài. Ngài bèn đuổi chúng ra hết, đem cha mẹ đứa trẻ với những kẻ theo Ngài, cùng vào chỗ nó nằm.","Bol hơ̆ dơñŏ tơnhial di Kơnràñ. Behơ̆ , Kơnràñ bơtrơh tơlik jơh ală bol khai, mơ cèng mè bèp oh dềt hơ̆ bal mơ pe nă cau bơtê Kơnràñ dê mut tòm ơdŭ tiah oh dềt bic."],["41","Ngài nắm tay nó mà phán rằng: Ta-li-tha Cu-mi; nghĩa là: Hỡi con gái nhỏ, ta truyền cho mầy, hãy chỗi dậy.","Kơnràñ at di tê khai mơ đơs lah: “Talitha koumi!” Gơtha la: “Ơ kòn ùr, Añ sồr ai guh tĕ!”"],["42","Tức thì đứa gái chỗi dậy mà bước đi, vì đã lên mười hai tuổi. Chúng rất lấy làm lạ.","Tŭ hơ̆ mo oh ùr hơ̆ guh mơ cơnđòa lòt, bơh khai neh tơl jơt bàr nam. Ală bol hơ̆ ai lơh crih crài oă ngan."],["43","Ngài cấm ngặt chúng đừng cho ai biết sự ấy, và truyền cho đứa trẻ ăn.","Mơya Yàng Jesu bơkơŭ kràñ cê ală bol hơ̆ bañ yal cau lơi in git bơta hơ̆ , mơ sồr ai oh ùr hơ̆ in sào."]],"cult":{"t":"Các Thành Ngữ & Từ Ghép Đời Sống Trong Mác 5","lead":"Các cụm từ ghép bốn âm tiết đối xứng thường gặp trong giao tiếp đời sống:","pts":[["Từ ghép chỉ tiền bạc, tài sản (Câu 26)",["roh jơh jền priă phan mơna → hao tốn hết tiền bạc của cải (roh jơh = mất hết, jền priă = tiền bạc, phan mơna = của cải quý giá)"]],["Từ ghép chỉ quần áo và sự tỉnh táo (Câu 15)",["soh ồil ào → mặc quần áo chỉnh tề (soh = mặc, ồil = chăn/quần, ào = áo)","dơngoh jak niam be òs → trí khôn bình tĩnh trở lại như xưa (be òs = như cũ / như trước kia)"]],["Từ ghép chỉ bà con thân tộc (Câu 19)",["gơp bơtiàn → bà con họ hàng, thân quyến trong buôn làng (Rê tĕ hơ hìu mê, tòm tiah gơp bơtiàn mê)"]]]},"prac":[{"dir":"vk","q":"Tên của bạn là gì? – Tên của tôi là K'Brêu, con gái của tôi đã lên mười hai tuổi.","a":"Ñchi sơnđan mê taih? – Sơnđan añ la K'Brêu, kòn ùr añ dê neh tơl jơt bàr nam.","exp":"Hỏi tên Ñchi sơnđan mê taih? (Mác 5:9); nói tuổi neh tơl jơt bàr nam (đã tròn 12 tuổi – Mác 5:42)."},{"dir":"vk","q":"Hỡi con gái, đức tin của con đã chữa lành cho con. Hãy về bình an và được lành bệnh của con!","a":"Ơ kòn ùr, bơta dòn ai neh sơmbòi ai. Rê tĕ lơngap lơngai, mơ geh bòi tĕ kòp ai dê!","exp":"Nguyên văn Mác 5:34 sử dụng đại từ ngôi thứ 2 thân mật ai dành cho người nữ/con gái."},{"dir":"vk","q":"Đừng sợ, chỉ tin mà thôi! Con gái nhỏ của ông không chết đâu, nhưng cháu đang ngủ yên.","a":"Bañ rngòt, mìng dòn lơm! Kòn ùr dềt ồng dê ò chơt ò, mơya khai bic lơhă gơ dê.","exp":"Kết hợp Mác 5:36 (Bañ rngòt, mìng dòn lơm) và Mác 5:39 (ò chơt ò, mơya khai bic lơhă gơ dê)."},{"dir":"vk","q":"Hãy về nhà của bạn, nơi bà con thân thuộc của bạn, và kể lại cho họ những việc lớn lao mà Chúa đã làm cho bạn.","a":"Rê tĕ hơ hìu mê, tòm tiah gơp bơtiàn mê, mơ yal wơl bol khai in bơta dờng màng mơ Yàng neh lơh mê in.","exp":"Nguyên văn Mác 5:19: gơp bơtiàn = bà con họ hàng; yal wơl bol khai in = kể lại cho họ."},{"dir":"kv","q":"Khai kong bòl glar ngan tòm tê oă cau gơnoar sơnơm, roh jơh jền priă phan mơna, mơya ò bòi đô êt lơi, ai kòp sơlo kơnjơ̆ rlau tai.","a":"Bà chịu khổ sở nhiều trong tay nhiều thầy thuốc, hao tốn hết tiền bạc của cải, nhưng chẳng lành chút nào, trái lại bệnh càng ngày càng nặng thêm.","exp":"kong bòl glar = chịu khổ sở; roh jơh jền priă phan mơna = tốn hết tiền của; sơlo kơnjơ̆ rlau tai = càng nặng thêm. STT Bài Tập (Câu Cần Dịch) Đáp Án Chuẩn & Giải Thích Cấu Trúc (KPM2018)"},{"dir":"kv","q":"Kơnràñ at di tê khai mơ đơs lah: 'Talitha koumi!' Gơtha la: 'Ơ kòn ùr, Añ sồr ai guh tĕ!' Tŭ hơ̆ mo oh ùr hơ̆ guh mơ cơnđòa lòt.","a":"(Mác 5:41–42) \"Ngài cầm lấy tay em mà phán rằng: 'Ta-li-tha cu-mi!' Nghĩa là: 'Hỡi con gái nhỏ, Ta truyền cho con hãy chỗi dậy!' Tức thì bé gái ấy đứng dậy và bước đi.","exp":"at di tê = cầm tay; gơtha la = nghĩa là; cơnđòa lòt = bước đi."}]},{"n":6,"t":"Quê Hương, Hành Trang, Mua Bán, Chia Sẻ Lương Thực & Lòng Can Đảm","words":[["ƀòn tòm","Quê hương, buôn làng gốc","Quê hương, buôn làng gốc","Cụm danh từ","",""],["cau chài lơh chi","Thợ mộc, người thợ làm gỗ (chi = cây, gỗ)","Thợ mộc, người thợ làm gỗ","Cụm danh từ","",""],["bơta jak chài","Sự khôn ngoan, trí tuệ tài giỏi","Sự khôn ngoan, trí tuệ tài giỏi","Cụm danh từ","{Bơta jak chài} mơ khai dòp geh hơ̆ la ñchi?","Sự khôn ngoan mà người này nhận được đó là gì?"],["ki ngàm","Tôn trọng, kính trọng (ki ngàm); xem thường, khinh dể (sền òsơp)","Tôn trọng, kính trọng","Động từ","",""],["gơs mat","Có mặt, hiện diện","Có mặt, hiện diện","Cụm động từ","",""],["dô yô dô yô","Từng đôi một, từng cặp hai người","Từng đôi một, từng cặp hai người","Cụm phó từ","sơntòm sồr lòt {dô yô dô yô}","bắt đầu sai đi từng đôi một"],["kơldung","Bao, túi đeo đi đường (kơldung); cây gậy chống (gai jra)","Bao, túi đeo đi đường","Danh từ","",""],["jă","Mang dép (jă); đôi dép/giày (gơltau jơng); chiếc áo (blah ào)","Mang dép, đôi dép/giày","Động / Danh từ","jă mìng {gơltau jơng}, bañ soh bàr blah ào","chỉ mang dép vào chân, đừng mặc hai chiếc áo"],["bài wă rò","Tiếp rước, đón tiếp hiếu khách","Tiếp rước, đón tiếp hiếu khách","Cụm động từ","",""],["rtuh","Phủi, giũ sạch (rtuh); bụi đất (thul)","Phủi, giũ sạch","Động / Danh từ","gen rtuh tĕ {thul} bơh di jơng bol mê dê","thì hãy phủi bụi khỏi chân của các ngươi"],["bong mơñă","Xức dầu, thoa dầu (mơñă = dầu)","Xức dầu, thoa dầu","Cụm động từ","",""],["rlô bòl","Nghỉ ngơi, nghỉ mệt (rlô = nghỉ, bòl = mệt nhọc)","Nghỉ ngơi, nghỉ mệt","Cụm động từ","",""],["bau ùr","Người vợ (bau ùr); cưới, kết hôn với (bau mơ)","Người vợ, cưới","Danh / Động từ","",""],["ngai deh","Ngày sinh, sinh nhật (deh = sinh ra; sa kah ngai deh = mừng sinh nhật)","Ngày sinh, sinh nhật","Cụm danh từ","gơtìp di ngai pơjum {sa kah ngai deh} Herôt dê","nhằm ngày họp mừng sinh nhật của Hê-rốt"],["yò bơta ñô những điều này vậy?"],["Să {tòm} bol mê ai tĕ bol khai in sa.","Chính các ngươi hãy cho họ ăn"],["sơntòm sồr lòt dô {yô} dô {yô}","sai đi từng đôi một"],["{sèng ƀà} dô rhiăng, {sèng ƀà} pram jơt","nhóm thì 100, nhóm thì 50"],["kừ ơm tềng hơ̆ {jơl} tus di tŭ ñă lòt.","cứ ở nguyên tại đó cho đến lúc ra đi"],["Cau lơi ƀur {gen} geh bòi {jơh}.","Ai chạm đến thì đều được lành hết thảy"],["Pơgap di pe jơ mơ prau jơ drim, Kơnràñ lòt hơđang nha đàlềng...","Khoảng giữa 3 giờ và 6 giờ sáng"],["Hãy vững lòng, Ta đây!","Kơ̆ tĕ nùs, Añ do!"],["Kơnràñ đơs mo mơ bol khai lah: ‘Kơ̆ tĕ nùs, Añ do; bañ rngòt.’","Hãy vững lòng, Ta đây; đừng sợ"]],"rules":[{"t":"Câu hỏi Số lượng \"Bao nhiêu / Mấy?\" (nđồ + Loại từ ... taih?)","f":"[Chủ ngữ] + gơs + nđồ + [Loại từ: nơm / nă] + [Danh từ] + {taih}?","ex":[["Bol mê gơs nđồ nơm piang lă {taih}?","Các ngươi có mấy/bao nhiêu ổ bánh?"]],"c":"nđồ = bao nhiêu / mấy. Đi kèm loại từ nơm (vật/con) hoặc nă (người)."},{"t":"Câu hỏi Nguồn gốc \"Từ đâu?\" (Mbơh ... taih?)","f":"{Mbơh} + [Chủ ngữ + Động từ] + {taih}?","ex":[["{Mbơh} cau do geh ală bơta do {taih}?","Từ đâu người này có được những điều này vậy?"]],"c":"{Mbơh} (ghép từ mbe + bơh) đặt đầu câu hỏi để hỏi \"Từ đâu / Do đâu?\"."},{"t":"Đại từ phản thân nhấn mạnh \"Chính...\" (Să tòm + Đại từ/Danh từ)","f":"Să {tòm} + [Chủ ngữ] + [Động từ]","ex":[["Să {tòm} bol mê ai tĕ bol khai in sa.","Chính các ngươi hãy cho họ ăn"]],"c":"Đặt Să {tòm} trước chủ ngữ để nhấn mạnh \"Chính bản thân người đó\"."},{"t":"Cấu trúc Phân phối \"Từng đôi\" (dô yô dô yô) & \"Từng nhóm\" (jat sèng)","f":"Lặp số lượng: dô {yô} dô {yô} (từng đôi một) Phân nhóm: {sèng ƀà} [Số], {sèng ƀà} [Số]","ex":[["sơntòm sồr lòt dô {yô} dô {yô}","sai đi từng đôi một"],["{sèng ƀà} dô rhiăng, {sèng ƀà} pram jơt","nhóm thì 100, nhóm thì 50"]],"c":"Lặp lại cụm số lượng để chỉ sự phân bố đều đặn theo từng cặp hoặc từng hàng/nhóm."},{"t":"Cách nói Giờ giấc trong ngày ([Số] + jơ + drim / mho)","f":"[Số đếm] + jơ + drim (sáng) / mho (chiều) / mang (đêm)","ex":[["Pơgap di pe jơ mơ prau jơ drim, Kơnràñ lòt hơđang nha đàlềng...","Khoảng giữa 3 giờ và 6 giờ sáng"]],"c":"jơ = giờ; drim = buổi sáng sớm (pe jơ drim = 3 giờ sáng; prau jơ drim = 6 giờ sáng)."},{"t":"Giới từ Thời gian \"Cho đến khi\" (jơl tus di tŭ)","f":"[Mệnh đề chính] + {jơl} tus di tŭ + [Mệnh đề thời gian]","ex":[["kừ ơm tềng hơ̆ {jơl} tus di tŭ ñă lòt.","cứ ở nguyên tại đó cho đến lúc ra đi"]],"c":"{jơl} tus di tŭ = cho đến tận khi / mãi đến lúc."},{"t":"Khung câu \"Ai [làm gì] thì đều [kết quả] hết\" (Cau lơi [V1] gen [V2] jơh)","f":"Cau lơi + [Động từ 1] + {gen} + [Động từ 2] + {jơh}","ex":[["Cau lơi ƀur {gen} geh bòi {jơh}.","Ai chạm đến thì đều được lành hết thảy"]],"c":"Cấu trúc ngắn gọn để diễn đạt kết quả xảy ra với 100% những người thực hiện hành động."},{"t":"Lời trấn an \"Hãy vững lòng, Ta đây!\" (Kơ̆ tĕ nùs, Añ do!)","f":"{Kơ̆ tĕ} nùs, {Añ do}; {bañ} rngòt!","ex":[["Hãy vững lòng, Ta đây!","Kơ̆ tĕ nùs, Añ do!"],["Kơnràñ đơs mo mơ bol khai lah: ‘Kơ̆ tĕ nùs, Añ do; bañ rngòt.’","Hãy vững lòng, Ta đây; đừng sợ"]],"c":"{kơ̆} (vững) + {tĕ} (hãy) + nùs (lòng) = Hãy vững lòng / Hãy yên tâm!"}],"dl":[{"t":"Trở về thăm quê hương và hỏi thăm nghề nghiệp","turns":[["A","Ơ K'Ha, mê mới rê wơl thăm ƀòn tòm mê dê ơ? Bèp mơ oh klau mê dê gam làm nghề ñchi?","Ơi K'Ha, bạn mới trở về thăm quê hương của bạn à? Cha và các em trai của bạn đang làm nghề gì?"],["B","Bèp mơ oh añ la cau chài lơh chi. Nhờ gơs bơta jak chài mơ chăm chỉ, bol khai đóng bàn ghế mơ hìu gỗ niam ngan!","Cha và em tôi là thợ mộc. Nhờ có sự khéo léo khôn ngoan và chăm chỉ, họ đóng bàn ghế và nhà gỗ đẹp lắm!"],["A","Làng bol tòm ƀòn tòm mê dê ai cũng ki ngàm gia đình mê dê!","Dân làng ở quê hương bạn ai cũng quý trọng gia đình của bạn!"]],"note":"Để diễn tả khái niệm \"quê hương / buôn làng gốc\" nơi một người sinh ra và lớn lên, tiếng K'Ho dùng cụm danh từ ƀòn tòm [Chủ sở hữu] dê (ƀòn = buôn làng, tòm = gốc/cội nguồn – Câu 1, 4). Người thợ chuyên làm một nghề khéo tay được gọi là cau chài + [Nghề]: cau chài lơh chi = người thợ làm gỗ / thợ mộc (Câu 3)."},{"t":"Chuẩn bị hành trang đi công tác thôn buôn & Nghỉ ngơi","turns":[["A","Drim do bol he lòt dô yô dô yô tus các ƀòn xa. Mê neh rcang kơldung, gơltau jơng mơ blah ào ấm rơĭ?","Sáng nay chúng ta đi từng đôi một đến các buôn xa. Bạn đã chuẩn bị túi đeo, giày dép và chiếc áo ấm chưa?"],["B","Añ neh rcang đầy đủ mơ cèng thêm dô nơm gai jra nàng leo dờr mơnơm.","Tôi đã chuẩn bị đầy đủ và mang thêm một cây gậy để leo sườn đồi."],["A","Sau khi lòt gùng xa, trồ trưa bol he rơp ghé vào hìu người quen nàng rlô bòl dô êt nhă!","Sau khi đi đường xa, buổi trưa chúng ta sẽ ghé vào nhà người quen để nghỉ mệt một chút nhé!"]],"note":"Khi dặn dò ai chuẩn bị hành trang lên đường, Mác 6:8–11 cung cấp hàng loạt động từ thực tế: cèng (mang theo), jă (mang giày/dép vào chân), soh (mặc áo), bài wă rò (đón tiếp nồng hậu), rtuh thul (phủi bụi), và rlô bòl (nghỉ ngơi cho lại sức – Câu 31)."},{"t":"Mời bạn bè dự bữa cơm mừng sinh nhật","turns":[["A","Chiều thứ Bảy tuần này la ngai deh kòn দềt añ dê. Añ mơ bau ùr añ dê yò bơta ñô sa mho mơ jà mê tus dự nhă!","Chiều thứ Bảy tuần này là ngày sinh nhật của con nhỏ tôi. Tôi và vợ tôi mở bữa tiệc tối và mời bạn đến dự nhé!"],["B","Ưnngài vợ chồng mê! Chắc chắn añ rơp tus nàng chúc mừng ngai deh cháu mơ vui chơi bal mơ ală cau nac ñô sa!","Cảm ơn vợ chồng bạn! Chắc chắn tôi sẽ đến để chúc mừng sinh nhật cháu và chung vui cùng các khách dự tiệc!"]],"note":"Trong tiếng K'Ho, từ gốc bau vừa là động từ (cưới / kết hôn với ai: bau mơ [Người] – Câu 17, 18), vừa ghép với ùr (nữ) hoặc klau (nam) để tạo danh từ chỉ vợ (bau ùr – Câu 17) và chồng (bau klau)."},{"t":"Mua thức ăn và chia sẻ bữa trưa trên đồi cỏ xanh","turns":[["A","Trồ neh trưa rau, bol mê gơs cèng nđồ nơm piang lă mơ ka taih?","Trời đã trưa rồi, các bạn có mang theo bao nhiêu ổ bánh mì và cá vậy?"],["B","Bol hi chỉ gơs pram (5) nơm piang lă mơ bàr (2) nơm ka, ò cần lòt rwat thêm đâu!","Chúng tôi có 5 ổ bánh mì và 2 con cá, không cần đi mua thêm đâu!"],["A","Behơ̆ gen bol he nggui tĕ hơđang ñhơt tơlir do, ưnngài Yàng rồi dơrkă piang lă nàng tòmpà mỗi người một phần. Jơh tơr nă rơp sa hòm lơm!","Vậy thì chúng ta hãy ngồi trên thảm cỏ xanh này, tạ ơn Chúa rồi bẻ bánh để chia cho mỗi người một phần. Tất cả mọi người sẽ ăn no nê cả!"]],"note":"Phép lạ hóa bánh cho 5.000 người ăn (Câu 34–44) cung cấp đầy đủ các động từ xoay quanh một bữa ăn cộng đồng của người K'Ho: rwat phan sa (mua thức ăn), rơndap nggui jat sèng (sắp xếp ngồi theo từng nhóm), pò mat hơ trồ mơ ưnngài (ngước mắt lên trời và cảm tạ), dơrkă (bẻ bánh), tòmpà (chia phần cho mọi người), sa hòm lơm (ăn no nê cả), và dồñ... tơngkah (thu gom phần còn dư)."},{"t":"Trấn an người thân trong đêm tối & Đi chợ sáng","turns":[["A (Gõ cửa trong đêm mưa)","Ơ mè, mở măng hìu añ in!","Ơi mẹ, mở cửa nhà cho con!"],["B (Trong nhà)","Ñcau đứng ngoài măng hìu tòm mang tối behơ̆ taih? Añ rngòt ngan!","Ai đứng ngoài cửa trong đêm tối như vậy? Tôi sợ lắm!"],["A","Kơ̆ tĕ nùs, añ do; bañ rngòt! Añ la kòn klau mè dê, mới đi rwat phan sa mơ sơnơm bơh drà rê wơl!","Hãy vững lòng (yên tâm), con đây; đừng sợ! Con là con trai của mẹ đây, mới đi mua thức ăn và thuốc từ ngoài chợ trở về!"]],"note":"Khi tiễn hoặc từ biệt một đoàn người để đi công việc khác, tiếng K'Ho dùng động từ tơngac (từ giã / cho giải tán ra về – Câu 46). Khi neo thuyền vào bờ, dùng cụm dơh ơhò di gah (Câu 53)."}],"ds":[["Ơ mè, mở măng hìu añ in!","Ơi mẹ, mở cửa nhà cho con!"],["Ñcau đứng ngoài măng hìu tòm mang tối behơ̆ taih? Añ rngòt ngan!","Ai đứng ngoài cửa trong đêm tối như vậy? Tôi sợ lắm!"]],"vr":[["Đề","Đức Chúa Jêsus tại thành Na-xa-rét","Yàng Jesu tòm Nasaret"],["1","Đức Chúa Jêsus đi khỏi đó, trở về quê-hương mình, có môn-đồ theo Ngài.","Yàng Jesu ñă lòt bơh tềng hơ̆ mơ rê hơ ƀòn tòm Kơnràñ dê; gơs ală cau bơtê lòt jat bal sơl."],["2","Đến ngày Sa-bát, Ngài khởi sự giảng-dạy trong nhà hội; nhiều người nghe thì lấy làm lạ, nói rằng: Bởi đâu người nầy được những điều đó? Sự khôn- ngoan đã ban cho người thể ấy là gì, đến nỗi các phép lạ như vậy bởi tay người làm ra?","Tus di ngai Saƀat, Kơnràñ rơp sơntòm bơto sồr tòm hìu jum cau Juda. Oă cau gơs mat tềng hơ̆ , kơno Kơnràñ bơto gen ai lơh crih crài mơ đơs lah: “Mbơh cau do geh ală bơta do taih? Bơta jak chài mơ khai dòp geh hơ̆ la ñchi, mơ mbe lơi tê khai lơh gơs ală broă gơnap gơnoar behơ̆ taih?"],["3","Có phải người nầy là thợ mộc, con trai Ma-ri, anh em với Gia-cơ, Giô-sép, Giu-đe và Si-môn chăng? Chị em người há chẳng phải ở giữa chúng ta đây ư? Chúng bèn vấp-phạm vì cớ Ngài.","Cau do ò di la cau chài lơh chi, kòn klau Mari dê, oh mi mơ Jakơ, Jôsep, Jude mơ Simôn dê ò ơ? Ò di ală oh ùr khai dê ơm digùl bol he ò ơ?” Gen bol khai ò dòp Kơnràñ."],["4","Nhưng Đức Chúa Jêsus phán cùng họ rằng: Đấng tiên-tri chỉ bị khinh-dể tại quê-hương mình, trong bà-con mình và trong nhà mình mà thôi.","Mơ Yàng Jesu đơs mơ bol khai lah: “Cau gơnoar hwơr geh cau ki ngàm tòm ală tiah ndai, mơya mìng tòm ƀòn tòm khai, gơp bơtiàn khai, mơ tòm hìu nhă sền òsơp di khai.”"],["5","Ngài không làm phép lạ gì tại đó được, chỉ đặt tay trên một vài kẻ bịnh và chữa lành họ.","Tềng hơ̆ Kơnràñ ò rgơi lơh broă gơnap gơnoar lơi ò, mìng ơn tê sơmbòi bàr pe nă cau kòp jê."],["6","Ngài lấy làm lạ vì họ chẳng tin. Đoạn, Đức Chúa Jêsus đi khắp các làng chung-quanh mà dạy-dỗ.","Kơnràñ ai lơh krơi bơh bơta ò dòn bol khai dê. Lồc behơ̆ Kơnràñ lòt làm jơh ală ƀòn gùt dar mơ bơto sồr."],["Đề","Mười hai sứ-đồ được sai đi","Jơt bàr nă cau bơtê geh sồr lòt"],["7","Đức Chúa Jêsus gọi mười hai sứ-đồ đến, khởi-sự sai đi từng đôi một, và ban cho quyền-phép trị tà- ma.","Gen Yàng Jesu hòi jơt bàr nă cau bơtê tus, sơntòm sồr lòt dô yô dô yô, ai bol khai in gơs gơnoar hơđang ală cà."],["8","Ngài truyền cho sứ-đồ khi đi đường đừng đem gì theo, trừ ra một cây gậy; đừng đem bánh, bao, hoặc tiền trong lưng;","Kơnràñ sồr bol khai tòm tŭ lòt gùng bañ cèng phan lơi, piang lă hala kơldung hala jền priă tòm che but, cèng mìng dô nơm gai jra lơm,"],["9","nhưng hãy mang dép vào chân, và đừng mặc hai áo.","jă mìng gơltau jơng, bañ soh bàr blah ào."],["10","Ngài lại phán rằng: Hễ các ngươi vào nhà nào, hãy ở đó cho đến khi đi khỏi chỗ ấy.","Kơnràñ kung đơs lah: “Hìu lơi bol mê rơp mut gen kừ ơm tềng hơ̆ jơl tus di tŭ ñă lòt."],["11","Nếu có nơi nào không tiếp-rước và không nghe các ngươi, thì khi đi khỏi đó, hãy phủi bụi dưới chân mình, để làm chứng đối cùng họ.","Tiah lơi cau ò bài wă rò bol mê mơ ò bài iat jơnau bol mê đơs, tòm tŭ lik bơh hơ̆ , gen rtuh tĕ thul bơh di jơng bol mê dê nàng lơh cơng tơrwơl di bol khai.”"],["12","Vậy, môn-đồ đi ra, giảng-dạy rằng người ta phải ăn-năn.","Behơ̆ ală cau bơtê lik lòt bơto yal lah, jơh tơr nă pal gơjrañ sang glài."],["13","Môn-đồ cũng đuổi nhiều quỉ, và lấy dầu xức cho nhiều kẻ bịnh mà chữa họ được lành.","Bol khai bơtrơh oă cà, bong mơñă oă cau kòp jê in mơ sơmbòi bol khai in geh bòi."],["Đề","Giăng Báp-tít chết","Jang Baptis chơt"],["14","Vua Hê-rốt nghe nói về Đức Chúa Jêsus, — vì danh Ngài đã đồn ra, — thì nói rằng: Ấy là Giăng Báp-tít từ kẻ chết sống lại; nên bởi người mới làm được các phép lạ.","Mơ tai, bơtau Herôt kơno đơs bơh Yàng Jesu, tài bơh sơnđan Kơnràñ neh tương pơnro làm jơh. Gơs cau đơs lah: “Jang Baptis neh kis wơl bơh bơta chơt, gen tàng khai rgơi lơh ală broă gơnap gơnoar hơ̆ .”"],["15","Kẻ khác nói rằng: Ấy là Ê-li. Kẻ khác nữa lại nói rằng: Ấy là một đấng tiên-tri, như một đấng trong các tiên-tri.","Cau ƀà đơs lah: “Hơ̆ la Eli;” cau ƀà tai đơs lah: “Hơ̆ la cau gơnoar hwơr kung be dô nă tòm ală cau gơnoar hwơr rài yau.”"],["16","Nhưng Hê-rốt nghe, thì nói rằng: Giăng mà ta đã chém đầu, chính người đã sống lại!","Mơya dơ̆ Herôt kơno behơ̆ gen đơs lah: “Hơ̆ la Jang cau mơ añ neh sồr koh bồ, khai neh kis wơl.”"],["17","Vì chính Hê-rốt đã sai bắt Giăng và xiềng lại trong ngục, bởi cớ Hê-rô-đi-át là vợ của Phi-líp, anh mình, mà người đã cưới lấy.","Bơh să tòm Herôt neh sồr cau kup cap Jang krơ̆ tòm hìu jàm, tài bơh Herôdias la bau ùr Philip, oh Herôt dê, mơ Herôt neh bau mơ khai."],["18","Bởi chưng Giăng có nói với Hê-rốt rằng: Vua không phép lấy vợ anh mình.","Bơh Jang neh ràc Herôt lah: “Bơtau ò geh gơnoar bau mơ bau ùr oh bơtau dê.”"],["19","Nên Hê-rô-đi-át giận Giăng, muốn giết đi; nhưng không làm được,","Herôdias gơjrañ di Jang, kòñ tơnchơt khai, mơya ò rgơi,"],["20","vì Hê-rốt sợ Giăng, biết người là công-bình và thánh, thì bảo-hộ người; vua nghe người nói, bội- phần bối-rối, nhưng cũng bằng lòng nghe.","bơh Herôt rngòt di Jang, mơ git khai la dô nă cau song ring mơ sàng goh, gen bơtau sền gàr khai. Herôt kòñ iat Jang đơs, mơya dơ̆ kơno jơnau khai dê rau, gen bơtau ò suk ơm ngan."],["21","Song gặp dịp tiện, là ngày sinh-nhựt Hê-rốt, vua bày tiệc đãi các quan lớn trong triều, các đầu-mục và các bậc tôn-trọng xứ Ga-li-lê.","Di tŭ lơmpeh gơtìp di ngai pơjum sa kah ngai deh Herôt dê, khai yò bơta ñô sa mho jà ală cau kwang dờng, ală cau at ƀồ ling, bal mơ ală cau dờng màng tòm Galile."],["22","Con gái của Hê-rô-đi-át bước vào múa, làm đẹp lòng Hê-rốt và khách đồng-bàn. Vua bèn phán cùng gái trẻ ấy rằng: Ngươi muốn chi, hãy xin ta, ta sẽ cho.","Să tòm kòn ùr Herôdias dê mut tòmya, lơh Herôt bal mơ ală cau ơm ñô sa in niam nùs. Cau bơtau đơs mơ kòn ùr hơ̆ lah: “Dan tĕ mơ añ bơta lơi ai kòñ gen añ rơp ai.”"],["23","Vua lại thề cùng nó rằng: Hễ điều chi ngươi xin ta, dầu đến phân nửa nước ta, ta cũng sẽ cho!","Bơtau Herôt srat să ho mơ khai lah: “Phan lơi ai dan gen añ kung rơp ai lơm, bulah dan nggùl lơgar añ jê añ kung ai sơl.”"],["24","Nó bèn đi ra hỏi mẹ rằng: Con nên xin vật gì? Mẹ nó biểu rằng: Xin cái đầu của Giăng Báp-tít.","Khai lik bơh hơ̆ , lùp mè lah: “Ñchi kòn kòñ dan taih?” Mè ho lah: “Bồ Jang Baptis dê.”"],["25","Nó liền vội-vàng trở vào trước mặt vua, và xin như vầy: Tôi muốn vua truyền lấy cái đầu của Giăng Báp-tít để trên mâm, và cho tôi bây giờ.","Tŭ hơ̆ mo khai sơrbac sơrbang mut wơl mơ cau bơtau mơ dan lah: “Tŭ do añ kòñ bơtau ai mo añ in bồ Jang Baptis ơn tòm sơlào.”"],["26","Vua buồn lắm; nhưng vì lời mình đã thề, và vì các người ngồi đồng-bàn, nên không muốn từ-chối.","Cau bơtau moat jrùng ngan, mơya tài bơh ală jơnau srat să khai dê mơ tài bơh di đap ală cau nac ñô sa, gen ò rgơi ò ai khai in."],["27","Tức thì vua sai một tên lính thị-vệ, truyền đem đầu Giăng đến. Lính đi, chém đầu Giăng ở trong ngục,","Bơtau sồr dô nă cau ling kơp gàr lòt, mơ cèng brê bồ Jang dê. Cau hơ̆ lòt koh bồ Jang tòm hìu jàm,"],["28","đem để trên mâm, trao cho gái trẻ ấy; nó bèn đem cho mẹ.","ơn bồ tòm sơlào, cèng ai kòn ùr in, mơ kòn ùr cèng ai mè khai in."],["29","Môn-đồ người nghe tin ấy, bèn đến lấy xác người mà đem chôn trong mồ.","Tòm tŭ cau bơtê Jang dê kơno jơnau hơ̆ gen lòt tus ai ƀồc mơ tơp tòm bơtô."],["Đề","Đức Chúa Jêsus làm phép lạ hóa bánh lần thứ nhất","Yàng Jesu lơh piang lă gơlik gơs oă dơ̆ sơnròp"],["30","Các sứ-đồ nhóm lại bên Đức Chúa Jêsus, thuật lại cho Ngài mọi điều mình đã làm và mọi lời mình đã giảng-dạy.","Ală cau gơnoar bơto dờng rê wơl mơ pơjum gùt dar Yàng Jesu, mơ yal Kơnràñ in jơh ală bơta bol khai neh lơh mơ bơto."],["31","Bởi vì người đi kẻ lại đông lắm, đến nỗi Ngài và môn-đồ không có giờ ăn, nên Ngài phán cùng môn-đồ rằng: Chính các ngươi hãy ra riêng nơi vắng-vẻ, và nghỉ một chút.","Bơh gơs cau lòt rê oă ngan tian gơs Yàng Jesu mơ ală cau bơtê ò gơs tŭ nàng sào. Gen Kơnràñ đơs mơ bol khai lah: “Lik lòt tĕ pleh tòm tiah ngềt ngơt nàng rlô bòl dô êt.”"],["32","Vậy, thầy trò xuống thuyền đi riêng ra nơi vắng- vẻ.","Behơ̆ Kơnràñ mơ ală cau bơtê mut tòm ơhò nàng lòt pleh tòm tiah ngềt ngơt."],["33","Có nhiều người thấy đi, và biết Ngài; bèn từ các thành chạy bộ tới trước tại nơi Ngài đi đó.","Mơya gơs oă cau gŏ bol khai lòt gen git đal, mơ ntoat lòt jơng bơh di jơh ală ƀòn dờng tus lài di tiah Yàng Jesu mơ cau bơtê rơp lòt."],["34","Đức Chúa Jêsus ra khỏi thuyền, thấy một đoàn dân đông, thì động lòng thương-xót, vì họ như chiên không có kẻ chăn; Ngài bèn khởi sự dạy-dỗ họ nhiều điều.","Tŭ Yàng Jesu lik bơh ơhò, gŏ mpồl làng bol oă gen nđàc sơngit di bol khai, bơh bol khai gơlơh be belàt ò gơs cau ê. Gen Kơnràñ sơntòm bơto sồr bol khai oă bơta."],["35","Trời đã chiều rồi, môn-đồ đến gần Ngài mà thưa rằng: Nơi đây vắng-vẻ, và tối rồi;","Trồ neh mho, ală cau bơtê lòt tus hơ Kơnràñ mơ đơs lah: “Tiah do ngềt ngơt mơ trồ neh mho rau."],["36","xin thầy cho dân-chúng về, đặng họ đi vào các thôn-trang và các làng xung-quanh mà mua đồ ăn.","Dan ai mpồl làng bol in lòt tòm ală ƀòn dềt mơ tòm ală ƀòn gùt dar do nàng rwat phan sa.”"],["37","Nhưng Ngài đáp rằng: Chính các ngươi hãy cho họ ăn. Môn-đồ thưa rằng: Chúng tôi sẽ đi mua hai trăm đơ-ni-ê bánh mà cho họ ăn sao?","Yàng Jesu ho lah: “Să tòm bol mê ai tĕ bol khai in sa.” Cau bơtê đơs lah: “Bol hi rơp lòt rwat piang lă tus di bàr rhiăng dơnie ai bol khai in sa ơ?”"],["38","Ngài hỏi môn-đồ rằng: Các ngươi có mấy cái bánh? Hãy đi xem. Khi đã xem rồi, thì thưa rằng: Có năm cái bánh và hai con cá.","Yàng Jesu lùp bol khai lah: “Bol mê gơs nđồ nơm piang lă taih? Lòt tĕ sền.” Dơ̆ cau bơtê neh sền rau, gen ho lah: “Pram nơm piang lă mơ bàr nơm ka.”"],["39","Ngài bèn truyền cho môn-đồ biểu dân-sự ngồi từng bọn trên cỏ xanh.","Gen Kơnràñ sồr cau bơtê rơndap làng bol nggui jat sèng hơđang ñhơt tơlir."],["40","Họ bèn ngồi từng hàng, hàng thì một trăm người, hàng thì năm chục người.","Ală cau hơ̆ nggui mơ sèng, sèng ƀà dô rhiăng, sèng ƀà pram jơt."],["41","Ngài lấy năm cái bánh và hai con cá, ngước mắt lên trời mà tạ ơn; đoạn, bẻ bánh ra, trao cho môn- đồ đặng phát cho dân-sự. Ngài cũng chia hai con cá cho mọi người.","Gen Yàng Jesu ai pram nơm piang lă mơ bàr nơm ka hơ̆ , pò mat hơ trồ mơ ưnngài Yàng Tom Trồ, gen dơrkă piang lă tong ală cau bơtê in, nàng tòmpà mpồl làng bol in, mơ tai, kung tòmpà bàr nơm ka jơh ală bol khai in sơl."],["42","Ai nấy đều ăn và được no.","Jơh tơr nă sa hòm lơm."],["43","Người ta lượm những miếng bánh và cá thừa được đầy mười hai giỏ.","Cau dồñ bềng jơt bàr bài ală pet piang lă mơ ka tơngkah."],["44","Vả, số người ăn bánh là năm ngàn người nam.","Ntum khà cau klau sa piang lă hơ̆ pơgap pram rbồ nă."],["Đề","Đức Chúa Jêsus đi bộ trên mặt biển","Yàng Jesu lòt hơđang nha đàlềng"],["45","Liền đó, Đức Chúa Jêsus giục môn-đồ xuống thuyền qua trước bờ bên kia, về phía thành Bết- sai-đa, đang khi Ngài cho dân-chúng tan về.","Tŭ hơ̆ mo Yàng Jesu chồl ală cau bơtê mut tòm ơhò, tiă lài đah bơtĭ ne đàlềng tus hơ Betsaida tòm tŭ Kơnràñ ai mpồl làng bol in rê."],["46","Khi Ngài đã từ-giã dân-chúng rồi, thì lên trên núi đặng cầu-nguyện.","Dơ̆ Kơnràñ neh tơngac làng bol rau gen guh hơđang mơnơm nàng hòi dan."],["47","Đến chiều tối, chiếc thuyền ở giữa biển, còn một mình Ngài ở trên đất.","Tus di mang, ơhò neh tus digùl đàlềng, ai Yàng Jesu gen ơm is dô nă hơđang ù."],["48","Ngài thấy môn-đồ nhọc-nhằn vì chèo chống, bởi gió thổi ngược; lối canh tư đêm, Ngài đi bộ trên mặt biển mà đến cùng môn-đồ, và định đi qua trước họ.","Kơnràñ gŏ cau bơtê wàs bòl glar ngan, tài bơh càl khồm sơlơ̆ u. Pơgap di pe jơ mơ prau jơ drim, Kơnràñ lòt hơđang nha đàlềng mơ tus hơ bol khai, mơ kòñ lòt sơrlèt lài sơl."],["49","Nhưng khi môn-đồ thấy Ngài đi bộ trên mặt biển, thì tưởng là ma, bèn la lên;","Dơ̆ ală cau bơtê gŏ Kơnràñ lòt hơđang nha đàlềng gen tồnlah dô nơm cà mu, gen driau dờng,"],["50","vì ai nấy đều thấy Ngài và sợ-hãi. Nhưng Ngài liền phán cùng họ rằng: Hãy yên lòng; ấy là ta đây, đừng sợ!","bơh jơh tơr nă rngòt rngơt tòm tŭ gŏ Kơnràñ. Kơnràñ đơs mo mơ bol khai lah: “Kơ̆ tĕ nùs, Añ do; bañ rngòt.”"],["51","Ngài bèn bước lên thuyền với môn-đồ, thì gió yên-lặng; môn-đồ càng lấy làm lạ lắm.","Chòp Kơnràñ mut tòm ơhò bal mơ bol khai, gen càl thit ngềt. Bol khai sơlo ai lơh crih crài oă ngan,"],["52","Vì chưng môn-đồ chưa hiểu việc bánh ra thể nào, bởi lòng họ còn cứng-cỏi.","bơh ò git wă loh làng bơta krơi bơh ală piang lă, ai pram rbồ nă cau sa, tài bơh nùs bol khai gam kră kơldang."],["Đề","Chữa lành người bịnh tại xứ Ghê-nê-sa-rét","Yàng sơmbòi cau kòp jê tòm Genesaret"],["53","Khi qua biển rồi, đến đất Ghê-nê-sa-rét và đậu thuyền nơi bờ.","Tŭ neh tiă đàlềng rau, gen bol khai tus tòm ù tiah Genesaret mơ dơh ơhò di gah."],["54","Vừa bước ra khỏi thuyền, người ta liền nhìn biết Ngài,","Dơ̆ bol khai lik bơh ơhò, làng bol đal git Yàng Jesu mo,"],["55","và chạy khắp cả miền xung-quanh, đem những kẻ bịnh nằm trên giường đến mọi nơi họ nghe có Ngài ở.","behơ̆ bol khai ntoat làm gùt dar kơnhwàl hơ̆ , tùng ală cau kòp bic hơđang cơnòng cèng tus hơ tiah lơi bol khai kơno Kơnràñ ơm."],["56","Hễ Ngài vào làng nào, ấp nào, thành nào, người ta cũng để kẻ bịnh ở ngoài chợ, xin Ngài cho họ chỉ rờ đến tua áo Ngài mà thôi; và phàm ai rờ đến thì đều được lành.","Tiah lơi Yàng Jesu lòt tòm ală ƀòn, ƀòn dờng hala ƀòn dềt, gen cau cèng cau kòp jê ơn tòm ală drà, mơ rac dan mơ Kơnràñ ai khai in mìng ƀur di tiang ào Kơnràñ lơm. Cau lơi ƀur gen geh bòi jơh."]],"cult":{"t":"Hệ Thống Loại Từ & Tiền Tố Tương Hỗ Trong Mác 6","lead":"Cách chọn đúng loại từ đứng sau số đếm và dùng tiền tố tương hỗ trong sinh hoạt cộng đồng:","pts":[["Hệ thống Loại từ (Classifiers) đi kèm số đếm",["nă (chỉ người) → prăm rbô nă (5.000 người – Câu 44)","nơm (chỉ con vật, vật khối tròn, thuyền, gậy) → prăm nơm piang lă (5 ổ bánh), bàr nơm ka (2 con cá), dô nơm gai jra (1 cây gậy)","blah (chuyên dùng cho quần áo, tấm vải, tấm chăn) → bàr blah ào (hai chiếc áo – Câu 9)"]],["Tiền tố tương hỗ tòm- trong hành động chia sẻ bữa ăn (Câu 41)",["pà (chia phần) → tòmpà (phân phát, chia đều cho mọi người cùng hưởng: nàng tòmpà mpồl làng bol in)"]]]},"prac":[{"dir":"vk","q":"Các bạn có bao nhiêu ổ bánh? Hãy đi xem! – Chúng tôi có năm ổ bánh và hai con cá.","a":"Bol mê gơs nđồ nơm piang lă taih? Lòt tĕ sền! – Bol hi gơs pram nơm piang lă mơ bàr nơm ka.","exp":"Nguyên văn Mác 6:38: câu hỏi số lượng nđồ nơm ... taih? (bao nhiêu cái?); pram = 5; bàr = 2."},{"dir":"vk","q":"Chính các bạn hãy cho họ ăn đi! Hết thảy mọi người đều ăn no nê cả.","a":"Să tòm bol mê ai tĕ bol khai in sa! Jơh tơr nă sa hòm lơm.","exp":"Kết hợp Mác 6:37 (Să tòm bol mê = chính các bạn) và Mác 6:42 (sa hòm lơm = ăn no nê cả)."},{"dir":"vk","q":"Hãy vững lòng, tôi đây; đừng sợ! Chúng ta hãy ra nơi yên tĩnh để nghỉ ngơi một chút.","a":"Kơ̆ tĕ nùs, añ do; bañ rngòt! Bol he lik lòt tĕ pleh tòm tiah ngềt ngơt nàng rlô bòl dô êt.","exp":"Kết hợp Mác 6:50 (Kơ̆ tĕ nùs, añ do; bañ rngòt!) và Mác 6:31 (rlô bòl dô êt = nghỉ mệt một chút)."},{"dir":"vk","q":"Khi đi đường, đừng mang theo túi đeo hay hai chiếc áo, chỉ mang dép vào chân và cầm một cây gậy mà thôi.","a":"Tòm tŭ lòt gùng, bañ cèng kơldung hala soh bàr blah ào, jă mìng gơltau jơng mơ cèng dô nơm gai jra lơm.","exp":"Dựa trên Mác 6:8–9: kơldung = túi đeo; bàr blah ào = 2 chiếc áo; gơltau jơng = dép; gai jra = cây gậy."},{"dir":"kv","q":"Gen Yàng Jesu ai pram nơm piang lă mơ bàr nơm ka hơ̆ , pò mat hơ trồ mơ ưnngài Yàng Tom Trồ, gen dơrkă piang lă... nàng tòmpà mpồl làng bol in.","a":"Bấy giờ Chúa Giê-su cầm lấy năm ổ bánh và hai con cá đó, ngước mắt lên trời và tạ ơn Đức Chúa Trời, rồi bẻ bánh ra... để phân phát cho đoàn dân.","exp":"pò mat hơ trồ = ngước mắt lên trời; ưnngài = tạ ơn; dơrkă = bẻ ra; tòmpà = chia đều/phân phát."},{"dir":"kv","q":"Tiah lơi Yàng Jesu lòt tòm ală ƀòn, ƀòn dờng hala ƀòn dềt, gen cau cèng cau kòp jê ơn tòm ală drà... Cau lơi ƀur gen geh bòi jơh.","a":"Bất cứ nơi nào Chúa Giê-su đi đến trong các buôn làng, thành phố hay thôn ấp, người ta đều đem những người đau ốm đặt ở ngoài chợ... Ai chạm đến thì đều được lành hết thảy.","exp":"drà = chợ; cau lơi ƀur gen geh bòi jơh = ai chạm đến đều được lành hết."}]},{"n":7,"t":"Vệ Sinh, Đạo Hiếu, Nội Tâm Đạo Đức & Giao Tiếp","words":[["rào","Rửa, tắm rửa (rào tê nền = rửa tay kỹ lưỡng)","Rửa, tắm rửa","Động từ","dilah ò {rào} tê nền gen ò sa","nếu không rửa tay kỹ lưỡng thì không ăn"],["mơngàn","Chén, bát (mơngàn); bình/chậu đất (gri); bình đồng (gri kòng)","Chén, bát","Danh từ","be rào mơngàn mơ gri mơ {gri kòng}","như rửa chén bát, bình đất và bình đồng"],["jơnau òs yau","Truyền thống, phong tục xưa (jơnau òs yau); các bậc tổ tiên/người xưa (ală cau yau)","Truyền thống, phong tục xưa","Cụm danh từ","kơrmap gàr {jơnau òs yau} ală cau yau dê","giữ lời truyền khẩu của người xưa"],["kơrmap gàr","Tuân giữ, gìn giữ cẩn thận","Tuân giữ, gìn giữ cẩn thận","Cụm động từ","nàng {prap gàr} jơnau òs yau bol mê dê","để giữ gìn truyền thống của các ngươi"],["sang lòi","Bỏ qua, gạt bỏ, vứt bỏ","Bỏ qua, gạt bỏ","Cụm động từ","",""],["dòn duh","Hiếu kính, tôn kính (dòn duh); cha mẹ (mè bèp)","Hiếu kính, tôn kính","Động / Danh từ","{Dòn duh} tĕ mè bèp mê!","Hãy hiếu kính cha mẹ ngươi!"],["dong kòl","Giúp đỡ, phụng dưỡng, hỗ trợ","Giúp đỡ, phụng dưỡng","Cụm động từ","{dong kòl} bơta lơi mè bèp khai in","giúp đỡ điều gì cho cha mẹ mình"],["wàc sơpah","Rủa sả, mắng nhiếc, nói lời hỗn xược","Rủa sả, mắng nhiếc","Cụm động từ","",""],["cau ma blac","Người giả hình, kẻ đạo đức giả","Người giả hình, kẻ đạo đức giả","Cụm danh từ","",""],["bơr sơndồi","Môi miệng (bơr = miệng, sơndồi = môi)","Môi miệng","Cụm danh từ","",""],["ò kwơ","Vô ích, không có giá trị, luống công","Vô ích, không có giá trị","Cụm tính từ","Bơta bol khai duh khoai Añ la {ò kwơ}","Sự họ thờ phượng Ta là vô ích"],["tòm dơlam","Ở bên trong (tòm dơlam); ở phía bên ngoài (đah bơdih)","Ở bên trong, ở phía bên ngoài","Cụm giới/danh từ","",""],["kơndul","Cái bụng, dạ dày (kơndul); làm cho ô uế, dơ bẩn (lơh bơbơi)","Cái bụng, dạ dày","Danh / Động từ","",""],["kơlôi iơh","Ý nghĩ xấu, tà niệm (kơlôi iơh); trộm cắp (ntung kơñau)","Ý nghĩ xấu, tà niệm","Cụm danh/ động từ","",""],["rềs àr","Tà dâm (rềs àr); ngoại tình (bơrnàn); phóng đãng, buông thả (bung jang)","Tà dâm, ngoại tình","Danh / Động từ","",""],["hàm hà","Tham lam (hàm hà); hung ác, độc ác (rhung rhang); gian dối, lừa lọc (lac lèo)","Tham lam, hung ác","Danh / Tính từ","",""],["gar mat iơh","Con mắt ganh tị, đố kỵ (gar mat iơh); kiêu ngạo, tự cao (pơnhừ să)","Con mắt ganh tị, đố kỵ","Cụm danh/ động từ","",""],["so","Con chó, cún con","Con chó, cún con","Danh từ","",""],["phan pìng","Mảnh vụn thức ăn rơi xuống (
