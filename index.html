<style>
:root{--bg:#f5f7f9;--ink:#2b363c;--mut:#687780;--card:#ffffff;--line:#e2e8ec;--pri:#58cc02;--prid:#46a302;--blue:#1cb0f6;--blued:#1899d6;--red:#ff4b4b;--redd:#ea2b2b;--org:#ff9600;--yel:#ffc800;--pur:#ce82ff;--teal:#00cd9c;--on:#10300a;--okbg:#d7ffb8;--okt:#2f6f00;--badbg:#ffdfe0;--badt:#c0262b;--maxw:680px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:768px){:root{--maxw:880px}}
@media (min-width:1024px){:root{--maxw:960px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--ink:#e8eef0;--mut:#9aaab0;--card:#1c2b32;--line:#2f4048;--okbg:#1f3a12;--okt:#9be65a;--badbg:#45201f;--badt:#ff9b9b}}
:root[data-theme="dark"]{--bg:#131f24;--ink:#e8eef0;--mut:#9aaab0;--card:#1c2b32;--line:#2f4048;--okbg:#1f3a12;--okt:#9be65a;--badbg:#45201f;--badt:#ff9b9b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro","Noto Sans",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#app{max-width:var(--maxw);margin:0 auto;min-height:100%;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:2px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.app-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top b{font-weight:800;font-size:clamp(.95rem,2.6vw,1.18rem);color:var(--pri);letter-spacing:.2px}
.top b span{font-weight:700;font-size:.88em;color:var(--ink)}
.badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--pri) 16%,var(--card));color:var(--pri);border:1px solid color-mix(in srgb,var(--pri) 40%,transparent)}
.stat{font-weight:800;display:flex;align-items:center;gap:8px;font-size:.9rem;flex-shrink:0}
.ibtn{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:5px 9px;font-size:.9rem;font-weight:700;min-height:36px}
.gl{height:6px;background:var(--line);border-radius:3px;margin:0 14px;overflow:hidden}.gl i{display:block;height:100%;background:var(--yel);transition:width .3s}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.nav>div{display:flex;width:100%;max-width:var(--maxw)}.nav button{flex:1;border:0;background:transparent;padding:9px 4px 7px;font-size:.75rem;font-weight:700;color:var(--mut);transition:color .15s;min-height:56px}.nav button span{display:block;font-size:1.35rem;line-height:1.2}.nav button[aria-selected=true]{color:var(--blue)}
.pad{padding:14px 16px}
.unit{border-radius:16px;padding:14px 16px;color:#fff;margin:16px 0 8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.unit small{opacity:.92;font-weight:700;letter-spacing:.5px;display:block}.unit h3{margin:2px 0 0;font-size:clamp(1rem,2.4vw,1.12rem);line-height:1.3}

 nữa"],["lòt tĕ {sơnio să} mê","hãy đi trình diện bản thân ngươi"],["sa {srah nting} mơ dà kròt brê","ăn châu chấu và mật ong rừng"],["tòm {sră} cau gơnoar hwơr Esai","trong sách tiên tri Ê-sai"],["ơm {srồt} bơtơng tòm ơhò","đang vá lưới trong thuyền"],["Lòt ngăi dô êt {tai}","Đi xa thêm một chút nữa"],["bơto sồr {tềng hơ̆}","dạy dỗ tại đó"],["Bol he lòt tĕ hơ {tiah} ndai","Chúng ta hãy đi đến nơi khác"],["Tơngai neh {tơl}","Kỳ hạn đã trọn"],["pơjum trềng {tơngah} măng hìu","nhóm lại ngay trước cửa nhà"],["Kơnràñ gŏ ală tap {trồ} pò tơlik","Ngài thấy các tầng trời mở ra"],["Ñchi jơnau behơ̆ taih? Ñchi tàng jơh làng ƀòn pơjum tơngah măng hìu Simôn dê?","Chuyện gì vậy? Tại sao cả buôn làng đều tụ họp trước cửa nhà của Si-môn?"],["Mê la kòn kòñ gơboh añ jê, niam nùs añ tòm jơh ală broă.","Con là người con yêu dấu của Ta, đẹp lòng Ta trong mọi công việc."],["Jat tĕ añ, añ rơp ra ba bol mê lòt tus hơ hìu jum bol hi dê.","Hãy đi theo tôi, tôi sẽ dẫn các bạn đến nhà hội của chúng tôi."],["Dilah mê kòñ, gen bol he lòt rò tĕ gah đàlềng nàng jòi ală cau kup ka.","Nếu bạn muốn, chúng ta hãy đi dọc bờ biển để tìm những người đánh cá."],["Rìng àng ngai tơnơ̆ , trồ gam jơngo, Kơnràñ guh, lik lòt tòm tiah ngềt ngơt mơ hòi dan tềng hơ̆ .","Sáng sớm ngày hôm sau, khi trời còn tối, Ngài thức dậy, bước ra đi vào nơi vắng vẻ và cầu nguyện tại đó."],["Chòp Kơnràñ tus rềp, at di tê khai mơ yò tơngguh; phòt bòi kòp prơm, gen mò sơntòm duh broă bol khai in.","Liền đó Ngài đến gần, cầm lấy tay bà và đỡ dậy; cơn sốt rét liền dứt khỏi, và bà bắt đầu phục vụ (hầu hạ) họ."]],"rs":[["Jơnau Niam Yàng Tom Trồ {dê}","Tin Lành của Đức Chúa Trời"],["Kòn kòñ gơboh Añ jê","Con yêu dấu của Ta"],["Añ lơh ƀaptem bol mê {in}","Ta làm báp-têm cho các ngươi"],["wàs gùng lài mê {in}","dọn đường trước cho ngươi"],["{Bol he} lòt tĕ hơ tiah ndai","Chúng ta hãy đi nơi khác"],["{Bol hi} mơ Kơnràñ gơs ñchi jơnau taih?","Chúng tôi với Ngài có chuyện gì?"],["Tơngai {neh} tơl","Kỳ đã trọn"],["trồ {gam} jơngo","trời đang/còn tối"],["Jat {tĕ} Añ!","Hãy theo Ta!"],["Goh {tĕ}!","Hãy sạch đi!"],["{Ñchi} jơnau behơ̆ {taih}?","Chuyện gì vậy?"],["Bơta bơto sồr pa {ơ}?","Sự dạy dỗ mới sao?"],["{Dilah} Kơnràñ kòñ, {gen} rgơi lơh añ in gơs goh.","Nếu Chúa muốn, thì có thể làm cho tôi được sạch"],["{tài bơh} broă hơ̆ {tàng} Añ neh lòt tus.","vì việc đó nên Ta đã đến"],["{nàng} lơh cơng bol khai in","để làm chứng cho họ"],["bơta bơto sồr","sự dạy dỗ"],["dờng {rlau} mơ añ","lớn hơn ta"],["tŭ Jang {gơkòl} ơm jàm","khi Giăng bị ở tù"]],"rules":[{"t":"Trật tự câu cơ bản (SVO) & Hệ từ la","f":"Chủ ngữ + Động từ + Tân ngữ Chủ ngữ + {la} + Danh/Tính từ","ex":[["Yàng Jesu {lòt tus} hơ Galile.","Chúa Giê-su đi đến xứ Ga-li-lê. (Câu 14)"],["Mê {la} Kòn kòñ gơboh Añ jê.","Con là Con yêu dấu của Ta. (Câu 11)"]],"c":"Tương đồng 100% với tiếng Việt: {la} chính là \"là\", mơ là \"và/với\"."},{"t":"Sở hữu cách với tiểu từ dê / jê đặt cuối cụm","f":"[Vật sở hữu] + [Chủ sở hữu] + {dê} (hoặc jê với ngôi thứ 1 thân mật)","ex":[["Jơnau Niam Yàng Tom Trồ {dê}","Tin Lành của Đức Chúa Trời"],["Kòn kòñ gơboh Añ jê","Con yêu dấu của Ta"]],"c":"Ngược vị trí từ \"của\": Tiếng Việt nói \"nhà của bạn\", tiếng K'Ho nói \"hìu mê {dê}\" (nhà + bạn + của)."},{"t":"Tặng cách (cho ai) với tiểu từ in đặt sau người nhận","f":"Động từ + [Người nhận] + {in} hoặc [Vật] + [Người nhận] + {in}","ex":[["Añ lơh ƀaptem bol mê {in}","Ta làm báp-têm cho các ngươi"],["wàs gùng lài mê {in}","dọn đường trước cho ngươi"]],"c":"Ngược vị trí từ \"cho\": Tiếng Việt nói \"cho các bạn\", tiếng K'Ho nói \"bol mê {in}\" (các bạn + cho)."},{"t":"Phân biệt \"Chúng ta\" (bol he) & \"Chúng tôi\" (bol hi)","f":"Bao gộp người nghe: {bol he} Loại trừ người nghe: {bol hi}","ex":[["{Bol he} lòt tĕ hơ tiah ndai","Chúng ta hãy đi nơi khác"],["{Bol hi} mơ Kơnràñ gơs ñchi jơnau taih?","Chúng tôi với Ngài có chuyện gì?"]],"c":"Khi rủ người đối diện cùng làm, dùng {bol he}; khi chỉ nói về nhóm mình (trừ người nghe), dùng {bol hi}."},{"t":"Hệ thống Thời – Thể (neh, gam / ơm, rơp) & Phủ định (ò)","f":"{neh} + V (đã) {gam} / ơm + V (đang) {rơp} + V (sẽ) {ò} + V (không)","ex":[["Tơngai {neh} tơl","Kỳ đã trọn"],["trồ {gam} jơngo","trời đang/còn tối"]],"c":"Đặt ngay trước động từ giống hệt tiếng Việt (đã, đang, sẽ, không)."},{"t":"Mệnh lệnh – Cầu khiến với tĕ & Cấm đoán bañ","f":"Khẳng định: Động từ + {tĕ}! Phủ định: {bañ} + Động từ!","ex":[["Jat {tĕ} Añ!","Hãy theo Ta!"],["Goh {tĕ}!","Hãy sạch đi!"]],"c":"Tiểu từ cầu khiến {tĕ} luôn đứng ngay sau động từ chính; từ cấm đoán {bañ} đứng trước động từ."},{"t":"Câu hỏi có từ nghi vấn (taih?) & Câu hỏi Có/Không (ơ?)","f":"Hỏi thông tin: ... {ñchi} / {ñcau} ... {taih}? Hỏi xác nhận: [Mệnh đề] + {ơ}?","ex":[["{Ñchi} jơnau behơ̆ {taih}?","Chuyện gì vậy?"],["Bơta bơto sồr pa {ơ}?","Sự dạy dỗ mới sao?"]],"c":"{ñchi} = cái gì, {ñcau} = ai; {taih}? ở cuối câu hỏi = vậy/nhỉ?; {ơ}? ở cuối câu = sao/à/phải không?"},{"t":"Câu điều kiện \"Nếu... thì...\" (Dilah ... gen ...)","f":"{Dilah} + [Mệnh đề ĐK], {gen} + [Mệnh đề KQ]","ex":[["{Dilah} Kơnràñ kòñ, {gen} rgơi lơh añ in gơs goh.","Nếu Chúa muốn, thì có thể làm cho tôi được sạch"]],"c":"{Dilah} = nếu; {gen} = thì/bèn. Cấu trúc khớp hoàn toàn với câu điều kiện tiếng Việt."},{"t":"Nguyên nhân – Kết quả (tài bơh ... tàng) & Mục đích (nàng)","f":"{tài bơh} [Lý {do}] {tàng} [KQ] {nàng} + [Mệnh đề mục đích] (để)","ex":[["{tài bơh} broă hơ̆ {tàng} Añ neh lòt tus.","vì việc đó nên Ta đã đến"],["{nàng} lơh cơng bol khai in","để làm chứng cho họ"]],"c":"{bơh} / {tài bơh} = bởi vì; {tàng} = cho nên; tian gơs = đến nỗi (Câu 27, 45); {nàng} = để."},{"t":"Tiền tố danh từ hóa bơta, So sánh rlau & Bị động gơkòl","f":"bơta + V/Adj = Sự/Việc Adj + {rlau} (mơ) = Hơn {gơkòl} / {kong} + Tác nhân = Bị/Chịu","ex":[["bơta bơto sồr","sự dạy dỗ"],["dờng {rlau} mơ añ","lớn hơn ta"],["tŭ Jang {gơkòl} ơm jàm","khi Giăng bị ở tù"]],"c":"bơta biến động/tính từ thành danh từ trừu tượng; {gơkòl} và {kong} diễn tả thể bị động."}],"dl":[{"t":"Tìm bạn & Mời cùng đi tới các buôn làng","turns":[["A","Ơ Simôn, añ mơ ală cau ơm bal gam jòi mê! Mê gŏ thầy bơto bol he dê ơm tòm lơi ò?","Ơi Si-môn, tôi và các bạn đồng hành đang tìm bạn! Bạn có thấy thầy dạy của chúng ta ở đâu không?"],["B","Añ neh bàn khai rau! Khai gam ơm bal mơ bèp mơ oh añ dê. Jat tĕ añ!","Tôi đã tìm gặp thầy rồi! Thầy đang ở cùng với cha và em của tôi. Hãy đi theo tôi!"],["C (Thầy)","Tŭ do, bol he lòt tĕ hơ ală ƀòn gùt dar do nàng bơto ală cau bơtê!","Bây giờ, chúng ta hãy đi đến các buôn làng xung quanh đây để dạy các học trò!"]],"note":"Hệ thống đại từ tiếng K'Ho tạo số nhiều bằng cách đặt từ chỉ tập hợp bol trước đại từ gốc (bol he = chúng ta, bol hi = chúng tôi, bol mê = các bạn, bol khai = họ). Khi gọi trực tiếp một người, đặt thán từ Ơ ở đầu câu (\"Ơ Jesu...\" – Câu 24). Khi nối các thành viên cùng đi với nhau, dùng cụm bal mơ (cùng với – Câu 20, 29, 36)."},{"t":"Hỏi đường & Mời khách vào nhà","turns":[["A","Ơ K'Brêu, rìng àng do mê lòt tus hơ lơi taih?","Ơi K'Brêu, sáng sớm nay bạn đi đến đâu vậy?"],["B","Añ lòt rò gùng do nàng tus hơ hiòng Đạ Đờn. Mơya hìu jum ƀòn mê dê ơm rềp hala ngăi?","Tôi đi dọc con đường này để đến sông Đạ Đờn. Nhưng nhà hội buôn làng của bạn ở gần hay xa?"],["A","Rềp ngan! Mê lòt ngăi dô êt tai gen gŏ hìu jum. Tŭ do, mut mo tĕ tòm hìu añ dê!","Gần lắm! Bạn đi xa thêm một chút nữa thì thấy nhà hội. Bây giờ, hãy bước vào trong nhà của tôi chơi đi!"]],"note":"Tiếng K'Ho sử dụng các cụm động từ chỉ hướng di chuyển rất mạch lạc: lòt tus (đi + đến), mut mo (bước vào + trong), lik lòt (bước ra + đi), lòt rò gah (đi + dọc theo bờ). Các mốc thời gian trong ngày trong Mác 1 gồm: rìng àng (sáng sớm tinh mơ – Câu 35), ngai (ban ngày), trồ mho tòn mat ngai neh mù (chiều tối khi mặt trời đã lặn – Câu 32)."},{"t":"Hỏi thăm công việc lao động","turns":[["A","Bèp mơ oh mê dê gam lơh broă ñchi tòm hiòng hơ̆ taih?","Cha và em của bạn đang làm công việc gì ở dưới sông kia vậy?"],["B","Bol khai la cau kup ka. Bèp añ gam dang bơtơng, mơ oh añ gam srồt bơtơng tòm ơhò.","Họ là người đánh cá. Cha tôi đang thả lưới, còn em tôi đang vá lưới trong thuyền."],["A","Mơ mê? Mê soh ào dờng mơ lòt tus tòm brê nàng lơh ñchi?","Còn bạn? Bạn mặc áo dày và đi vào rừng để làm gì?"],["B","Añ lòt wàs gùng mơ jòi dà kròt brê nàng cèng rê hìu.","Tôi đi phát dọn đường và tìm mật ong rừng để mang về nhà."]],"note":"Để diễn tả ai đó đang miệt mài làm một công việc tại một địa điểm, tiếng K'Ho dùng cấu trúc ơm + [Động từ hành động] + tòm + [Địa điểm]: \"ơm dang bơtơng tòm đàlềng\" (đang thả lưới dưới biển – Câu 16), \"ơm srồt bơtơng tòm ơhò\" (đang vá lưới trong thuyền – Câu 19)."},{"t":"Thăm hỏi & Chăm sóc người ốm trong gia đình","turns":[["A","Po me mê dê gam ơm tòm hìu ơ? Mò gơs pràn niam ò?","Mẹ vợ của bạn đang ở trong nhà à? Bà có khỏe mạnh không?"],["B","Bơh mho òr, mò ơm bic tòm hìu tài bơh kòp prơm. Bol hi gam lòt jòi thầy sơnơm nàng sơmbòi mò in.","Từ chiều hôm qua, bà nằm trên giường vì bị sốt rét. Chúng tôi đang đi tìm thầy thuốc để chữa lành cho bà."],["A (Đến bên giường thăm)","Añ at di tê mò mơ yò tơngguh mò nhă. Dan Yàng ai mò in phòt bòi kòp prơm!","Tôi cầm tay bà và đỡ bà dậy nhé. Cầu chúc Chúa ban cho bà mau dứt hẳn cơn sốt rét!"]],"note":"Trong tiếng K'Ho, từ gốc chỉ sự đau ốm là kòp (hoặc kòp jê = đau yếu, bệnh tật). Khi bệnh thuyên giảm và dứt hẳn, dùng cụm phòt bòi (dứt khỏi bệnh – Câu 31) hoặc roh thit mơ gơs goh (biến mất và trở nên sạch/lành – Câu 42); hành động cứu chữa của người chăm sóc là sơmbòi (chữa lành – Câu 34)."},{"t":"Học chữ, đọc sách & trao đổi bài học","turns":[["A","Mê gam cih ñchi tòm sră mê dê taih?","Bạn đang viết cái gì trong cuốn sách/vở của bạn vậy?"],["B","Añ gam cih ală jơnau pa thầy neh bơto sồr bol he in. Mê git jơnau do ò?","Tôi đang chép lại những từ mới mà thầy đã dạy cho chúng ta. Bạn có biết từ này không?"],["A","Añ chưa git. Bol he lùp bal mơ thầy bơto tĕ!","Tôi chưa biết. Chúng ta hãy cùng hỏi thầy giáo đi!"]],"note":"Mác chương 1 cung cấp trọn bộ động từ về hoạt động ngôn ngữ và học thuật: cih (viết/chép trong sách sră – Câu 2), đơs lah (nói rằng), bơto sồr (dạy dỗ), bơto yal (rao giảng/truyền đạt), yal (kể lại/thưa chuyện/xưng ra), lùp bal (hỏi nhau), và yal pơnro / tương pơnro (đồn ra khắp nơi)."},{"t":"Bày tỏ tấm lòng & Xin sự giúp đỡ","turns":[["A","Ơ kòn, añ rac dan mê tòm broă do. Dilah mê kòñ, gen mê rgơi lơh broă do añ in ò?","Này bạn/con, tôi cầu xin bạn trong việc này. Nếu bạn sẵn lòng, thì bạn có thể làm việc này giúp cho tôi không?"],["B","Añ kòñ! Añ niam nùs ngan nàng lơh broă do mê in. Bol he sơntòm lơh tŭ do tĕ!","Tôi sẵn lòng! Tôi rất vui lòng để làm việc này cho bạn. Chúng ta hãy bắt đầu làm ngay bây giờ đi!"]],"note":"Tiếng K'Ho diễn tả chiều sâu nội tâm rất tinh tế qua các cụm từ đi với nùs (lòng) và các động từ biểu cảm láy âm: niam nùs (vui lòng / hài lòng – Câu 11), rngoh rngac nđàc sơngit (động lòng thương xót – Câu 41), ai lơh crih crài (kinh ngạc / lấy làm lạ – Câu 22, 27), gơjrañ sang glài (ăn năn hối lỗi – Câu 4, 15)."}],"ds":[["Ơ K'Brêu, rìng àng do mê lòt tus hơ lơi taih?","Ơi K'Brêu, sáng sớm nay bạn đi đến đâu vậy?"],["Bèp mơ oh mê dê gam lơh broă ñchi tòm hiòng hơ̆ taih?","Cha và em của bạn đang làm công việc gì ở dưới sông kia vậy?"],["Mơ mê? Mê soh ào dờng mơ lòt tus tòm brê nàng lơh ñchi?","Còn bạn? Bạn mặc áo dày và đi vào rừng để làm gì?"],["Añ lòt wàs gùng mơ jòi dà kròt brê nàng cèng rê hìu.","Tôi đi phát dọn đường và tìm mật ong rừng để mang về nhà."],["Po me mê dê gam ơm tòm hìu ơ? Mò gơs pràn niam ò?","Mẹ vợ của bạn đang ở trong nhà à? Bà có khỏe mạnh không?"],["Mê gam cih ñchi tòm sră mê dê taih?","Bạn đang viết cái gì trong cuốn sách/vở của bạn vậy?"],["Añ chưa git. Bol he lùp bal mơ thầy bơto tĕ!","Tôi chưa biết. Chúng ta hãy cùng hỏi thầy giáo đi!"]],"vr":[["Đề","Chức-vụ của Giăng Báp-tít","Gơnoar broă Jang Baptis dê"],["1","Đầu Tin-lành của Đức Chúa Jêsus-Christ, là Con Đức Chúa Trời.","Bơta rơp sơntòm Jơnau Niam Yàng Jesu Krist dê, la Kòn Yàng Tom Trồ."],["2","Như đã chép trong sách tiên-tri Ê-sai rằng: Nầy, ta sai sứ ta đến trước mặt ngươi, Người sẽ dọn đường cho ngươi...","Be neh cih tòm sră cau gơnoar hwơr Esai lah: “Do, Añ sồr cau kong sồr Añ jê lòt tus di đap mê, La cau rơp wàs gùng lài mê in."],["3","Có tiếng kêu trong đồng vắng rằng: Hãy dọn đường Chúa, Ban bằng các nẻo Ngài;","Gơs jơnau cau hòi driau tòm ƀlàng bràs lah: Wàs tĕ gùng Yàng, Bơsong tĕ ală gùng dềt Kơnràñ in.”"],["4","Giăng đã tới, trong đồng vắng vừa làm vừa giảng phép báp-têm ăn-năn, cho được tha tội.","Jang neh tus, lơh ƀaptem tòm ƀlàng bràs mơ bơto yal bơta ƀaptem bơh bơta gơjrañ sang glài nàng geh tơn glài."],["5","Cả xứ Giu-đê và hết thảy dân-sự thành Giê-ru-sa- lem đều đến cùng người, xưng tội mình và chịu người làm phép báp-têm dưới sông Giô-đanh.","Làm lơgar Jude mơ jơh làng bol tòm Jerusalem lòt tus hơ khai, yal glài he, mơ khai lơh ƀaptem bol hơ̆ in tòm hiòng Jordan."],["6","Giăng mặc áo lông lạc-đà, buộc dây lưng da ngang hông; ăn những châu-chấu và mật ong rừng.","Jang soh ào sơnò làkđa, kơt che but mơ gơltau, sa srah nting mơ dà kròt brê."],["7","Người giảng-dạy rằng: Có Đấng quyền-phép hơn ta đến sau ta; ta không đáng cúi xuống mở dây giày Ngài.","Khai bơto yal lah: “Bơtau tus tơnơ̆ añ gơs gơnoar dờng rlau mơ añ. Añ ò pal kun hồ che gơltau jơng Kơnràñ dê."],["8","Ta làm phép báp-têm cho các ngươi bằng nước; nhưng Ngài sẽ làm phép báp-têm cho các ngươi bằng Đức Thánh-Linh.","Añ lơh ƀaptem bol mê in mơ dà, mơya Kơnràñ rơp lơh ƀaptem bol mê in mơ Yàng Hwềng Goh.”"],["Đề","Đức Chúa Jêsus chịu phép báp-têm và bị ma-quỉ cám-dỗ","Yàng Jesu gơs ƀaptem mơ kong cà ràk ơniai"],["9","Vả, trong những ngày đó, Đức Chúa Jêsus đến từ Na-xa-rét là thành xứ Ga-li-lê, và chịu Giăng làm phép báp-têm dưới sông Giô-đanh.","Mơ tai, tòm ală ngai hơ̆ Yàng Jesu tus bơh Nasaret lơgar Galile, mơ Jang lơh ƀaptem Kơnràñ in tòm hiòng Jordan."],["10","Vừa khi lên khỏi nước, Ngài thấy các tầng trời mở ra, và Đức Thánh-Linh ngự xuống trên mình Ngài như chim bồ-câu.","Dơ̆ pa guh bơh dà, Kơnràñ gŏ ală tap trồ pò tơlik, mơ Yàng Hwềng Goh mù hơđang Kơnràñ be dô nơm sềm ntòp."],["11","Lại có tiếng từ trên trời phán rằng: Ngươi là Con yêu-dấu của ta, đẹp lòng ta mọi đường.","Mơ gơs jơnau bơh đang trồ đơs lah: “Mê la Kòn kòñ gơboh Añ jê, niam nùs Añ tòm jơh ală bơta.”"],["12","Tức thì Đức Thánh-Linh giục Ngài đến nơi đồng vắng.","Tŭ hơ̆ mo, Yàng Hwềng chồl Kơnràñ lòt tus tòm ƀlàng ngềt ngơt."],["13","Ngài ở nơi đồng vắng chịu quỉ Sa-tan cám-dỗ bốn mươi ngày, ở chung với thú rừng, và có thiên-sứ hầu việc Ngài.","Kơnràñ ơm tòm ƀlàng ngềt ngơt pơh kơi mơr ngai, kong cà ràk ơniai, Kơnràñ ơm tòm ală kiă brê, mơ ală mưh su pơyơ̆ kơs Kơnràñ."],["Đề","Đức Chúa Jêsus khởi sự giảng đạo","Yàng Jesu bơsơntòm bơto bơta jơnau"],["14","Sau khi Giăng bị tù, Đức Chúa Jêsus đến xứ Ga-li- lê, giảng Tin-lành của Đức Chúa Trời,","Tơnơ̆ mơ tŭ Jang gơkòl ơm jàm, Yàng Jesu lòt tus hơ Galile, bơto yal Jơnau Niam Yàng Tom Trồ dê,"],["15","mà rằng: Kỳ đã trọn, nước Đức Chúa Trời đã đến gần; các ngươi hãy ăn-năn và tin đạo Tin-lành.","mơ đơs lah: “Tơngai neh tơl, lơgar Yàng Tom Trồ neh tus rềp, ală bol mê gơjrañ sang glài tĕ mơ dòn Jơnau Niam.”"],["16","Ngài đi dọc theo mé biển Ga-li-lê, thấy Si-môn với Anh-rê, em người, đương thả lưới dưới biển; vì hai người vốn làm nghề chài.","Kơnràñ lòt rò gah đàlềng Galile, gŏ Simôn mơ Andre, oh khai, ơm dang bơtơng tòm đàlềng, bơh bol khai la cau kup ka."],["17","Đức Chúa Jêsus bèn phán cùng họ rằng: Hãy theo ta, và ta sẽ khiến các ngươi trở nên tay đánh lưới người.","Yàng Jesu đơs mơ bol khai lah: “Jat tĕ Añ, Añ rơp lơh bol mê in gơlik gơs cau dang bơtơng cau.”"],["18","Tức thì hai người bỏ chài-lưới mà theo Ngài.","Tŭ hơ̆ mo bol khai lòi bơtơng mơ jat Kơnràñ."],["19","Đi một đỗi xa xa, Ngài thấy Gia-cơ, con Xê-bê-đê, với em là Giăng, đương vá lưới trong thuyền.","Lòt ngăi dô êt tai, Kơnràñ gŏ Jakơ kòn Sebede mơ oh khai la Jang, ơm srồt bơtơng tòm ơhò."],["20","Ngài liền kêu hai người; thì họ để Xê-bê-đê, cha mình, ở lại trong thuyền với mấy người làm thuê, mà theo Ngài.","Chòp Kơnràñ hòi bol khai, gen bol khai lòi bèp bol khai la Sebede ơm wơl tòm ơhò bal mơ ală cau lơh ơpah, mơ bol khai lòt jat Kơnràñ."],["Đề","Sự chữa người bị quỉ ám","Yàng Jesu sơmbòi cau gơkòl cà lơh"],["21","Kế đó, đi đến thành Ca-bê-na-um; nhằm ngày Sa- bát, tức thì Đức Chúa Jêsus vào nhà hội, khởi dạy- dỗ tại đó.","Yàng Jesu mơ ală cau bơtê lòt tus hơ Kapenaum; di ngai Saƀat, Kơnràñ mut mo tòm hìu jum mơ bơto sồr tềng hơ̆ ."],["22","Chúng đều cảm-động về sự dạy-dỗ của Ngài, vì Ngài dạy như có quyền-phép, chớ chẳng phải như các thầy thông-giáo đâu.","Bol khai ai lơh crih crài bơh bơta bơto sồr Kơnràñ dê, bơh Kơnràñ bơto bol khai dô bă gơs gơnoar, ò di be ală cau bơto bơta boh lam."],["23","Vả, cũng một lúc ấy, trong nhà hội có người bị tà- ma ám,","Kung tòm tŭ hơ̆ , tòm hìu jum gơs dô nă cau gơkòl cà lơh,"],["24","kêu lên rằng: Hỡi Jêsus, người Na-xa-rét, chúng tôi với Ngài có sự gì chẳng? Ngài đến để diệt chúng tôi sao? Tôi biết Ngài là ai: Là Đấng Thánh của Đức Chúa Trời.","hòi driau lah: “Ơ Jesu Cau Nasaret, bol hi mơ Kơnràñ gơs ñchi jơnau taih? Kơnràñ lòt tus nàng tơnroh bol hi ơ? Añ git Kơnràñ la ñcau, la Bơtau Sàng Goh Yàng Tom Trồ dê.”"],["25","Nhưng Đức Chúa Jêsus nghiêm-trách nó rằng: Hãy nín đi, ra khỏi người này!","Mơya Yàng Jesu lah pơrhơng gơ lah: “Ơm mŏ mŏ tĕ! Mơ lik bơh di cau do!”"],["26","Tà-ma bèn vật mạnh người ấy, cất tiếng kêu lớn, và ra khỏi người.","Chòp cà sơrglơm cau hơ̆ pràn ngan, ai jơnau hòi driau dờng mơ lik bơh di khai."],["27","Ai nấy đều lấy làm lạ, đến nỗi hỏi nhau rằng: Cái gì vậy? Sự dạy mới sao! Người này lấy quyền- phép sai khiến đến tà-ma, mà nó cũng phải vâng lời!","Cau lơi gŏ kung ai lơh crih crài ngan, tian gơs lùp bal lah: “Ñchi jơnau behơ̆ taih? Bơta bơto sồr pa ơ? Cau do ai gơnoar sồr ală cà mơ bol gơ kung dòn jơnau sồr!”"],["28","Danh-tiếng Đức Chúa Jêsus tức thì đồn ra khắp cả miền xung-quanh xứ Ga-li-lê.","Tŭ hơ̆ mo tương pơnro Yàng Jesu làm jơh gùt dar kơnhwàl Galile."],["Đề","Bà gia Phi-e-rơ","Yàng Jesu sơmbòi po me Pier"],["29","Vừa ở nhà hội ra, Chúa và môn-đồ đi với Gia-cơ cùng Giăng vào nhà Si-môn và Anh-rê.","Pa lik bơh hìu jum cau Juda, gen Yàng Jesu mơ ală cau bơtê lòt bal mơ Jakơ mơ Jang mut mo tòm hìu Simôn mơ Andre."],["30","Vả, bà gia Si-môn đương nằm trên giường, đau rét; tức thì chúng thưa với Ngài về chuyện người.","Mơ tai, po me Simôn ơm bic kòp prơm; tŭ hơ̆ mo cau yal mơ Kơnràñ bơh khai."],["31","Ngài bèn lại gần, cầm tay người đỡ dậy; bệnh rét đứt đi, và người bắt tay hầu-hạ.","Chòp Kơnràñ tus rềp, at di tê khai mơ yò tơngguh; phòt bòi kòp prơm, gen mò sơntòm duh broă bol khai in."],["Đề","Mấy thứ phép lạ","Yàng Jesu sơmbòi oă cau"],["32","Đến chiều, mặt trời đã lặn, người ta đem mọi kẻ bệnh và kẻ bị quỉ ám đến cùng Ngài.","Trồ mho tòn mat ngai neh mù, cau ra ba ală cau kòp jê mơ cau gơkòl cà tus di Kơnràñ."],["33","Cả thành nhóm lại trước cửa.","Jơh làng ƀòn dờng pơjum trềng tơngah măng hìu."],["34","Ngài chữa lành nhiều kẻ đau các thứ bệnh, và đuổi nhiều quỉ, chẳng cho phép các quỉ nói ra, vì chúng nó biết Ngài.","Kơnràñ sơmbòi oă cau kòp krời krời, mơ tơlờm oă cà, Kơnràñ ò ai ală cà đơs jơnau, bơh bol gơ git Kơnràñ."],["35","Sáng hôm sau, trời còn mờ-mờ, Ngài chỗi dậy, bước ra, đi vào nơi vắng-vẻ, và cầu-nguyện tại đó.","Rìng àng ngai tơnơ̆ , trồ gam jơngo, Kơnràñ guh, lik lòt tòm tiah ngềt ngơt mơ hòi dan tềng hơ̆ ."],["36","Si-môn cùng đồng-bạn đi tìm Ngài.","Simôn mơ ală cau ơm bal mơ khai lòt jòi Kơnràñ."],["37","Khi kiếm được thì thưa rằng: Hết thảy đương tìm thầy.","Dơ̆ neh bàn rau, gen bol khai đơs lah: “Jơh ală cau jòi Kơnràñ.”"],["38","Ngài phán: Chúng ta hãy đi nơi khác, trong những làng xung-quanh đây, để ta cũng giảng đạo ở đó nữa; vì ấy là cốt tại việc đó mà ta đã đến.","Kơnràñ đơs mơ bol khai lah: “Bol he lòt tĕ hơ tiah ndai tòm ală ƀòn gùt dar do, nàng Añ in kung bơto yal tềng hơ̆ sơl, tài bơh broă hơ̆ tàng Añ neh lòt tus.”"],["39","Ngài trải khắp xứ Ga-li-lê, giảng-dạy trong các nhà hội và đuổi quỉ.","Mơ Kơnràñ lòt làm jơh kơnhwàl Galile, bơto yal tòm ală hìu jum mơ bơtrơh cà."],["Đề","Sự chữa kẻ phung","Yàng Jesu sơmbòi cau dun"],["40","Có một người phung đến cùng Ngài, quì xuống cầu-xin rằng: Nếu Chúa khứng, có thể khiến tôi sạch được.","Gơs dô nă cau dun lòt tus hơ Yàng Jesu, cùn gơltang rac dan lah: “Dilah Kơnràñ kòñ, gen rgơi lơh añ in gơs goh.”"],["41","Đức Chúa Jêsus động lòng thương-xót, giơ tay rờ người, mà phán rằng: Ta khứng, hãy sạch đi.","Yàng Jesu rngoh rngac nđàc sơngit, ai tê ƀur di khai mơ đơs lah: “Añ kòñ, goh tĕ.”"],["42","Liền khi đó, phung lặn mất, người trở nên sạch.","Tŭ hơ̆ mo dun roh thit mơ khai gơs goh."],["43","Tức thì Đức Chúa Jêsus cho người ra, lấy giọng nghiêm phán rằng:","Yàng Jesu sồr khai lik lòt mo, mơ ai jơnau kràñ cê nting lah:"],["44","Hãy giữ, chớ tỏ điều đó cùng ai; song khá đi tỏ mình cùng thầy tế-lễ, và vì ngươi được sạch, hãy dâng của-lễ theo như Môi-se dạy, để điều đó làm chứng cho họ.","“Bañ yal jơnau hơ̆ mơ cau lơi, mơya lòt tĕ sơnio să mê mơ cau gơnoar ơn phan duh khoai; mơ bơh mê neh geh goh, gen ơn tĕ phan be Môise neh sồr nàng lơh cơng bol khai in.”"],["45","Nhưng người ấy đi, đồn việc đó ra, tới đâu cũng thuật chuyện, đến nỗi Đức Chúa Jêsus không vào thành cách rõ-ràng được nữa; song Ngài ở ngoài, tại nơi vắng-vẻ; và người ta từ bốn phương đều đến cùng Ngài.","Mơya cau hơ̆ lòt mơ yal pơnro broă hơ̆ làm jơh, tian gơs Yàng Jesu ò rgơi mut tòm ƀòn dờng dô bă loh làng tai; gen tàng Kơnràñ ơm đah bơdih tòm ală tiah ngềt ngơt, mơ cau bơh ală đah lòt tus hơ Kơnràñ."]],"cult":{"t":"Nghệ Thuật Ghép Từ (Word Compounding) Trong Tiếng K'Ho","lead":"Trong Mác 1, tiếng K'Ho tạo dựng các từ vựng đời sống bằng cách kết hợp những từ đơn quen thuộc theo tư duy hình ảnh trực quan. Hiểu quy luật này giúp người học nhớ từ vựng nhanh gấp 3 lần:","pts":[["Từ ghép chỉ người và nghề nghiệp với cau (người)",["cau (người) + kup (bắt/chụp) + ka (cá) → cau kup ka (người đánh cá / ngư dân – Câu 16)","cau (người) + bơtê (học) → cau bơtê (môn đồ / học trò – Câu 21, 29)","cau (người) + lơh (làm) + ơpah (tiền công) → cau lơh ơpah (người làm thuê – Câu 20)","cau (người) + kong sồr (được sai phái) → cau kong sồr (sứ giả – Câu 2)"]],["Từ ghép chỉ thiên nhiên & sản vật rừng",["mat (mắt/mặt) + ngai (ngày) → mat ngai (mặt trời – Câu 32: mat ngai neh mù = mặt trời đã lặn)","dà (nước/mật) + kròt (con ong) + brê (rừng) → dà kròt brê (mật ong rừng – Câu 6)","sơnò (lông) + làkđa (lạc đà) → ào sơnò làkđa (áo lông lạc đà – Câu 6)"]],["Từ ghép chỉ không gian & công trình",["hìu (nhà) + jum (tụ họp, gốc của pơjum) → hìu jum (nhà hội / nơi nhóm họp – Câu 21, 23, 29, 39)","măng (cửa) + hìu (nhà) → măng hìu (cửa nhà – Câu 33)","gùng (đường) + dềt (nhỏ) → gùng dềt (đường nhỏ / các nẻo đường – Câu 3)"]],["Từ ghép chỉ tâm trạng & cảm xúc với nùs (lòng / trái tim)",["niam (tốt/vui) + nùs (lòng) → niam nùs (vui lòng / đẹp lòng – Câu 11)","rngoh rngac nđàc sơngit → động lòng thương xót sâu sắc từ nội tâm (Câu 41)"]]]},"prac":[{"dir":"vk","q":"Hãy đi theo tôi, tôi sẽ dẫn các bạn đến nhà hội của chúng tôi.","a":"Jat tĕ añ, añ rơp ra ba bol mê lòt tus hơ hìu jum bol hi dê.","exp":"Mệnh lệnh Jat tĕ añ (Mác 1:17); tương lai rơp; \"của chúng tôi\" (không gồm người nghe) dùng bol hi dê đặt cuối cụm danh từ."},{"dir":"vk","q":"Nếu bạn muốn, chúng ta hãy đi dọc bờ biển để tìm những người đánh cá.","a":"Dilah mê kòñ, gen bol he lòt rò tĕ gah đàlềng nàng jòi ală cau kup ka.","exp":"Câu điều kiện Dilah... gen... (Mác 1:40); \"chúng ta\" (gộp cả hai người) dùng bol he (Mác 1:38); lòt rò gah đàlềng = đi dọc bờ biển (Mác 1:16). STT Bài Tập (Câu Cần Dịch) Đáp Án Chuẩn & Giải Thích Cấu Trúc (KPM2018)"},{"dir":"vk","q":"Chuyện gì vậy? Tại sao cả buôn làng đều tụ họp trước cửa nhà của Si-môn?","a":"Ñchi jơnau behơ̆ taih? Ñchi tàng jơh làng ƀòn pơjum tơngah măng hìu Simôn dê?","exp":"Câu hỏi cảm thán Ñchi jơnau behơ̆ taih? (Mác 1:27); pơjum tơngah măng hìu = tụ họp trước cửa nhà (Mác 1:33)."},{"dir":"kv","q":"Rìng àng ngai tơnơ̆ , trồ gam jơngo, Kơnràñ guh, lik lòt tòm tiah ngềt ngơt mơ hòi dan tềng hơ̆ .","a":"Sáng sớm ngày hôm sau, khi trời còn tối, Ngài thức dậy, bước ra đi vào nơi vắng vẻ và cầu nguyện tại đó.","exp":"rìng àng = sáng sớm; ngai tơnơ̆ = ngày hôm sau; gam jơngo = đang/còn tối; tềng hơ̆ = tại nơi đó."},{"dir":"kv","q":"Chòp Kơnràñ tus rềp, at di tê khai mơ yò tơngguh; phòt bòi kòp prơm, gen mò sơntòm duh broă bol khai in.","a":"Liền đó Ngài đến gần, cầm lấy tay bà và đỡ dậy; cơn sốt rét liền dứt khỏi, và bà bắt đầu phục vụ (hầu hạ) họ.","exp":"chòp = liền đó; tus rềp = đến gần; at di tê = cầm lấy tay; yò tơngguh = đỡ dậy; duh broă bol khai in = phục vụ cho họ."},{"dir":"vk","q":"Con là người con yêu dấu của Ta, đẹp lòng Ta trong mọi công việc.","a":"Mê la kòn kòñ gơboh añ jê, niam nùs añ tòm jơh ală broă.","exp":"Dựa trực tiếp trên cấu trúc câu 11 (\"Mê la Kòn kòñ gơboh Añ jê, niam nùs Añ tòm jơh ală bơta\"), thay bơta (mọi sự) bằng broă (công việc)."}]},{"n":2,"t":"Ngữ Pháp Phản Biện, Ẩm Thực, Nông Nghiệp & Giao Tiếp Đời Sống","words":[["rkàng hìu","Mái nhà (rkàng hìu); lỗ trống, khoảng mở trên mái (trồm)","Mái nhà, lỗ trống","Danh từ","",""],["bơr mpồng","Khung cửa, trước cửa ra vào (bơr mpồng); chỗ trống (ha sơn)","Khung cửa, trước cửa ra vào","Danh từ","di {bơr mpồng} kung ò tai ha sơn","ngay trước cửa cũng không còn chỗ trống"],["cơnòng","Giường nằm, chõng, chiếu nằm","Giường nằm, chõng","Danh từ","Ñă ntào tĕ, at {cơnòng} mơ rê hìu mê","Hãy đứng dậy, vác giường và về nhà ngươi"],["nggui","Ngồi (nggui); đứng dậy, chỗi dậy (ñă ntào)","Ngồi, đứng dậy","Động từ","",""],["tùng","Khiêng (nhiều người khiêng – tùng); cầm, vác (at); hạ/dòng xuống (tơmù)","Khiêng, cầm","Động từ","poan nă cau {tùng} dô nă cau gơlte","bốn người khiêng một người bại"],["rê wơl","Trở về, quay lại (rê wơl); về nhà (rê hìu); đi ngang qua (lòt gan)","Trở về, quay lại","Cụm động từ","",""],["gal ngan","Đông lắm, rất đông (gal ngan); quá nhiều, quá đông (oă ir)","Đông lắm, rất đông","Cụm tính từ","",""],["nggui sào","Ngồi ăn tiệc, dự bữa cỗ, đồng bàn","Ngồi ăn lau mơ) & \"Chỉ có... thôi\" (lòi mùng ... lơm)","f":"{Rlau mơ} + [Danh từ], {ñcau}...? ... lòi {mùng} + [Danh từ] + {lơm}","ex":[["Ngoài... ra","Rlau mơ"],["Chỉ có... thôi","lòi mùng ... lơm"],["Rlau mơ dô Bơtau la Yàng Tom Trồ, ñcau rgơi toh glài taih?","Ngoài Đức Chúa Trời ra, ai tha tội được?"],["lòi mùng ală cau gơnoar... lơm","Thế nào trong đời A-bia-tha làm thầy cả thượng- phẩm, vua ấy vào đền Đức Chúa Trời, ăn bánh bày ra, lại cũng cho những người đi theo ăn nữa, dầu bánh ấy chỉ những thầy tế-lễ mới được phép ăn thôi?"]],"c":"{Rlau mơ} ở đầu câu = ngoài... ra; lòi {mùng} ... {lơm} = trừ ra chỉ có ... mà thôi."},{"t":"Tương quan thời gian \"Bao lâu... thì bấy lâu\" (kàr lơi ... tus kàr hơ̆ )","f":"[Mệnh đề 1] + {kàr} lơi, {gen} [Mệnh đề 2] + tus {kàr} hơ̆","ex":[["Bao lâu... thì bấy lâu","kàr lơi ... tus kàr hơ̆"],["Cau bơtơu gam ơm mơ bol khai kàr lơi gen bol khai ò rgơi ơt sa jơl tus kàr hơ̆ .","Chàng rể còn ở với họ bao lâu thì họ không thể kiêng ăn bấy lâu"]],"c":"{kàr} lơi = bao lâu / đến chừng nào; tus {kàr} hơ̆ = cho đến chừng ấy."},{"t":"Thể Bị động tích cực \"Được\" (neh geh + V)","f":"[Chủ ngữ] + {neh geh} + [Động từ]","ex":[["Tồi glài mê {neh geh} toh.","Tội lỗi con đã được tha"]],"c":"Trong khi gơkòl (Bài 1) mang nghĩa \"bị\" (tiêu cực), thì {geh} + V mang nghĩa \"được\" (tích cực)."},{"t":"Đại từ tôn kính ngôi thứ 2 ồng (Ông / Thầy) & Đối chiếu ai (còn)","f":"cau bơtê {ồng dê} (môn đồ của Ông/Thầy) [Mệnh đề 1], ai [Mệnh đề 2]","ex":[["...ai cau bơtê ồng dê ò ơt sa taih?","...còn môn đồ của Thầy/Ông không kiêng ăn?"]],"c":"{ồng} là từ xưng hô lịch sự với người nam có uy tín (Ông / Thầy); liên từ ai ở đầu mệnh đề 2 nghĩa là \"còn / trái lại\"."}],"dl":[{"t":"Đón khách đến thăm nhà đông người","turns":[["A","Ơ K'Bròh, mê neh rê wơl hìu ơ? Ñchi bơh tài tơngah bơr mpồng hìu mê dê gơs cau pơjum gal ngan behơ̆ taih?","Ơi K'Bròh, bạn đã trở về nhà rồi à? Tại sao trước cửa nhà của bạn lại có người tụ họp đông lắm như vậy?"],["B","Tòm mho do, oh mi bơyô añ dê lòt tus thăm hìu. Mut mo tĕ mơ nggui tòm cơnòng do!","Chiều nay, anh em bạn bè của tôi đi đến thăm nhà. Hãy bước vào trong và ngồi trên chiếc giường/chõng này đi!"],["A","Ưnngài mê! Lòi añ dong mê at ală ghế gỗ do nàng oh mi bơyô gơs ha sơn nggui.","Cảm ơn bạn! Để tôi giúp bạn khiêng những chiếc ghế gỗ này để bạn bè có chỗ trống ngồi."]],"note":"Khi ra lệnh hoặc khích lệ ai đứng dậy thực hiện hành động, tiếng K'Ho dùng cụm động từ mở đầu Ñă ntào tĕ! (Hãy đứng dậy! – Câu 9, 11). Để diễn tả mức độ quá đông hoặc quá nhiều dẫn đến một hệ quả, dùng cấu trúc oă ir / gal ngan tian gơs... (đông quá đến nỗi... – Câu 2, 4)."},{"t":"Mời bạn ở lại ăn cơm khi đi đường xa","turns":[["A","Mê lòt gùng ngăi bơh drim tus tŭ do, mê gơs jơgloh ò?","Bạn đi đường xa từ sáng đến bây giờ, bạn có đói bụng không?"],["B","Añ jơgloh ngan, tài bơh bơh drim añ gam ơt sa mơ òhềt sa piang ò.","Tôi đói lắm, bởi vì từ sáng tôi vẫn nhịn ăn và chưa hề ăn cơm."],["A","Behơ̆ gen nggui tĕ tòm do! Bol he rơp ñô sa bal. Añ neh rcang piang, ka mơ dà mê in rau!","Vậy thì hãy ngồi xuống đây! Chúng ta sẽ cùng ăn uống với nhau. Tôi đã chuẩn bị cơm, cá và nước cho bạn rồi!"]],"note":"Để diễn tả việc cùng ăn uống với ai, tiếng K'Ho dùng cấu trúc ñô sa bal mơ [Người] hoặc nggui sào bal mơ [Người] (Câu 15, 16). Khi nói ai đó bị thiếu thốn thức ăn và đói bụng trên đường đi, dùng cụm gơtìp ò tơi phan sa mơ jơgloh (bị túng thiếu không đủ đồ ăn và đói bụng – Câu 25)."},{"t":"Mùa gặt trên cánh đồng & Sửa sang đồ đạc","turns":[["A","Mê gam lòt gan sre kòi gia đình mê dê ơ? Kòi tòm sre neh chín rơĭ?","Bạn đang đi ngang qua ruộng lúa của gia đình bạn à? Lúa ngoài đồng đã chín chưa?"],["B","Kòi neh niam ngan! Mơya bao đựng kòi añ dê neh yau mơ sèt rau.","Lúa đã tốt lắm! Nhưng bao đựng lúa của tôi đã cũ và bị rách rồi."],["A","Dilah bao neh yau, mê bañ jing tơmbồl tai; bol he ngui tĕ bao pa nàng kòi ò roh!","Nếu bao đã cũ, bạn đừng khâu vá tạm nữa; chúng ta hãy dùng bao mới để lúa không bị đổ mất!"]],"note":"Qua hai ẩn dụ nổi tiếng trong Câu 21–22 (vá vải mới vào áo cũ & đổ rượu mới vào bầu da cũ) và cảnh đi qua đồng lúa ở Câu 23, người học nắm được bộ động từ tác động vật lý rất thực tế: jing tơmbồl (khâu vá đắp vào), gơprơt sèt (co rút làm rách toạc), tròc (đổ/rót chất lỏng), bơcah (làm vỡ/nứt), và ròs (bứt/hái bông lúa)."},{"t":"Đưa người bệnh đến gặp bác sĩ tại trạm y tế","turns":[["A","Ñchi bơh tài bol mê tùng ồng do lòt tus hơ hìu sơnơm taih?","Tại sao các bạn khiêng ông này đi đến trạm y tế vậy?"],["B","Tài bơh jơng ồng dê gơlte, ồng ò rgơi ñă ntào mơ lòt. Bol hi càng gặp cau gơnoar sơnơm.","Bởi vì chân của ông ấy bị liệt/đau bại, ông không thể đứng dậy và đi được. Chúng tôi cần gặp bác sĩ."],["C (Bác sĩ)","Ra ba ồng mut mo tĕ mơ đặt ồng bic tòm cơnòng do! Añ rơp khám mơ ai sơnơm ồng in.","Hãy đưa ông ấy vào trong và đặt ông nằm trên giường này! Tôi sẽ khám và cho thuốc cho ông ấy."]],"note":"Câu 17 cung cấp một cấu trúc đối chiếu cực kỳ mẫu mực trong giao tiếp đời sống: \"Cau pràn kơldang ò càng cau gơnoar sơnơm ò, mơya la cau kòp jê\" (Người khỏe mạnh không cần thầy thuốc đâu, nhưng là người đau ốm). Động từ càng nghĩa là cần / cần đến; cụm danh từ cau gơnoar sơnơm ghép từ cau gơnoar (người có chuyên môn/thẩm quyền) + sơnơm (thuốc chữa bệnh) = thầy thuốc / bác sĩ."},{"t":"Cùng đọc sách & Thảo luận bài học","turns":[["A","Mê gam kơlôi is ñchi tòm nùs taih? Broă học jơnau K'Ho do la đươn hala khó?","Bạn đang suy nghĩ điều gì trong lòng vậy? Việc học tiếng K'Ho này là dễ hay khó?"],["B","Lài òr añ kơlôi gơ la khó, mơya tòm tŭ añ sền sră cih mơ bơyai bal mơ mê, añ gŏ gơ la đươn rlau oă!","Trước đây tôi nghĩ nó khó, nhưng khi tôi đọc sách và bàn luận cùng với bạn, tôi thấy nó dễ hơn nhiều!"]],"note":"Mác Chương 2 cung cấp các động từ chỉ hoạt động trí tuệ rất sắc bén: kơlôi is tòm nùs (nghĩ thầm / suy tính riêng trong lòng – Câu 6, 8), bơyai bal (bàn luận / tranh luận với nhau – Câu 8), sền sră cih (nhìn chữ viết trong sách = đọc sách – Câu 25), lùp (hỏi – Câu 18) và ho (đáp / trả lời – Câu 25)."}],"ds":[["Mê lòt gùng ngăi bơh drim tus tŭ do, mê gơs jơgloh ò?","Bạn đi đường xa từ sáng đến bây giờ, bạn có đói bụng không?"],["Ñchi bơh tài bol mê tùng ồng do lòt tus hơ hìu sơnơm taih?","Tại sao các bạn khiêng ông này đi đến trạm y tế vậy?"]],"vr":[["Đề","Người đau bại","Yàng Jesu sơmbòi cau gơlte"],["1","Khỏi một vài ngày, Đức Chúa Jêsus trở vào thành Ca-bê-na-um, và chúng nghe nói Ngài ở trong nhà.","Dô êt ngai tơnơ̆ , Yàng Jesu rê wơl hơ Kapenaum, mơ cau kơno yal lah Kơnràñ ơm tòm hìu."],["2","Họ họp lại tại đó đông lắm, đến nỗi trước cửa cũng không còn chỗ trống; Ngài giảng đạo cho họ nghe.","Bol khai pơjum tềng hơ̆ gal ngan tian gơs di bơr mpồng kung ò tai ha sơn. Kơnràñ bơto yal jơnau Yàng bol khai in."],["3","Bấy giờ có mấy kẻ đem tới cho Ngài một người đau bại, có bốn người khiêng.","Tŭ hơ̆ gơs poan nă cau tùng dô nă cau gơlte tus hơ Yàng Jesu."],["4","Nhưng, vì đông người, không lại gần Ngài được, nên dở mái nhà ngay chỗ Ngài ngồi, rồi do lỗ đó dòng giường người bại nằm xuống.","Tài bơh gơs cau oă ir, bol khai ò rgơi tus rềp mơ Kơnràñ, gen pò rkàng hìu tòm toh di tiah Yàng Jesu ơm, mơ tơmù cơnòng cau gơlte bic bơh di trồm hơ̆ ."],["5","Đức Chúa Jêsus thấy đức-tin họ, bèn phán cùng kẻ bại rằng: Hỡi con ta, tội-lỗi ngươi đã được tha.","Yàng Jesu gŏ bơta dòn bol khai dê gen đơs mơ cau gơlte lah: “Ơ kòn, tồi glài mê neh geh toh.”"],["6","Vả, có mấy thầy thông-giáo ngồi đó, nghĩ thầm rằng:","Gơs bàr pe nă cau bơto bơta boh lam nggui tềng hơ̆ , kơlôi is tòm nùs lah:"],["7","Sao người này nói như vậy? Người nói phạm- thượng đó! Ngoài một mình Đức Chúa Trời, còn có ai tha tội được chẳng?","“Ñchi bơh tài cau do đơs behơ̆ taih? Khai đơs tràl sơrbil ngan! Rlau mơ dô Bơtau la Yàng Tom Trồ, ñcau rgơi toh glài taih?”"],["8","Đức Chúa Jêsus trong trí đã hiểu họ tự nghĩ như vậy, tức thì phán rằng: Sao các ngươi bàn-luận trong lòng thế ấy?","Tòm hwềng nùs Yàng Jesu git bol khai bơyai bal behơ̆ , gen đơs mo lah: “Ñchi bơh tài bol mê kơlôi is tòm nùs behơ̆ taih?"],["9","Nay bảo kẻ bại rằng: Tội ngươi đã được tha; hay là bảo người rằng: Hãy đứng dậy vác giường mà đi; hai điều ấy điều nào dễ hơn?","Jat bol mê gen đơs mơ cau gơlte lah: ‘Tồi glài mê neh geh toh,’ hala đơs: ‘Ñă ntào tĕ, at cơnòng mê mơ lòt;’ jơnau lơi la đươn rlau taih?"],["10","Vả, để cho các ngươi biết Con người ở thế-gian có quyền tha tội, thì Ngài phán cùng kẻ bại rằng:","Mơya nàng bol mê in git lah Kòn Mơnus gơs gơnoar toh glài hơđang ù,” gen Kơnràñ đơs mơ cau gơlte lah:"],["11","Ta biểu ngươi, hãy đứng dậy, vác giường đi về nhà.","“Añ sồr mê, ñă ntào tĕ, at cơnòng mơ rê hìu mê.”"],["12","Kẻ bại đứng dậy, tức thì vác giường đi ra trước mặt thiên-hạ; đến nỗi ai nấy đều lấy làm lạ, ngợi- khen Đức Chúa Trời, mà rằng: Chúng tôi chưa hề thấy việc thể này.","Tŭ hơ̆ mo cau gơlte ñă ntào, at cơnòng mơ lik lòt tian gơs cau lơi kung ai lơh crih crài, jòng ro Yàng Tom Trồ mơ đơs lah: “Bol hi òhềt gŏ broă be do ò.”"],["Đề","Chúa gọi Lê-vi. – Sự kiêng ăn","Yàng Jesu hòi Lebi – Bơta ơt sa"],["13","Bấy giờ, Đức Chúa Jêsus lại trở về phía mé biển; cả dân-chúng đến cùng Ngài, rồi Ngài dạy-dỗ họ.","Tŭ hơ̆ Yàng Jesu rê wơl hơ gah đàlềng Galile, jơh mpồl làng bol lòt tus hơ Kơnràñ, mơ Kơnràñ bơto sồr bol khai."],["14","Ngài vừa đi qua thấy Lê-vi, con A-phê, đương ngồi tại sở thâu thuế, thì phán cùng người rằng: Hãy theo ta. Người đứng dậy theo Ngài.","Tòm tŭ lòt gan, Kơnràñ gŏ Lebi kòn Alphe nggui tòm tiah boh dia, gen đơs mơ khai lah: “Jat tĕ Añ.” Khai ñă ntào mơ jat Kơnràñ."],["15","Đức Chúa Jêsus đương ngồi ăn tại nhà Lê-vi, có nhiều người thâu thuế và kẻ có tội đồng bàn với Ngài và môn-đồ Ngài; vì trong bọn đó có nhiều kẻ theo Ngài rồi.","Mơ tai, tòm tŭ Yàng Jesu nggui sào tòm hìu Lebi, gơs oă cau dar dia mơ cau glài lòt jat Yàng Jesu mơ oă cau tòm bol khai nggui sào bal mơ Kơnràñ mơ cau jat Kơnràñ dê."],["16","Các thầy thông-giáo thuộc phe Pha-ri-si thấy Ngài ăn với bọn thâu thuế và kẻ phạm tội, thì nói với môn-đồ Ngài rằng: Người cùng ăn với kẻ thâu thuế và kẻ có tội sao!","Ală cau bơto bơta boh lam đah jơi cau Pharisi gŏ Kơnràñ sào bal mơ cau dar dia mơ cau glài, gen đơs mơ ală cau bơtê Kơnràñ dê lah: “Ñchi bơh tài khai ñô sa bal mơ cau dar dia mơ cau glài taih?”"],["17","Đức Chúa Jêsus nghe vậy, bèn phán cùng họ rằng: Chẳng phải kẻ mạnh-khỏe cần thầy thuốc đâu, nhưng là kẻ có bệnh; ta chẳng phải đến gọi người công-bình, nhưng gọi kẻ có tội.","Yàng Jesu kơno behơ̆ gen đơs mơ bol khai lah: “Cau pràn kơldang ò càng cau gơnoar sơnơm ò, mơya la cau kòp jê; Añ tus ò di nàng hòi cau song ring ò, mơya nàng hòi cau glài.”"],["Đề","Câu hỏi về sự kiêng ăn","Jơnau lùp bơh bơta ơt sa"],["18","Vả, môn-đồ của Giăng và người Pha-ri-si đều kiêng ăn. Có người đến thưa cùng Đức Chúa Jêsus rằng: Bởi cớ nào môn-đồ của Giăng và môn- đồ của người Pha-ri-si đều kiêng ăn, còn môn-đồ của thầy không kiêng ăn?","Mơ tai, cau bơtê Jang dê mơ cau Pharisi ơt sa. Gơs cau lòt tus lùp Yàng Jesu lah: “Ñchi bơh tài cau bơtê Jang dê mơ cau bơtê cau Pharisi dê ơt sa, ai cau bơtê ồng dê ò ơt sa taih?”"],["19","Đức Chúa Jêsus phán rằng: Bạn hữu của chàng rể có kiêng ăn được trong khi chàng rể còn ở cùng mình chẳng? Hễ chàng rể còn ở với họ đến chừng nào, thì họ không thể kiêng ăn được đến chừng nấy.","Yàng Jesu đơs lah: “Tòm tŭ cau bơtơu gam ơm mơ oh mi bơyô he, gen bol khai rgơi ơt sa sơl ơ? Cau bơtơu gam ơm mơ bol khai kàr lơi gen bol khai ò rgơi ơt sa jơl tus kàr hơ̆ ."],["20","Song tới kỳ chàng rể phải đem đi khỏi họ, trong ngày đó họ sẽ kiêng ăn.","Mơya tus di tŭ cau bơtơu pal lik bơh di bol khai, gen tòm ngai hơ̆ sồng bol khai rơp ơt sa."],["21","Không ai vá miếng nỉ mới vào cái áo cũ; nếu vậy thì miếng nỉ mới chằng rách áo cũ, mà đàng rách thành xấu thêm.","Ò gơs cau lơi ai bài pa mơ jing tơmbồl di ào yau; dilah lơh behơ̆ gen pet bài pa rơp lơh gơprơt sèt ào yau, mơ tiah sèt gơlik iơh rlau tai."],["22","Cũng không ai đổ rượu mới vào bầu da cũ; nếu vậy, rượu làm vỡ bầu, rượu mất và bầu cũng chẳng còn.","Kung ò gơs cau lơi tròc tơnòm pa tòm nhồng gơltau yau, dilah lơh behơ̆ gen tơnòm lơh bơcah nhồng, tơnòm roh mơ nhồng kung ò gam sơl; mơya cau tròc tơnòm pa tòm nhồng gơltau pa.”"],["Đề","Bứt bông lúa mì","Jơnau lùp bơh ngai Saƀat"],["23","Nhằm ngày Sa-bát, Đức Chúa Jêsus đi qua đồng lúa mì; đang đi đường, môn-đồ Ngài bứt bông lúa mì.","Di ngai Saƀat, Yàng Jesu lòt gan sre kòi mi; tòm tŭ lòt gùng, cau bơtê Kơnràñ ròs kòi mi."],["24","Các người Pha-ri-si bèn nói cùng Ngài rằng: Coi kìa, sao môn-đồ thầy làm điều không nên làm trong ngày Sa-bát?","Chòp ală cau Pharisi đơs mơ Kơnràñ lah: “Sền ne, ñchi bơh tài ală cau bơtê ồng dê lơh bơta ò geh gơnoar lơh tòm ngai Saƀat?”"],["25","Ngài đáp rằng: Các ngươi chưa đọc đến sự vua Đa-vít làm trong khi vua cùng những người đi theo bị túng đói hay sao?","Yàng Jesu ho lah: “Bol mê òhềt tŭ lơi sền sră cih bơh broă Dabit lơh tòm tŭ khai mơ ală cau lòt jat khai gơtìp ò tơi phan sa mơ jơgloh ò ơ?"],["26","Thế nào trong đời A-bia-tha làm thầy cả thượng- phẩm, vua ấy vào đền Đức Chúa Trời, ăn bánh bày ra, lại cũng cho những người đi theo ăn nữa, dầu bánh ấy chỉ những thầy tế-lễ mới được phép ăn thôi?","Tòm rài Abiatha la cau gơnoar dờng lam bồ ơn phan duh khoai, Dabit mut tòm hìu Yàng Tom Trồ dê, sa piang lă ơn pơdơng mơ kung ai ală cau jat khai in sa sơl, la piang lă mơ ò gơs cau lơi geh gơnoar sa, lòi mùng ală cau gơnoar ơn phan duh khoai in lơm.”"],["27","Đoạn, Ngài lại phán: Vì loài người mà lập ngày Sa- bát, chớ chẳng phải vì ngày Sa-bát mà dựng nên loài người.","Yàng Jesu đơs tai lah: “Ngai Saƀat neh geh bơtào gơs tài bơh niam kòn mơnus in, ò di kòn mơnus neh geh crơng gơs tài bơh ngai Saƀat."],["28","Vậy thì Con người cũng làm chủ ngày Sa-bát.","Behơ̆ gen Kòn Mơnus kung la Yàng ngai Saƀat dê sơl.”"]],"cult":{"t":"Cặp Động Từ & Từ Trái Nghĩa Đặc Sắc Trong Mác 2","lead":"Phân biệt rõ các cặp tính từ trái nghĩa và 4 sắc thái ăn uống trong sinh hoạt cộng đồng K'Ho:","pts":[["Cặp từ trái nghĩa Cũ (yau) – Mới (pa) và Tốt (niam) – Xấu (iơh)",["ào yau (áo cũ), nhồng gơltau yau (bầu da cũ) ↔ pet bài pa (miếng vải mới), tơnòm pa (rượu mới), nhồng gơltau pa (bầu da mới – Câu 21–22)","niam rlau (tốt hơn) ↔ iơh rlau tai (xấu hơn / tệ hơn nữa)"]],["Các biến thái của hành động 'Ăn uống' trong tiếng K'Ho",["sa → ăn nói chung (Câu 26: sa piang lă = ăn bánh)","ñô sa → ăn uống trò chuyện thân mật (Câu 16: ñô = uống, sa = ăn)","nggui sào → ngồi dự tiệc / ăn cỗ tại nhà chủ (Câu 15)","ơt sa → nhịn ăn / kiêng ăn (Câu 18–20: ơt = nhịn/kiềm giữ, sa = ăn)"]]]},"prac":[{"dir":"vk","q":"Tại sao các bạn lại suy nghĩ thầm trong lòng như vậy?","a":"Ñchi bơh tài bol mê kơlôi is tòm nùs behơ̆ taih?","exp":"Nguyên văn cấu trúc câu hỏi lý do của Mác 2:8: Ñchi bơh tài ... taih? (Tại sao... vậy?); kơlôi is tòm nùs = nghĩ riêng trong lòng. STT Bài Tập (Câu Cần Dịch) Đáp Án Chuẩn & Giải Thích Cấu Trúc (KPM2018)"},{"dir":"vk","q":"Hãy đứng dậy, cầm lấy chiếu/giường của bạn và trở về nhà!","a":"Ñă ntào tĕ, at cơnòng mê mơ rê hìu mê!","exp":"Cấu trúc mệnh lệnh nối tiếp trong Mác 2:11: Ñă ntào tĕ (Hãy đứng dậy), at cơnòng (cầm/vác giường), rê hìu mê (về nhà bạn)."},{"dir":"vk","q":"Người khỏe mạnh không cần thầy thuốc đâu, nhưng là người đau ốm.","a":"Cau pràn kơldang ò càng cau gơnoar sơnơm ò, mơya la cau kòp jê.","exp":"Cấu trúc đối lập ò ... ò, mơya la ... trong Mác 2:17; cau gơnoar sơnơm = thầy thuốc/bác sĩ; càng = cần."},{"dir":"vk","q":"Chúng tôi chưa bao giờ thấy công việc nào tốt đẹp như thế này.","a":"Bol hi òhềt gŏ broă lơi niam be do ò.","exp":"Dựa trên Mác 2:12 (\"Bol hi òhềt gŏ broă be do ò\"), dùng khung phủ định tuyệt đối òhềt + V + ò (chưa hề... đâu)."},{"dir":"kv","q":"Ò gơs cau lơi ai bài pa mơ jing tơmbồl di ào yau; dilah lơh behơ̆ gen pet bài pa rơp lơh gơprơt sèt ào yau.","a":"Không có người nào lấy vải mới mà khâu vá vào chiếc áo cũ; nếu làm như vậy thì miếng vải mới sẽ co rút làm rách chiếc áo cũ.","exp":"bài pa = vải mới; jing tơmbồl = khâu vá đắp vào; ào yau = áo cũ; gơprơt sèt = co rút làm rách."},{"dir":"kv","q":"Ngai Saƀat neh geh bơtào gơs tài bơh niam ia sông Giô-đanh"],["mơya gơkòl glài {gam sùm sùm}","nhưng phải mắc tội đời đời"],["mơ ai {gơnap} gơnoar bol mê in bơtrơh cà","và ban đủ quyền phép cho các ngươi đuổi quỷ"],["kòn sau {jơi kòn mơnus} in","cho con cái loài người"],["nàng Kơnràñ geh {klàs} bơh làng bol ntềt","để Ngài khỏi bị đoàn dân lấn ép"],["khai {kơnòm di} bơtau cà mơ bơtrơh cà","người nhờ vào chúa quỷ mà đuổi quỷ"],["dilah {lài ngan} ò cap cau pràn hơ̆","nếu trước hết không trói người mạnh đó"],["{Mbe} cà Satan rgơi bơtrơh Satan taih?","Làm sao Sa-tan đuổi được Sa-tan?"],["gơjrañ mơ {moat} tài bơh nùs bol khai kră kơldang","vừa giận vừa buồn"],["gơs dô nă cau klau siar {mpàng} tê","có một người nam bị teo một bàn tay"],["rcang Kơnràñ in dô nơm {ơhò dềt}","sắm sẵn cho Ngài một chiếc thuyền nhỏ"],["ai jơnau {pơnyơu} mơ đơs lah","dùng lời thí dụ mà phán rằng"],["cau klau {siar} mpàng tê","người đàn ông bị teo một bàn tay"],["bơtào {tòmsò is} mơ tòmcah is","dấy lên tự chống nghịch và chia rẽ mình"],["{tơmbic să} dê jơng Kơnràñ","sấp mình xuống nơi chân Ngài"],["Yàng Jesu mut {wơl} tòm hìu jum","Chúa Giê-su lại vào trong nhà hội"],["Dilah hìu nhă (hìu) lơi tòmcah is, gen hìu hơ̆ ò rgơi kơ̆ tai.","Nếu một gia đình tự chia rẽ nhau, thì gia đình ấy không thể đứng vững được nữa."],["Kơnràñ guh hơđang mơnơm mơ sac rwah jơt bàr nă cau nàng ơm bal mơ Kơnràñ.","Ngài đi lên trên núi và chọn mười hai người để ở cùng với Ngài."],["Cau lơi lơh jat nùs kòñ Yàng Tom Trồ dê, cau hơ̆ la oh mi, ruh lŏ mơ mè Añ jê.","Ai làm theo ý muốn của Đức Chúa Trời, người ấy là anh em, chị em và mẹ của Ta."],["Bol he geh gơnoar lơh broă niam hala broă iơh, dong klàs bơta kis hala tơnroh gơ taih?","Chúng ta được phép làm việc tốt hay việc xấu, cứu sự sống hay hủy diệt nó?"],["Tài bơh làng bol oă ngan gen tàng Kơnràñ sồr cau bơtê rcang Kơnràñ in dô nơm ơhò dềt nàng Kơnràñ geh klàs bơh làng bol ntềt.","Bởi vì đoàn dân đông lắm cho nên Ngài bảo các môn đồ chuẩn bị cho Ngài một chiếc thuyền nhỏ để Ngài khỏi bị dân chúng lấn ép."],["Tŭ hơ̆ Kơnràñ sền lam di bol khai, gơjrañ mơ moat tài bơh nùs bol khai kră kơldang mơ tìs nrah.","Lúc đó Ngài đưa mắt nhìn khắp họ, vừa giận vừa buồn bởi vì tấm lòng của họ cứng cỏi và ngoan cố (sai lệch)."]],"rs":[["{Mbe} cà Satan {rgơi} bơtrơh Satan {taih}?","Làm sao Sa-tan đuổi được Sa-tan?"],["cah is","chia tách"],["tòmcah is","tự chia rẽ nhau"],["→ sò","nghịch thù"],["tòmsò is","tự chống nghịch mình"],["Yàng Jesu mut {wơl} tòm hìu jum","Chúa lại vào nhà hội"],["Ai... thì người ấy...","Cau lơi ... cau hơ̆"],["Bơh cau lơi lơh jat nùs kòñ Yàng Tom Trồ dê, cau hơ̆ la oh mi, ruh lŏ mơ mè Añ jê.","Ai làm theo ý Chúa, người ấy là anh chị em và mẹ Ta"],["Trước hết phải... rồi mới...","lài ngan ... sồng geh"],["...dilah lài ngan ò cap cau pràn hơ̆ , gen sồng geh phà kơñau hìu khai dê.","nếu trước hết không trói người mạnh đó, rồi mới cướp nhà người được"],["Mỗi khi / Hễ khi nào... thì...","Kòp dơ̆ ... gen"],["Kòp dơ̆ ală cà gŏ Kơnràñ gen tơmbic să dê jơng Kơnràñ...","Mỗi khi các tà ma thấy Ngài thì sấp mình xuống dưới chân Ngài"],["Xem thử... có... hay không","... hala ò"],["Bol khai kơp sền Kơnràñ sơmbòi cau hơ̆ tòm ngai Saƀat hala ò, nàng yă Kơnràñ.","Họ rình xem Ngài có chữa người đó trong ngày Sa-bát hay không"],["Kơnràñ sac rwah jơt bàr nă sơnđan la cau gơnoar bơto dờng.","Ngài chọn lập mười hai người gọi là sứ đồ"]],"rules":[{"t":"Câu hỏi phương thức \"Làm sao / Thế nào?\" (Mbe ... taih?)","f":"Hỏi: {Mbe} + [{S}] + {rgơi} + [V] + {taih}? Mục đích: {nàng mbe} lơh tồ + [V]","ex":[["{Mbe} cà Satan {rgơi} bơtrơh Satan {taih}?","Làm sao Sa-tan đuổi được Sa-tan?"]],"c":"{Mbe} đặt đầu câu hỏi mang nghĩa \"Làm sao / Bằng cách nào?\"; {nàng mbe} lơh tồ = để làm sao cho."},{"t":"Tiền tố tương hỗ tòm- (Tự... lẫn nhau)","f":"{tòm}- + [Gốc động từ] + (is) = tác động qua lại / tự chia rẽ nhau","ex":[["cah is","chia tách"],["tòmcah is","tự chia rẽ nhau"],["→ sò","nghịch thù"],["tòmsò is","tự chống nghịch mình"]],"c":"Tiền tố {tòm}- gắn trước động từ diễn tả hành động tương hỗ (lẫn nhau) hoặc tự phản kháng nội bộ."},{"t":"Mệnh đề quan hệ phổ quát \"Ai... thì người ấy...\" (Cau lơi ... cau hơ̆ )","f":"Cau lơi + [Mệnh đề V], cau hơ̆ {la} + [Danh từ] (hoặc gen...)","ex":[["Ai... thì người ấy...","Cau lơi ... cau hơ̆"],["Bơh cau lơi lơh jat nùs kòñ Yàng Tom Trồ dê, cau hơ̆ la oh mi, ruh lŏ mơ mè Añ jê.","Ai làm theo ý Chúa, người ấy là anh chị em và mẹ Ta"]],"c":"Cặp đại từ cau lơi ... cau hơ̆ ... khớp hoàn toàn với \"người nào / ai ... thì người ấy ...\" trong tiếng Việt."},{"t":"Điều kiện tiên quyết \"Trước hết phải... rồi mới...\" (lài ngan ... sồng geh)","f":"{dilah lài ngan ò} + [V1], {gen sồng geh} + [V2]","ex":[["Trước hết phải... rồi mới...","lài ngan ... sồng geh"],["...dilah lài ngan ò cap cau pràn hơ̆ , gen sồng geh phà kơñau hìu khai dê.","nếu trước hết không trói người mạnh đó, rồi mới cướp nhà người được"]],"c":"{lài ngan} = trước nhất / đầu tiên; {sồng geh} + V = rồi mới được / mới có thể làm."},{"t":"Cấu trúc tần suất \"Mỗi khi / Hễ khi nào... thì...\" (Kòp dơ̆ ... gen)","f":"{Kòp dơ̆} + [Mệnh đề thời gian] + {gen} + [Mệnh đề chính]","ex":[["Mỗi khi / Hễ khi nào... thì...","Kòp dơ̆ ... gen"],["Kòp dơ̆ ală cà gŏ Kơnràñ gen tơmbic să dê jơng Kơnràñ...","Mỗi khi các tà ma thấy Ngài thì sấp mình xuống dưới chân Ngài"]],"c":"{kòp} (mỗi/đếm) + {dơ̆} (lần/khi) = Mỗi lần / Hễ khi nào."},{"t":"Câu hỏi gián tiếp \"Xem thử... có... hay không\" (... hala ò)","f":"[Động từ quan sát] + [Mệnh đề] + {hala ò}","ex":[["Xem thử... có... hay không","... hala ò"],["Bol khai kơp sền Kơnràñ sơmbòi cau hơ̆ tòm ngai Saƀat hala ò, nàng yă Kơnràñ.","Họ rình xem Ngài có chữa người đó trong ngày Sa-bát hay không"]],"c":"Đặt {hala ò} ở cuối mệnh đề phụ để diễn tả ý \"có... hay không\"."},{"t":"Trạng ngữ nối tiếp \"Sau đó\" (Lồc behơ̆ ) & Lặp lại (V + wơl)","f":"{Lồc behơ̆} = Sau đó, rồi thì Động từ + {wơl} = Lại (lặp lại)","ex":[["Yàng Jesu mut {wơl} tòm hìu jum","Chúa lại vào nhà hội"]],"c":"{wơl} đặt ngay sau động từ mang nghĩa \"lại / lần nữa\" (mut wơl = lại vào; sơnđan wơl = đặt tên lại)."},{"t":"Quy tắc ghép Số đếm Hàng chục (jơt → = 10 jơt bàr = 12)","f":"{jơt} (10) + [Số đơn vị] + [Loại từ: nă / nơm]","ex":[["Kơnràñ sac rwah jơt bàr nă sơnđan la cau gơnoar bơto dờng.","Ngài chọn lập mười hai người gọi là sứ đồ"]],"c":"Ghép trực tiếp {jơt} (mười) + đơn vị: {jơt} dùl (11), {jơt} bàr (12), {jơt} pe (13), {jơt} poan (14), {jơt} pram (15)..."}],"dl":[{"t":"Giới thiệu đại gia đình & Thăm hỏi người thân","turns":[["A","Ne, mè, oh mi mơ ruh lŏ mê dê gam ntào hơ bơdih măng hìu nàng jòi mê!","Này, mẹ, các anh em và chị em gái của bạn đang đứng ở ngoài cửa để tìm bạn kìa!"],["B","Ơi, hòi bol khai mut mo tĕ tòm hìu! Hìu nhă añ dê pơjum bal mho do nàng ñô sa mơ bơyai bal.","Ôi, hãy gọi họ bước vào trong nhà đi! Gia đình của tôi tụ họp cùng nhau chiều nay để ăn uống và trò chuyện."],["A","Hìu nhă mê dê đông vui ngan! Cau lơi kung lơh jat nùs kòñ mè bèp dê.","Gia đình của bạn đông vui thật! Ai nấy đều làm theo ý muốn của cha mẹ."]],"note":"Tiếng K'Ho phân biệt rất rõ các mối quan hệ huyết thống trong gia đình (hìu nhă = người nhà/gia đình): bên cạnh bèp (cha), mè (mẹ), kòn (con) và oh (em) đã gặp ở Bài 1, Mác 3 bổ sung oh mi (anh em nói chung), ruh lŏ (chị em gái), và kòn sau (con cháu / hậu tự – Câu 28). Để chỉ \"ý muốn / lòng mong ước\" của một người, dùng cụm danh từ nùs kòñ [Chủ sở hữu] dê (Câu 35)."},{"t":"Khuyên bạn giữ bình tĩnh và mở lòng lắng nghe","turns":[["A","Ñchi bơh tài mê ơm mŏ mŏ mơ mặt mê moat behơ̆ taih? Mê gam gơjrañ oh mê dê ơ?","Tại sao bạn ngồi im lặng và vẻ mặt buồn rầu như vậy? Bạn đang giận em của bạn à?"],["B","Añ moat tài bơh añ neh bơto sồr khai oă dơ̆ , mơya nùs khai gam kră kơldang, ò kòñ kơno.","Tôi buồn bởi vì tôi đã khuyên dạy em ấy nhiều lần, nhưng lòng nó vẫn cứng cỏi, không chịu nghe."],["A","Mê bañ gơjrañ tai! Bol he đơs mơ khai mơ bơta kòñ gơboh, khai rơp hiểu mơ sửa đổi.","Bạn đừng giận nữa! Chúng ta hãy nói với em ấy bằng tình yêu thương, em ấy sẽ hiểu và sửa đổi."]],"note":"Tiếng K'Ho phân biệt rất rõ sắc thái của cái nhìn: sền (nhìn/xem nói chung), kơp sền (rình xem / theo dõi ngầm với ý đồ bắt lỗi – Câu 2), và sền lam (đưa mắt nhìn khắp một vòng quanh mọi người – Câu 5, 34)."},{"t":"Khám tay bị đau & Tránh chỗ đông người","turns":[["A (Bác sĩ)","Ơ kòn, ñă tĕ mơ ntào digùl do! Pò tê mê dê nàng añ sền mpàng tê bị đau.","Này con, hãy dậy và đứng vào giữa đây! Hãy duỗi bàn tay của con ra để bác sĩ xem bên bàn tay bị đau."],["B","Mpàng tê añ dê neh bòi oă rau! Ưnngài thầy sơnơm neh dong sơmbòi añ in.","Bàn tay của cháu đã lành nhiều rồi! Cảm ơn bác sĩ đã giúp chữa lành cho cháu."],["A","Hôm nay tòm chợ làng bol ntềt đông lắm, mê pleh lòt rê hìu nghỉ ngơi tĕ nhă!","Hôm nay ở ngoài chợ dân chúng chen lấn đông lắm, cháu hãy tránh ra về nhà nghỉ ngơi đi nhé!"]],"note":"Khi chỉ \"một bên\" của các bộ phận cơ thể có đôi (như bàn tay, bàn chân, con mắt), tiếng K'Ho dùng loại từ mpàng: mpàng tê = một bên bàn tay (Câu 1, 3: cau klau siar mpàng tê = người đàn ông bị teo một bàn tay). Động từ pò (vốn nghĩa là mở ra ở Bài 1–2) khi đi với tê (pò tê) mang nghĩa là duỗi / giơ thẳng bàn tay ra (Câu 5)."},{"t":"Lên núi Lang Biang & Chọn nhóm thanh niên trong buôn","turns":[["A","Drim do bol he rơp guh hơđang mơnơm Lang Biang. Mê neh sac rwah bao nhiêu nă cau lòt bal?","Sáng nay chúng ta sẽ đi lên núi Lang Biang. Bạn đã chọn được bao nhiêu người cùng đi?"],["B","Añ neh sac rwah jơt bàr (12) nă thanh niên pràn kơldang bơh ƀòn bol he dê mơ ƀòn đah ne hiòng.","Tôi đã chọn mười hai (12) người thanh niên khỏe mạnh từ buôn của chúng ta và buôn bên kia sông."],["A","Niam ngan! Bol he lòt sớm tĕ trước khi trồ mho gơs mưa mơ ntơr kơnàs!","Tốt lắm! Chúng ta hãy đi sớm trước khi trời chiều có mưa và sấm sét!"]],"note":"Khi đặt tên mới hoặc gọi một người bằng tên khác, tiếng K'Ho dùng cấu trúc sơnđan wơl [Người] la [Tên mới] (Câu 16, 17). Để diễn tả việc chọn lựa và giao quyền đầy đủ cho ai, dùng cặp động từ sac rwah (tuyển chọn / lập nên – Câu 13, 14) và ai gơnap gơnoar [Người nhận] in (trao đủ thẩm quyền cho ai – Câu 15)."},{"t":"Khuyên anh chị em trong nhà đoàn kết yêu thương nhau","turns":[["A","Añ đơs ngan mơ bol mê: dilah hìu nhă bol he dê tòmcah is mơ tòmsò is, gen hìu nhă bol he ò rgơi kơ̆ pràn tai!","Tôi nói thật với các bạn/các con: nếu gia đình của chúng ta tự chia rẽ và chống đối lẫn nhau, thì gia đình chúng ta không thể đứng vững mạnh được nữa!"],["B","Mê đơs đúng ngan! Oh mi mơ ruh lŏ tòm dô hìu pal kòñ gơboh bal mơ dong klàs nhau tòm mọi broă.","Bạn nói đúng lắm! Anh em và chị em trong một nhà phải yêu thương nhau và giúp đỡ nhau trong mọi công việc."]],"note":"Để mở đầu một lời tuyên bố quan trọng và chân thật tuyệt đối, tiếng K'Ho dùng cụm Añ đơs ngan mơ bol mê... (Quả thật / Tôi nói thật với các bạn... – Câu 28). Trong lập luận giả định (Câu 24–27), động từ kơ̆ mang nghĩa là đứng vững / tồn tại bền vững (ò rgơi kơ̆ tai = không thể đứng vững được nữa)."}],"ds":[],"vr":[["Đề","Người teo tay","Yàng Jesu sơmbòi cau siar tê"],["1","Lần khác, Đức Chúa Jêsus vào nhà hội, ở đó có một người nam teo bàn tay.","Yàng Jesu mut wơl tòm hìu jum cau Juda, tềng hơ̆ gơs dô nă cau klau siar mpàng tê."],["2","Chúng rình xem thử Ngài có chữa người đó trong ngày Sa-bát chăng, đặng cáo Ngài.","Bol khai kơp sền Kơnràñ sơmbòi cau hơ̆ tòm ngai Saƀat hala ò, nàng yă Kơnràñ."],["3","Ngài phán cùng người teo tay rằng: Hãy dậy, đứng chính giữa đây.","Yàng Jesu đơs mơ cau siar mpàng tê lah: “Ñă tĕ, ntào digùl do.”"],["4","Rồi Ngài hỏi họ rằng: Trong ngày Sa-bát, nên làm việc lành hay việc dữ, cứu người hay giết người? Nhưng họ đều nín-lặng.","Lồc behơ̆ Kơnràñ lùp bol khai lah: “Tòm ngai Saƀat geh gơnoar lơh broă niam hala broă iơh, dong klàs bơta kis hala tơnroh gơ taih?” Mơya bol khai ơm mŏ mŏ."],["5","Bấy giờ, Ngài lấy mắt liếc họ, vừa giận vừa buồn vì lòng họ cứng-cỏi, rồi phán cùng người nam rằng: Hãy giơ tay ra. Người giơ ra, thì tay được lành.","Tŭ hơ̆ Kơnràñ sền lam di bol khai, gơjrañ mơ moat tài bơh nùs bol khai kră kơldang mơ tìs nrah, lồc behơ̆ Kơnràñ đơs mơ cau klau lah: “Pò tê mê dê.” Gen khai pò tê mơ gơ bòi."],["6","Các người Pha-ri-si đi ra, tức thì bàn-luận với phe Hê-rốt nghịch cùng Ngài, đặng giết Ngài đi.","Tŭ hơ̆ mo ală cau Pharisi lik hơ bơdih mơ bơyai bal mơ bơnòr cau Herôt dê nàng mbe lơh tồ tơnchơt Kơnràñ."],["Đề","Đoàn dân đông nơi bờ biển Ga-li-lê","Mpồl làng bol di gah đàlềng Galile"],["7","Đức Chúa Jêsus cùng môn-đồ Ngài lánh ra nơi bờ biển, có đoàn dân đông lắm từ xứ Ga-li-lê đến theo Ngài.","Yàng Jesu mơ ală cau bơtê Kơnràñ pleh lòt hơ gah đàlềng; gơs mpồl làng bol oă ngan bơh lơgar Galile lòt tus jat Kơnràñ."],["8","Từ xứ Giu-đê, thành Giê-ru-sa-lem, xứ Y-đu-mê, xứ bên kia sông Giô-đanh, miền xung-quanh thành Ty-rơ và thành Si-đôn cũng vậy, dân đông lắm, nghe nói mọi việc Ngài làm, thì đều đến cùng Ngài.","Bơh lơgar Jude, Jerusalem, lơgar Idume, lơgar đah ne hiòng Jordan, gùt dar Tirơ mơ Sidôn, kung gơs làng bol gal ngan kơno yal ală broă Kơnràñ lơh gen lòt tus hơ Kơnràñ."],["9","Bởi cớ dân đông, nên Ngài biểu môn-đồ sắm cho mình một chiếc thuyền nhỏ sẵn-sàng, đặng cho khỏi bị chúng lấn ép Ngài quá.","Tài bơh làng bol oă ngan gen tàng Kơnràñ sồr cau bơtê rcang Kơnràñ in dô nơm ơhò dềt nàng Kơnràñ geh klàs bơh làng bol ntềt."],["10","Vì Ngài đã chữa lành nhiều kẻ bệnh, nên nỗi ai nấy có bệnh chi cũng đều áp đến gần để rờ Ngài.","Bơh Kơnràñ neh sơmbòi oă cau kòp jê gen tàng cau lơi gơs bơta kòp jê lơi kung ntềt sơrlèt nàng ƀur di Kơnràñ."],["11","Khi tà-ma thấy Ngài, bèn sấp mình xuống nơi chân Ngài, mà kêu lên rằng: Thầy là Con Đức Chúa Trời!","Kòp dơ̆ ală cà gŏ Kơnràñ gen tơmbic să dê jơng Kơnràñ mơ hòi driau lah: “Kơnràñ la Kòn Yàng Tom Trồ!”"],["12","Song Ngài nghiêm cấm chúng nó chớ tỏ cho ai biết mình.","Mơya Kơnràñ bơkơŭ bol gơ, ò ai yal cau lơi in git Kơnràñ."],["Đề","Sự chọn mười hai sứ-đồ","Yàng Jesu sac rwah jơt bàr nă cau bơtê"],["13","Kế đó, Đức Chúa Jêsus lên trên núi, đòi những người Ngài muốn, thì những người ấy đến kề Ngài.","Chòp Yàng Jesu guh hơđang mơnơm, hòi ală cau jat nùs Kơnràñ kòñ, gen ală cau hơ̆ lòt tus hơ Kơnràñ."],["14","Ngài bèn lập mười hai người, gọi là sứ-đồ, để ở cùng Ngài và sai đi giảng đạo,","Kơnràñ sac rwah jơt bàr nă sơnđan la cau gơnoar bơto dờng. Kơnràñ đơs mơ bol khai lah: “Añ sac rwah bol mê nàng ơm bal mơ Añ, mơ sồr lòt bơto yal,"],["15","lại ban cho quyền-phép đuổi quỉ.","mơ ai gơnap gơnoar bol mê in bơtrơh cà.”"],["16","Nầy là mười hai sứ-đồ Ngài đã lập: Si-môn, Ngài đặt tên là Phi-e-rơ;","Do la jơt bàr nă cau gơnoar bơto dờng mơ Kơnràñ neh sac: Simôn Kơnràñ sơnđan wơl la Pier,"],["17","Gia-cơ con Xê-bê-đê, và Giăng em Gia-cơ, Ngài lại đặt tên hai người là Bô-a-nẹt, nghĩa là con trai của sấm-sét;","Jakơ kòn Sebede, mơ Jang la oh Jakơ dê, Kơnràñ sơnđan wơl bàr nă bol khai la Bôanerges, cih tơlik hơ̆ la ală kòn klau ntơr kơnàs dê;"],["18","Anh-rê, Phi-líp, Ba-thê-lê-my, Ma-thi-ơ, Thô-ma, Gia-cơ con A-phê, Tha-đê, Si-môn người Ca-na-an,","Andre, Philip, Bathelemi, Mathiơ, Thôma, Jakơ kòn Alphe, Thade, Simôn cau Kanaan,"],["19","và Giu-đa Ích-ca-ri-ốt, chính tên nầy đã phản Ngài.","mơ Juda Iskariôt la cau neh geh dră dê Kơnràñ."],["Đề","Tội phạm đến Đức Thánh-Linh","Yàng Jesu mơ Beeljebul"],["20","Đức Chúa Jêsus cùng môn-đồ vào trong một cái nhà; đoàn dân lại nhóm-họp tại đó, đến nỗi Ngài và môn-đồ không ăn được.","Yàng Jesu mut tòm dô nơm hìu. Mpồl làng bol pơjum tai, tian gơs Kơnràñ mơ ală cau bơtê ò rgơi sào."],["21","Những bạn-hữu Ngài nghe vậy, bèn đến để cầm- giữ Ngài; vì người ta nói Ngài đã mất trí-khôn.","Ală cau tòm hìu nhă Kơnràñ dê kơno behơ̆ gen tus nàng kup gàr Kơnràñ, bơh bol khai đơs lah: “Kơnràñ neh roh dơngoh jak rau.”"],["22","Có các thầy thông-giáo ở thành Giê-ru-sa-lem xuống, nói rằng: Người bị quỉ Bê-ên-xê-bun ám, và nhờ phép chúa quỉ mà trừ quỉ.","Ai ală cau bơto bơta boh lam mù bơh Jerusalem đơs lah: “Cau do kòl Beeljebul lơh, khai kơnòm di bơtau cà mơ bơtrơh cà.”"],["23","Song Đức Chúa Jêsus kêu họ đến, dùng lời thí-dụ mà phán rằng: Sao quỉ Sa-tan đuổi được quỉ Sa- tan?","Mơya Yàng Jesu hòi bol khai lòt tus, ai jơnau pơnyơu mơ đơs lah: “Mbe cà Satan rgơi bơtrơh Satan taih?"],["24","Nếu một nước tự chia nhau, thì nước ấy không thể còn được;","Dilah lơgar lơi tòmcah is gen lơgar hơ̆ ò rgơi kơ̆ tai,"],["25","Lại nếu một nhà tự chia nhau, thì nhà ấy không thể còn được.","mơ dilah hìu lơi tòmcah is gen hìu hơ̆ kung ò rgơi kơ̆ tai."],["26","Vậy, nếu quỉ Sa-tan tự dấy lên nghịch cùng mình, tất nó bị chia-xé ra, không thể còn được; song nó đã gần đến cùng rồi.","Behơ̆ dilah lơgar cà Satan bơtào tòmsò is mơ tòmcah is gen ò gơs kơ̆ tai ò, mơya neh tus di lồi dut rài gơ rau."],["27","Chẳng ai có thể vào nhà một người mạnh sức cướp lấy của người, mà trước hết không trói người lại; phải trói người lại, rồi mới cướp nhà người được.","Ò gơs cau lơi rgơi mut tòm hìu cau pràn kơldang mơ phà kơñau phan, dilah lài ngan ò cap cau pràn hơ̆ , gen sồng geh phà kơñau hìu khai dê."],["28","Quả thật, ta nói cùng các ngươi, mọi tội-lỗi sẽ tha cho con-cái loài người, và hết thảy những lời phạm-thượng họ sẽ nói ra cũng vậy;","Añ đơs ngan mơ bol mê, jơh ală tồi glài rơp geh toh kòn sau jơi kòn mơnus in, mơ jơh ală jơnau tràl sơrbil bol khai đơs kung behơ̆ sơl;"],["29","nhưng ai nói phạm đến Đức Thánh-Linh thì chẳng hề được tha, phải mắc tội đời đời.","mơya cau lơi đơs tràl sơrbil di Yàng Hwềng Goh gen ò gơs tŭ lơi geh toh glài ò, mơya gơkòl glài gam sùm sùm.”"],["30","Ngài phán như vậy, vì họ nói rằng: Người bị tà-ma ám.","Yàng Jesu đơs behơ̆ tài bơh bol hơ̆ đơs lah: “Khai kòl cà lơh.”"],["Đề","Mẹ và anh em Đức Chúa Jêsus","Mè mơ oh mi Yàng Jesu dê"],["31","Mẹ và anh em Ngài đến, đứng ngoài sai kêu Ngài.","Mè mơ oh mi Yàng Jesu lòt tus, ntào hơ bơdih mơ sồr cau hòi Kơnràñ."],["32","Đoàn dân vẫn ngồi chung-quanh Ngài. Có kẻ thưa rằng: Nầy, mẹ và anh em thầy ở ngoài kia, đương tìm thầy.","Mpồl làng bol nggui gùt dar Yàng Jesu, đơs mơ Kơnràñ lah: “Ne, mè mơ oh mi ồng dê ntào bơdih jòi ồng.”"],["33","Song Ngài phán cùng họ rằng: Ai là mẹ ta, ai là anh em ta?","Mơya Yàng Jesu ho lah: “Ñcau la mè mơ oh mi Añ taih?”"],["34","Ngài lại đưa mắt liếc những kẻ ngồi chung-quanh mình mà phán rằng: Kìa là mẹ ta và anh em ta!","Kơnràñ sền lam ală cau nggui gùt dar mơ đơs lah: “Do la mè Añ mơ oh mi Añ!"],["35","Ai làm theo ý-muốn Đức Chúa Trời, nấy là anh em, chị em, và mẹ ta vậy.","Bơh cau lơi lơh jat nùs kòñ Yàng Tom Trồ dê, cau hơ̆ la oh mi, ruh lŏ mơ mè Añ jê.”"]],"cult":{"t":"Các Thành Ngữ Chỉ Tâm Tính & Trí Tuệ Trong Mác 3","lead":"Cách người K'Ho dùng hình ảnh cụ thể để miêu tả trạng thái nội tâm và trí tuệ:","pts":[["Cụm thành ngữ miêu tả sự bảo thủ, cứng lòng (Câu 5)",["nùs bol khai kră kơldang mơ tìs nrah → lòng họ chai cứng và ngang ngạnh (nùs = tấm lòng, kră kơldang = già/cứng đơ, tìs nrah = sai lệch)","gơjrañ (giận) & moat (buồn đau / thương cảm)"]],["Thành ngữ chỉ sự mất tỉnh táo / quẫn trí (Câu 21)",["roh dơngoh jak → mất trí khôn / quẫn trí (roh = mất đi, dơngoh jak = sự khôn ngoan, minh mẫn)"]],["Cụm từ giải thích nghĩa tên gọi (Câu 17)",["cih tơlik hơ̆ la... → dịch nghĩa ra tức là... (cih = viết/dịch, tơlik = làm rõ ra, hơ̆ la = đó là)"]]]},"prac":[{"dir":"vk","q":"Nếu một gia đình tự chia rẽ nhau, thì gia đình ấy không thể đứng vững được nữa.","a":"Dilah hìu nhă (hìu) lơi tòmcah is, gen hìu hơ̆ ò rgơi kơ̆ tai.","exp":"Cấu trúc điều kiện Dilah... gen... kết hợp tiền tố tương hỗ tòmcah is (tự chia rẽ nhau) và động từ kơ̆ (đứng vững) từ Mác 3:25."},{"dir":"vk","q":"Ai làm theo ý muốn của Đức Chúa Trời, người ấy là anh em, chị em và mẹ của Ta.","a":"Cau lơi lơh jat nùs kòñ Yàng Tom Trồ dê, cau hơ̆ la oh mi, ruh lŏ mơ mè Añ jê.","exp":"Mệnh đề quan hệ phổ quát Cau lơi ... cau hơ̆ la ... (Ai... người ấy là...) trong Mác 3:35; nùs kòñ = ý muốn; ruh lŏ = chị em gái. STT Bài Tập (Câu Cần Dịch) Đáp Án Chuẩn & Giải Thích Cấu Trúc (KPM2018)"},{"dir":"vk","q":"Ngài đi lên trên núi và chọn mười hai người để ở cùng với Ngài.","a":"Kơnràñ guh hơđang mơnơm mơ sac rwah jơt bàr nă cau nàng ơm bal mơ Kơnràñ.","exp":"guh hơđang mơnơm = đi lên trên núi (Mác 3:13); sac rwah = chọn lựa; jơt bàr nă = 12 người (Mác 3:14)."},{"dir":"vk","q":"Chúng ta được phép làm việc tốt hay việc xấu, cứu sự sống hay hủy diệt nó?","a":"Bol he geh gơnoar lơh broă niam hala broă iơh, dong klàs bơta kis hala tơnroh gơ taih?","exp":"Câu hỏi lưỡng nan với liên từ hala (hay là) từ Mác 3:4; broă niam = việc lành/tốt; broă iơh = việc dữ/xấu."},{"dir":"kv","q":"Tài bơh làng bol oă ngan gen tàng Kơnràñ sồr cau bơtê rcang Kơnràñ in dô nơm ơhò dềt nàng Kơnràñ geh klàs bơh làng bol ntềt.","a":"Bởi vì đoàn dân đông lắm cho nên Ngài bảo các môn đồ chuẩn bị cho Ngài một chiếc thuyền nhỏ để Ngài khỏi bị dân chúng lấn ép.","exp":"tài bơh ... gen tàng ... = bởi vì... cho nên...; rcang Kơnràñ in = chuẩn bị cho Ngài; ơhò dềt = thuyền nhỏ; ntềt = lấn ép."},{"dir":"kv","q":"Tŭ hơ̆ Kơnràñ sền lam di bol khai, gơjrañ mơ moat tài bơh nùs bol khai kră kơldang mơ tìs nrah.","a":"Lúc đó Ngài đưa mắt nhìn khắp họ, vừa giận vừa buồn bởi vì tấm lòng của họ cứng cỏi và ngoan cố (sai lệch).","exp":"sền lam = nhìn khắp; gơjrañ mơ moat = giận và buồn; nùs kră kơldang = lòng chai cứng."}]},{"n":4,"t":"Ngôn Ngữ Nông Nghiệp, Thiên Nhiên, Đo Lường & Dụ Ngôn","words":[["sih","Gieo, vãi hạt (sih); người gieo giống (cau sih gar)","Gieo, vãi hạt","Động / Danh từ","Ne, {cau sih gar} lik lòt nàng sih","Này, người gieo giống đi ra đặng gieo"],["rung","Rơi xuống, rụng xuống (rung); lấp đất (gơbờr); sâu (jrô)","Rơi xuống, rụng xuống","Động / Tính từ","",""],["tiah lŭ","Nơi đất đá sỏi (tiah lŭ, lŭ = đá); bụi gai (lò); đất tốt (ù niam)","Nơi đất đá sỏi, bụi gai","Cụm danh từ","",""],["ryas","Rễ cây (ryas); thân cây (tòm); cành/nhành (ntê); lá/mầm (nha)","Rễ cây, thân cây","Danh từ","tài bơh ò gơs {ryas} gen tàng gơro","vì không có rễ nên bị héo"],["gơñòp","Bị nắng thiêu đốt (gơñòp); khô héo (gơro); bị nghẹt ngòi (gơrềt)","Bị nắng thiêu đốt, khô héo","Động từ","",""],["sơnyùr","Bông lúa, gié lúa (sơnyùr); chín (dum); lưỡi hái/liềm (mơ̆ ); gặt (toès)","Bông lúa, gié lúa","Danh / Động
